<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Past Participle (Verb 3) Table</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --bg: #f3f4f6;
    --card: #ffffff;
    --text: #1f2937;
    --border: #fca5a5;
    --header-bg: #fee2e2;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 680px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 3px solid #fecaca;
  }

  .header-icon {
    font-size: 2rem;
  }

  h2 {
    margin: 0;
    font-size: 1.35rem;
    color: #991b1b;
    font-weight: 700;
    line-height: 1.4;
  }

  .verb-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .verb-table th {
    background-color: var(--header-bg);
    color: #991b1b;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    text-align: left;
    border-bottom: 2px solid var(--border);
  }

  .verb-table td {
    padding: 12px 16px;
    border-bottom: 1px solid #fecaca;
    vertical-align: middle;
  }

  .verb-table tr:last-child td {
    border-bottom: none;
  }

  .verb-table tr:nth-child(even) {
    background-color: #fff5f5;
  }

  .num-col {
    width: 40px;
    font-weight: 700;
    color: #ef4444;
    text-align: center;
  }

  .verb-col {
    font-size: 1.1rem;
    font-weight: 600;
    color: #1f2937;
    width: 35%;
  }

  .input-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    font-size: 1rem;
    padding: 8px 12px;
    border: 1.5px solid #fca5a5;
    border-radius: 8px;
    outline: none;
    font-weight: 600;
    color: #1f2937;
    background-color: #ffffff;
    transition: all 0.2s ease;
  }

  input[type="text"]:focus {
    border-color: #ef4444;
    box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
  }

  .audio-btn {
    background: #fef2f2;
    border: 1px solid #fca5a5;
    cursor: pointer;
    padding: 6px 10px;
    font-size: 1.1rem;
    line-height: 1;
    border-radius: 8px;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .audio-btn:hover {
    background-color: #fee2e2;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="header-icon">🎬</span>
    <h2>Write the past participle (verb 3) of these words. Complete this table!</h2>
  </div>

  <table class="verb-table">
    <thead>
      <tr>
        <th class="num-col">#</th>
        <th>Verb 1 (Base form)</th>
        <th>Past Participle (Verb 3)</th>
      </tr>
    </thead>
    <tbody>

      <tr>
        <td class="num-col">1</td>
        <td class="verb-col">see</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('see', 'seen')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">2</td>
        <td class="verb-col">be</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('be', 'been')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">3</td>
        <td class="verb-col">do</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('do', 'done')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">4</td>
        <td class="verb-col">take</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('take', 'taken')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">5</td>
        <td class="verb-col">learn</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('learn', 'learned')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">6</td>
        <td class="verb-col">cut</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('cut', 'cut')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">7</td>
        <td class="verb-col">read</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <!-- Произношение V3 read передается как 'red' [red] -->
            <button class="audio-btn" onclick="speakWord('read', 'red')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">8</td>
        <td class="verb-col">write</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('write', 'written')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">9</td>
        <td class="verb-col">work</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('work', 'worked')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

      <tr>
        <td class="num-col">10</td>
        <td class="verb-col">look</td>
        <td>
          <div class="input-wrapper">
            <input type="text" placeholder="Type verb 3..." autocomplete="off">
            <button class="audio-btn" onclick="speakWord('look', 'looked')" title="Listen">🔊</button>
          </div>
        </td>
      </tr>

    </tbody>
  </table>
</div>

<script>
  function speakWord(v1, v3Phonetic) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      
      // Формируем четкую цепочку произношения V1 ... V3
      const textToSpeak = `${v1}. ${v3Phonetic}`;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // Слегка замедленный темп для четкого протяжного звучания гласных
      
      window.speechSynthesis.speak(utterance);
    }
  }
</script>

</body>
</html>
