<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2. Доповни речення: is або are + прийменник</title>
<style>
  :root {
    --bg-color: #f0f9ff;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --accent-color: #0284c7;
    --accent-hover: #0369a1;
    --border-color: #bae6fd;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px;
    border: 3px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15);
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
  }

  .title {
    font-size: 1.6rem;
    font-weight: 800;
    color: #0369a1;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 1rem;
    color: #0284c7;
    background: #e0f2fe;
    padding: 10px 18px;
    border-radius: 12px;
    display: inline-block;
  }

  /* Rule Box */
  .rule-box {
    background-color: #e0f2fe;
    border: 2px dashed var(--border-color);
    border-radius: 16px;
    padding: 16px 20px;
    margin-bottom: 28px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #0369a1;
  }

  .rule-tip {
    margin-top: 8px;
    font-size: 0.95rem;
    color: #0284c7;
  }

  /* Task List */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 28px;
  }

  .task-card {
    background-color: #ffffff;
    border: 2px solid var(--border-color);
    border-radius: 18px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .ukr-translation {
    font-size: 0.95rem;
    font-weight: 700;
    color: #64748b;
    margin-left: 34px;
  }

  .sentence-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 1.15rem;
    font-weight: 800;
    color: #0369a1;
  }

  .sentence-num {
    color: var(--accent-color);
    font-size: 1.2rem;
    min-width: 24px;
  }

  .gap-input {
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1e293b;
    background-color: #e0f2fe;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 6px 12px;
    outline: none;
    min-width: 140px;
    max-width: 220px;
    transition: all 0.2s ease;
  }

  .gap-input:focus {
    border-color: var(--accent-color);
    background-color: #ffffff;
  }

  /* Speaker Button */
  .speaker-btn {
    background: #e0f2fe;
    border: 2px solid var(--border-color);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    margin-left: auto;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background-color: var(--accent-color);
    color: #ffffff;
    transform: scale(1.1);
  }

  .note-box {
    background: #fef3c7;
    border: 2px solid #fde047;
    color: #854d0e;
    border-radius: 14px;
    padding: 12px 18px;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 24px;
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .btn-reset {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    padding: 10px 24px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #64748b;
    color: #ffffff;
    transition: all 0.2s ease;
  }

  .btn-reset:hover {
    background: #475569;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 class="title">2. Доповни речення: is або are + прийменник</h2>
    <p class="subtitle">Використовуй in, on, under, next to. Український переклад допоможе обрати прийменник.</p>
  </div>

  <div class="rule-box">
    <div><strong>Зразок:</strong> Два коти в коробці.</div>
    <div>Two cats <strong>are in</strong> the box.</div>
  </div>

  <div class="task-list" id="task-container"></div>

  <div class="note-box">
    💡 <strong>Пам'ятай:</strong> <em>furniture</em> — незлічуване слово, тому <strong>The furniture is...</strong>
  </div>

  <div class="controls">
    <button class="btn-reset" onclick="resetExercise()">Скинути 🔄</button>
  </div>
</div>

<script>
  const taskData = [
    { num: 1, ukr: "Меблі в кімнаті.", before: "The furniture", after: "the room." },
    { num: 2, ukr: "Дві книжки на столі.", before: "Two books", after: "the table." },
    { num: 3, ukr: "Душ поруч із ванною.", before: "The shower", after: "the bath." },
    { num: 4, ukr: "Три слони під столом.", before: "Three elephants", after: "the table." },
    { num: 5, ukr: "Назва на обкладинці.", before: "The title", after: "the cover." },
    { num: 6, ukr: "Дві різні сумки поруч із ліжком.", before: "Two different bags", after: "the bed." }
  ];

  function speakText(text) {
    if (!text) return;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }
  }

  function renderExercise() {
    const container = document.getElementById('task-container');
    container.innerHTML = '';

    taskData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'task-card';

      card.innerHTML = `
        <div class="sentence-row">
          <span class="sentence-num">${item.num}.</span>
          <span>${item.before}</span>
          <input type="text" class="gap-input" id="input-${index}" placeholder="is/are + prep">
          <span>${item.after}</span>
          <button class="speaker-btn" title="Слухати речення" onclick="speakInputSentence(${index})">🔊</button>
        </div>
        <div class="ukr-translation">${item.ukr}</div>
      `;

      container.appendChild(card);
    });
  }

  function speakInputSentence(index) {
    const item = taskData[index];
    const userVal = document.getElementById(`input-${index}`).value.trim();
    const fullText = `${item.before} ${userVal} ${item.after}`;
    speakText(fullText);
  }

  function resetExercise() {
    taskData.forEach((_, index) => {
      const input = document.getElementById(`input-${index}`);
      if (input) input.value = '';
    });
  }

  renderExercise();
</script>

</body>
</html>
