<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Соотнесение слов — Обучение лексике</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --accent-yellow: #facc15;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .example-box {
            background: rgba(250, 204, 21, 0.08);
            border: 1px dashed var(--accent-yellow);
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 25px;
            font-size: 0.92rem;
            line-height: 1.4;
        }

        .example-title {
            font-weight: 700;
            color: var(--accent-yellow);
            margin-bottom: 4px;
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-item {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .match-item.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .match-item.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .word-label {
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .num-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 0.88rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            margin-left: 6px;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        select.translation-select {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.92rem;
            outline: none;
            max-width: 340px;
            width: 100%;
            cursor: pointer;
        }

        select.translation-select:focus {
            border-color: var(--accent-blue);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">1. Соедините слова с их переводом</div>
    <div class="header-subtitle">Выберите правильный перевод для каждого английского выражения. Нажмите 🔊 для прослушивания.</div>

    <div class="example-box">
        <div class="example-title">📌 ОБРАЗЕЦ:</div>
        <div>0. <strong>honest</strong> <button class="audio-btn" onclick="speak('honest')">🔊</button> ➔ <em>честный</em></div>
    </div>

    <div class="match-list" id="matchList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Результат: - / 15</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Проверить ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Сбросить 🔄</button>
        </div>
    </div>
</div>

<script>
    const items = [
        { id: 1, word: "reliable", correct: "надёжный" },
        { id: 2, word: "achieve success", correct: "добиться успеха" },
        { id: 3, word: "let somebody down", correct: "подвести кого-либо, разочаровать" },
        { id: 4, word: "be considerate of", correct: "быть внимательным к кому-либо, считаться с другими" },
        { id: 5, word: "mature", correct: "зрелый, взрослый" },
        { id: 6, word: "attitude to", correct: "отношение к чему-либо или кому-либо" },
        { id: 7, word: "employed", correct: "трудоустроенный, имеющий работу" },
        { id: 8, word: "be polite to", correct: "быть вежливым с кем-либо" },
        { id: 9, word: "ambitious", correct: "амбициозный, целеустремлённый" },
        { id: 10, word: "selfish", correct: "эгоистичный" },
        { id: 11, word: "helpful", correct: "отзывчивый, готовый помочь" },
        { id: 12, word: "organized", correct: "организованный" },
        { id: 13, word: "be sure", correct: "быть уверенным" },
        { id: 14, word: "truth", correct: "правда" },
        { id: 15, word: "intelligent", correct: "умный, сообразительный" }
    ];

    const translations = [
        "надёжный",
        "добиться успеха",
        "подвести кого-либо, разочаровать",
        "быть внимательным к кому-либо, считаться с другими",
        "зрелый, взрослый",
        "отношение к чему-либо или кому-либо",
        "трудоустроенный, имеющий работу",
        "быть вежливым с кем-либо",
        "амбициозный, целеустремлённый",
        "эгоистичный",
        "отзывчивый, готовый помочь",
        "организованный",
        "быть уверенным",
        "правда",
        "умный, сообразительный"
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("К сожалению, ваш браузер не поддерживает озвучку текста.");
        }
    }

    function shuffle(array) {
        return [...array].sort(() => Math.random() - 0.5);
    }

    function renderExercise() {
        const container = document.getElementById('matchList');
        container.innerHTML = '';
        const shuffledOptions = shuffle(translations);

        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'match-item';
            div.id = `item-${item.id}`;

            let selectHtml = `<select class="translation-select" id="select-${item.id}">
                <option value="">-- Выберите перевод --</option>`;
            
            shuffledOptions.forEach(opt => {
                selectHtml += `<option value="${opt}">${opt}</option>`;
            });
            selectHtml += `</select>`;

            div.innerHTML = `
                <div class="word-label">
                    <span class="num-badge">${item.id}</span>
                    <span>${item.word}</span>
                    <button class="audio-btn" onclick="speak('${item.word}')" title="Прослушать">🔊</button>
                </div>
                ${selectHtml}
            `;
            container.appendChild(div);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        items.forEach(item => {
            const row = document.getElementById(`item-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);
            
            row.classList.remove('correct', 'incorrect');

            if (select.value === item.correct) {
                row.classList.add('correct');
                correctCount++;
            } else {
                row.classList.add('incorrect');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: ${correctCount} / ${items.length}`;
        scoreDisplay.style.color = correctCount === items.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        items.forEach(item => {
            const row = document.getElementById(`item-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);
            row.classList.remove('correct', 'incorrect');
            select.value = '';
        });

        document.getElementById('scoreDisplay').textContent = `Результат: - / ${items.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = renderExercise;
</script>

</body>
</html>
