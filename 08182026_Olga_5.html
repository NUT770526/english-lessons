<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упражнение 6 — Исправьте ошибку</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Vocab Table */
        .vocab-table-container {
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--input-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .vocab-table th, .vocab-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .vocab-table th {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            font-weight: 700;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.2);
            border: none;
            color: var(--accent-blue);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        /* Exercise Styles */
        .sentence-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sentence-item {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .sentence-item.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-item.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .sentence-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1rem;
            color: #ffffff;
        }

        .num-badge {
            color: var(--accent-blue);
            font-weight: 700;
            margin-right: 6px;
        }

        .wrong-part {
            color: var(--accent-red);
            font-weight: 700;
            text-decoration: underline;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .correct-input {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.95rem;
            outline: none;
            flex-grow: 1;
        }

        .correct-input:focus {
            border-color: var(--accent-blue);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- VOCABULARY SECTION -->
    <div class="section-title">📖 Словарь (с озвучкой)</div>
    <div class="vocab-table-container">
        <table class="vocab-table">
            <thead>
                <tr>
                    <th>Слово</th>
                    <th>Перевод</th>
                    <th style="text-align: center;">Озвучка</th>
                </tr>
            </thead>
            <tbody id="vocabBody"></tbody>
        </table>
    </div>

    <!-- EXERCISE SECTION -->
    <div class="section-title">✏️ 6. Исправьте ошибку (Напишите предложение правильно)</div>
    <div class="sentence-list" id="sentenceList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Результат: - / 15</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Проверить ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Сбросить 🔄</button>
        </div>
    </div>
</div>

<script>
    const dictionary = [
        { word: "polite", translation: "вежливый" },
        { word: "reliable", translation: "надёжный" },
        { word: "attitude", translation: "отношение" },
        { word: "success", translation: "успех" },
        { word: "considerate", translation: "внимательный к другим" },
        { word: "describe", translation: "описывать" },
        { word: "attention", translation: "внимание" },
        { word: "mistake", translation: "ошибка" },
        { word: "honest", translation: "честный" },
        { word: "patient", translation: "терпеливый" },
        { word: "selfish", translation: "эгоистичный" },
        { word: "ambitious", translation: "амбициозный" },
        { word: "helpful", translation: "готовый помочь" },
        { word: "attractive", translation: "привлекательный" },
        { word: "mature", translation: "зрелый / взрослый" }
    ];

    const sentences = [
        { id: 1, wrongHtml: 'Be polite <span class="wrong-part">with</span> your customers.', correct: 'Be polite to your customers.' },
        { id: 2, wrongHtml: 'She is a very <span class="wrong-part">reliably</span> person.', correct: 'She is a very reliable person.' },
        { id: 3, wrongHtml: 'What is your attitude <span class="wrong-part">for</span> this idea?', correct: 'What is your attitude to this idea?' },
        { id: 4, wrongHtml: 'He never lets <span class="wrong-part">down me</span>.', correct: 'He never lets me down.' },
        { id: 5, wrongHtml: 'She wants to achieve <span class="wrong-part">a success</span>.', correct: 'She wants to achieve success.' },
        { id: 6, wrongHtml: 'You should be considerate <span class="wrong-part">to</span> other people.', correct: 'You should be considerate of other people.' },
        { id: 7, wrongHtml: 'I <span class="wrong-part">rather</span> stay at home tonight.', correct: 'I would rather stay at home tonight.' },
        { id: 8, wrongHtml: 'Can you describe <span class="wrong-part">me</span> your colleague?', correct: 'Can you describe your colleague to me?' },
        { id: 9, wrongHtml: 'You must pay attention <span class="wrong-part">for</span> the rules.', correct: 'You must pay attention to the rules.' },
        { id: 10, wrongHtml: 'Don\'t be afraid to <span class="wrong-part">do</span> mistakes.', correct: 'Don\'t be afraid to make mistakes.' },
        { id: 11, wrongHtml: 'He is an <span class="wrong-part">honestly</span> man.', correct: 'He is an honest man.' },
        { id: 12, wrongHtml: 'She is very <span class="wrong-part">patience</span> with children.', correct: 'She is very patient with children.' },
        { id: 13, wrongHtml: 'Stop being so <span class="wrong-part">selfishly</span>!', correct: 'Stop being so selfish!' },
        { id: 14, wrongHtml: 'An <span class="wrong-part">ambition</span> person always wants to reach the top.', correct: 'An ambitious person always wants to reach the top.' },
        { id: 15, wrongHtml: 'This guidebook is very <span class="wrong-part">helpfully</span>.', correct: 'This guidebook is very helpful.' }
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function cleanText(text) {
        return text.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ").trim();
    }

    function renderVocab() {
        const tbody = document.getElementById('vocabBody');
        tbody.innerHTML = '';
        dictionary.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.word}</strong></td>
                <td style="color: var(--text-muted);">${item.translation}</td>
                <td style="text-align: center;">
                    <button class="audio-btn" onclick="speak('${item.word}')" title="Прослушать">🔊</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderSentences() {
        const list = document.getElementById('sentenceList');
        list.innerHTML = '';

        sentences.forEach(s => {
            const div = document.createElement('div');
            div.className = 'sentence-item';
            div.id = `item-${s.id}`;

            const plainWrongText = s.wrongHtml.replace(/<[^>]*>/g, '');

            div.innerHTML = `
                <div class="sentence-header">
                    <div>
                        <span class="num-badge">${s.id}.</span>
                        ${s.wrongHtml}
                    </div>
                    <button class="audio-btn" onclick="speak('${plainWrongText.replace(/'/g, "\\'")}')" title="Прослушать исходное">🔊</button>
                </div>
                <div class="input-row">
                    <input type="text" class="correct-input" id="input-${s.id}" placeholder="Введите правильный вариант...">
                    <button class="audio-btn" onclick="speak('${s.correct.replace(/'/g, "\\'")}')" title="Прослушать верный вариант">🔊</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const input = document.getElementById(`input-${s.id}`);
            
            row.classList.remove('correct', 'incorrect');

            const userVal = cleanText(input.value);
            const targetVal = cleanText(s.correct);

            // Допускаем сокращения, например "I'd rather" вместо "I would rather"
            let altTarget = targetVal;
            if (s.id === 7) altTarget = cleanText("I'd rather stay at home tonight");

            if (userVal === targetVal || userVal === altTarget) {
                row.classList.add('correct');
                correctCount++;
            } else {
                row.classList.add('incorrect');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: ${correctCount} / ${sentences.length}`;
        scoreDisplay.style.color = correctCount === sentences.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const input = document.getElementById(`input-${s.id}`);
            row.classList.remove('correct', 'incorrect');
            input.value = '';
        });

        document.getElementById('scoreDisplay').textContent = `Результат: - / ${sentences.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = () => {
        renderVocab();
        renderSentences();
    };
</script>

</body>
</html>
