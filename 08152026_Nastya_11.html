<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5. Make questions</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .hint-box {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-blue);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .hint-title {
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .hint-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 10px 20px;
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        .hint-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .hint-item span.code {
            color: #ffffff;
            font-weight: 700;
        }

        .hint-item span.trans {
            color: var(--accent-blue);
            font-style: italic;
        }

        .sentences-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sentence-card {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .sentence-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-card.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .original-text {
            font-size: 1.05rem;
            font-weight: 600;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .num-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 0.95rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .translation-hint {
            font-size: 0.88rem;
            color: var(--accent-blue);
            font-style: italic;
            font-weight: normal;
        }

        .input-box {
            width: 100%;
            background: #1e293b;
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: var(--accent-blue);
        }

        .feedback-text {
            font-size: 0.85rem;
            color: var(--accent-red);
            display: none;
            margin-top: -4px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">5. Make questions</div>
    <div class="header-subtitle">Склади запитання зі слів.</div>

    <div class="hint-box">
        <div class="hint-title">💡 Зверни увагу на порядок слів у запитанні:</div>
        <div class="hint-grid">
            <div class="hint-item"><span class="code">Have / Has + [хто] + got...?</span><br><span class="trans">(Чи має...? / Наявність)</span></div>
            <div class="hint-item"><span class="code">Do / Does + [хто] + have to...?</span><br><span class="trans">(Чи мусить...? / Потреба)</span></div>
        </div>
    </div>

    <div class="sentences-list" id="exerciseList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Score: - / 10</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        </div>
    </div>
</div>

<script>
    const data = [
        { id: 1, original: "your friend / got / good communication skills", ua: "твій друг / має / хороші комунікативні навички", answer: "Has your friend got good communication skills?" },
        { id: 2, original: "she / got / a passion for music", ua: "вона / має / пристрасть до музики", answer: "Has she got a passion for music?" },
        { id: 3, original: "employees / have to / work well in a team", ua: "працівники / мусять / добре працювати в команді", answer: "Do employees have to work well in a team?" },
        { id: 4, original: "he / have to / be organised", ua: "він / мусить / бути організованим", answer: "Does he have to be organised?" },
        { id: 5, original: "your teacher / got / a cheerful personality", ua: "твій вчитель / має / життєрадісний характер", answer: "Has your teacher got a cheerful personality?" },
        { id: 6, original: "a leader / have to / believe in people", ua: "лідер / мусить / вірити в людей", answer: "Does a leader have to believe in people?" },
        { id: 7, original: "you / got / useful skills", ua: "ти / маєш / корисні навички", answer: "Have you got useful skills?" },
        { id: 8, original: "students / have to / work hard for success", ua: "студенти / мусять / наполегливо працювати для успіху", answer: "Do students have to work hard for success?" },
        { id: 9, original: "an employee / have to / be a role model", ua: "працівник / мусить / бути прикладом для наслідування", answer: "Does an employee have to be a role model?" },
        { id: 10, original: "managers / got / a lot of problems", ua: "менеджери / мають / багато проблем", answer: "Have managers got a lot of problems?" }
    ];

    function normalizeText(str) {
        return str
            .trim()
            .replace(/’/g, "'")
            .replace(/\s+/g, ' ')
            .replace(/[.!?]$/, '');
    }

    function renderExercise() {
        const list = document.getElementById('exerciseList');
        list.innerHTML = '';

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.id = `card-${item.id}`;

            card.innerHTML = `
                <div class="original-text">
                    <span class="num-badge">${item.id}</span>
                    <div class="text-group">
                        <span>${item.original}</span>
                        <span class="translation-hint">(${item.ua})</span>
                    </div>
                </div>
                <input type="text" class="input-box" id="input-${item.id}" placeholder="Type question here..." autocomplete="off">
                <div class="feedback-text" id="feedback-${item.id}">Correct: ${item.answer}</div>
            `;
            list.appendChild(card);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        data.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const input = document.getElementById(`input-${item.id}`);
            const feedback = document.getElementById(`feedback-${item.id}`);

            const userVal = normalizeText(input.value);
            const correctVal = normalizeText(item.answer);

            card.classList.remove('correct', 'incorrect');
            feedback.style.display = 'none';

            if (userVal.toLowerCase() === correctVal.toLowerCase()) {
                card.classList.add('correct');
                correctCount++;
            } else {
                card.classList.add('incorrect');
                feedback.style.display = 'block';
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: ${correctCount} / ${data.length}`;
        scoreDisplay.style.color = correctCount === data.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        data.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const input = document.getElementById(`input-${item.id}`);
            const feedback = document.getElementById(`feedback-${item.id}`);

            card.classList.remove('correct', 'incorrect');
            input.value = '';
            feedback.style.display = 'none';
        });

        document.getElementById('scoreDisplay').textContent = `Score: - / ${data.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = renderExercise;
</script>

</body>
</html>
