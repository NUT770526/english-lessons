<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упражнение 5 — Переведите на английский</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Vocab Table */
        .vocab-table-container {
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--input-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .vocab-table th, .vocab-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .vocab-table th {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            font-weight: 700;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.2);
            border: none;
            color: var(--accent-blue);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        /* Exercise Styles */
        .sentence-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sentence-item {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .sentence-item.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-item.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .sentence-header {
            font-size: 0.98rem;
            color: #ffffff;
            line-height: 1.4;
        }

        .num-badge {
            color: var(--accent-blue);
            font-weight: 700;
            margin-right: 6px;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .translation-input {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 0.95rem;
            outline: none;
            flex-grow: 1;
        }

        .translation-input:focus {
            border-color: var(--accent-blue);
        }

        .correct-answer-hint {
            font-size: 0.85rem;
            color: var(--accent-green);
            display: none;
            margin-top: 4px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- VOCABULARY SECTION -->
    <div class="section-title">📖 Словарь (с озвучкой)</div>
    <div class="vocab-table-container">
        <table class="vocab-table">
            <thead>
                <tr>
                    <th>Слово</th>
                    <th>Перевод</th>
                    <th style="text-align: center;">Озвучка</th>
                </tr>
            </thead>
            <tbody id="vocabBody"></tbody>
        </table>
    </div>

    <!-- EXERCISE SECTION -->
    <div class="section-title">✏️ 5. Переведите на английский</div>
    <div class="sentence-list" id="sentenceList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Результат: - / 15</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Проверить ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Сбросить 🔄</button>
        </div>
    </div>
</div>

<script>
    const dictionary = [
        { word: "honest", translation: "честный" },
        { word: "reliable", translation: "надёжный" },
        { word: "considerate", translation: "внимательный (к другим)" },
        { word: "intelligent", translation: "умный" },
        { word: "organized", translation: "организованный" },
        { word: "polite", translation: "вежливый" },
        { word: "possible", translation: "возможный" },
        { word: "employed", translation: "трудоустроенный" },
        { word: "attitude", translation: "отношение" },
        { word: "describe", translation: "описывать" },
        { word: "ambitious", translation: "целеустремлённый" },
        { word: "selfish", translation: "эгоистичный" },
        { word: "attractive", translation: "привлекательный" },
        { word: "patient", translation: "терпеливый" },
        { word: "creative", translation: "творческий" }
    ];

    // Array of allowed variations to make the check robust
    const sentences = [
        { id: 1, ru: "Моя коллега очень честная и надёжная.", mainEn: "My colleague is very honest and reliable.", 
          variants: ["my colleague is very honest and reliable", "my coworker is very honest and reliable"] },
        { id: 2, ru: "Старайся быть внимательным к другим людям.", mainEn: "Try to be considerate of other people.", 
          variants: ["try to be considerate of other people", "try to be considerate to other people"] },
        { id: 3, ru: "Она довольно умная и организованная.", mainEn: "She is rather intelligent and organized.", 
          variants: ["she is rather intelligent and organized", "she is quite intelligent and organized"] },
        { id: 4, ru: "Будьте вежливы с клиентами.", mainEn: "Be polite to customers.", 
          variants: ["be polite to customers", "be polite to the customers", "be polite to your customers"] },
        { id: 5, ru: "Я уверена, что это возможно.", mainEn: "I am sure that it is possible.", 
          variants: ["i am sure that it is possible", "i am sure it is possible", "i'm sure that it is possible", "i'm sure it is possible"] },
        { id: 6, ru: "Он трудоустроен и счастлив на своей новой работе.", mainEn: "He is employed and happy at his new job.", 
          variants: ["he is employed and happy at his new job", "he is employed and happy in his new job"] },
        { id: 7, ru: "Она никогда не подводит своих друзей.", mainEn: "She never lets her friends down.", 
          variants: ["she never lets her friends down", "she never lets down her friends"] },
        { id: 8, ru: "Каково твоё отношение к этой ситуации?", mainEn: "What is your attitude to this situation?", 
          variants: ["what is your attitude to this situation", "what is your attitude towards this situation"] },
        { id: 9, ru: "Опиши человека, который тебя вдохновляет.", mainEn: "Describe a person who inspires you.", 
          variants: ["describe a person who inspires you", "describe the person who inspires you"] },
        { id: 10, ru: "Она целеустремлённая и хочет добиться успеха.", mainEn: "She is ambitious and wants to achieve success.", 
          variants: ["she is ambitious and wants to achieve success", "she is ambitious and wants to succeed"] },
        { id: 11, ru: "Он немного эгоистичный, но очень привлекательный.", mainEn: "He is a bit selfish, but very attractive.", 
          variants: ["he is a bit selfish but very attractive", "he is a little selfish but very attractive"] },
        { id: 12, ru: "Я бы предпочла остаться дома сегодня вечером.", mainEn: "I would rather stay at home tonight.", 
          variants: ["i would rather stay at home tonight", "i'd rather stay at home tonight", "i would rather stay home tonight"] },
        { id: 13, ru: "Мой брат очень терпеливый и готовый помочь.", mainEn: "My brother is very patient and helpful.", 
          variants: ["my brother is very patient and helpful"] },
        { id: 14, ru: "Взрослые (зрелые) люди обычно очень организованные.", mainEn: "Mature people are usually very organized.", 
          variants: ["mature people are usually very organized"] },
        { id: 15, ru: "Наш новый дизайнер очень творческий.", mainEn: "Our new designer is very creative.", 
          variants: ["our new designer is very creative"] }
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderVocab() {
        const tbody = document.getElementById('vocabBody');
        tbody.innerHTML = '';
        dictionary.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.word}</strong></td>
                <td style="color: var(--text-muted);">${item.translation}</td>
                <td style="text-align: center;">
                    <button class="audio-btn" onclick="speak('${item.word}')" title="Прослушать">🔊</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderSentences() {
        const list = document.getElementById('sentenceList');
        list.innerHTML = '';

        sentences.forEach(s => {
            const div = document.createElement('div');
            div.className = 'sentence-item';
            div.id = `item-${s.id}`;

            div.innerHTML = `
                <div class="sentence-header">
                    <span class="num-badge">${s.id}.</span>
                    ${s.ru}
                </div>
                <div class="input-row">
                    <input type="text" class="translation-input" id="input-${s.id}" placeholder="Translate to English...">
                    <button class="audio-btn" onclick="speak('${s.mainEn.replace(/'/g, "\\'")}')" title="Прослушать правильный ответ">🔊</button>
                </div>
                <div class="correct-answer-hint" id="hint-${s.id}">Правильно: ${s.mainEn}</div>
            `;
            list.appendChild(div);
        });
    }

    // Function to strip punctuation and extra spaces for soft matching
    function normalizeString(str) {
        return str.toLowerCase().replace(/[.,?!'’"]/g, "").replace(/\s+/g, " ").trim();
    }

    function checkAnswers() {
        let correctCount = 0;

        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const input = document.getElementById(`input-${s.id}`);
            const hint = document.getElementById(`hint-${s.id}`);
            
            row.classList.remove('correct', 'incorrect');
            hint.style.display = 'none';

            const userVal = normalizeString(input.value);
            
            // Map valid answers and normalize them
            const validNormalized = s.variants.map(normalizeString);

            if (userVal !== "" && validNormalized.includes(userVal)) {
                row.classList.add('correct');
                correctCount++;
            } else {
                row.classList.add('incorrect');
                hint.style.display = 'block'; // Show correct answer on mistake
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: ${correctCount} / ${sentences.length}`;
        scoreDisplay.style.color = correctCount === sentences.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const input = document.getElementById(`input-${s.id}`);
            const hint = document.getElementById(`hint-${s.id}`);
            
            row.classList.remove('correct', 'incorrect');
            input.value = '';
            hint.style.display = 'none';
        });

        document.getElementById('scoreDisplay').textContent = `Результат: - / ${sentences.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = () => {
        renderVocab();
        renderSentences();
    };
</script>

</body>
</html>
