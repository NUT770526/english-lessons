<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Label the Pictures — Interactive Exercise</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .exercise-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 20px;
        }

        /* Word Bank (Draggable Tags) */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--input-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            margin-bottom: 25px;
        }

        .word-tag {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            transition: all 0.2s ease;
        }

        .word-tag:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .word-tag:active {
            cursor: grabbing;
        }

        .audio-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0;
            margin-left: 4px;
        }

        /* 3x2 Grid layout for images */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        .card.correct {
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.2);
        }

        .card.incorrect {
            border-color: var(--accent-red) !important;
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.2);
        }

        .img-wrapper {
            width: 100%;
            height: 180px;
            overflow: hidden;
            position: relative;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .input-area {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .drop-zone {
            width: 100%;
            min-height: 42px;
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            box-sizing: border-box;
        }

        .drop-zone.hover {
            border-color: var(--accent-blue);
            background: rgba(56, 189, 248, 0.05);
        }

        .select-fallback {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            width: 100%;
        }

        .select-fallback:focus {
            border-color: var(--accent-blue);
        }

        .hint {
            font-size: 0.82rem;
            color: var(--accent-green);
            display: none;
            margin-top: 2px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="exercise-header">
        <span>🖼️</span> Label the pictures
    </div>

    <!-- DRAGGABLE WORD BANK -->
    <div class="word-bank" id="wordBank"></div>

    <!-- PICTURE GRID -->
    <div class="grid-container" id="gridContainer"></div>

    <!-- CONTROLS -->
    <div class="controls">
        <div class="score-display" id="scoreDisplay">Score: - / 6</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Check ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        </div>
    </div>
</div>

<script>
    const vocabulary = ["mentor", "boss", "partner", "classmates", "team work", "student"];

    const items = [
        {
            id: 1,
            correct: "student",
            img: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=600&q=80"
        },
        {
            id: 2,
            correct: "partner",
            img: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=600&q=80"
        },
        {
            id: 3,
            correct: "boss",
            img: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=600&q=80"
        },
        {
            id: 4,
            correct: "mentor",
            img: "https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=600&q=80"
        },
        {
            id: 5,
            correct: "team work",
            img: "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=600&q=80"
        },
        {
            id: 6,
            correct: "classmates",
            img: "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=600&q=80"
        }
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderWordBank() {
        const bank = document.getElementById('wordBank');
        bank.innerHTML = '';
        vocabulary.forEach(word => {
            const tag = document.createElement('div');
            tag.className = 'word-tag';
            tag.draggable = true;
            tag.id = `tag-${word.replace(/\s+/g, '-')}`;
            tag.ondragstart = (e) => e.dataTransfer.setData('text/plain', word);
            
            tag.innerHTML = `
                <span>${word}</span>
                <button class="audio-btn" onclick="event.stopPropagation(); speak('${word}')" title="Pronounce">🔊</button>
            `;
            bank.appendChild(tag);
        });
    }

    function renderGrid() {
        const grid = document.getElementById('gridContainer');
        grid.innerHTML = '';

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${item.id}`;

            let selectOptions = `<option value="">Select answer...</option>`;
            vocabulary.forEach(v => {
                selectOptions += `<option value="${v}">${v}</option>`;
            });

            card.innerHTML = `
                <div class="img-wrapper">
                    <img src="${item.img}" alt="Exercise Image ${item.id}">
                </div>
                <div class="input-area">
                    <select class="select-fallback" id="select-${item.id}">
                        ${selectOptions}
                    </select>
                    <div class="hint" id="hint-${item.id}">Correct: <strong>${item.correct}</strong></div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        items.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);
            const hint = document.getElementById(`hint-${item.id}`);

            card.classList.remove('correct', 'incorrect');
            hint.style.display = 'none';

            if (select.value === item.correct) {
                card.classList.add('correct');
                correctCount++;
            } else {
                card.classList.add('incorrect');
                hint.style.display = 'block';
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: ${correctCount} / ${items.length}`;
        scoreDisplay.style.color = correctCount === items.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        items.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);
            const hint = document.getElementById(`hint-${item.id}`);

            card.classList.remove('correct', 'incorrect');
            select.value = '';
            hint.style.display = 'none';
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: - / ${items.length}`;
        scoreDisplay.style.color = 'var(--accent-blue)';
    }

    window.onload = () => {
        renderWordBank();
        renderGrid();
    };
</script>

</body>
</html>
