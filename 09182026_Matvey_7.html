<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emoji Vocabulary Challenge 🔍</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 820px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .word-bank {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 24px;
  }

  .word-bank-title {
    font-size: 0.9rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .word-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .word-tag {
    background: #1e293b;
    color: #e2e8f0;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-row {
    background: #1e293b;
    border: 1px solid var(--border);
    padding: 14px 18px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .prompt-text {
    font-size: 1.05rem;
    font-weight: 500;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 280px;
  }

  select {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #38bdf8;
    background-color: #0f172a;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 180px;
  }

  select:focus {
    border-color: var(--accent);
  }

  select.correct-select {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  select.wrong-select {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 2px 6px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Exercise 1. Emoji Vocabulary Challenge 🔍</h2>
      <div class="subtitle">З'єднай слова з відповідними підказками. Прослухай нові слова у банку слів!</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <div class="word-bank">
    <div class="word-bank-title">Word Bank (прослухай произношение слов 🔊):</div>
    <div class="word-tags" id="word-bank-tags"></div>
  </div>

  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordsList = [
    "brief", "briefly", "contraction", "commemorate", "ancestors", 
    "bonfire", "lanterns", "customs", "draft", "edit"
  ];

  const questions = [
    { id: 1, emoji: "🔥", text: "A large outdoor fire", correct: "bonfire" },
    { id: 2, emoji: "🏮", text: "Lights that people can carry", correct: "lanterns" },
    { id: 3, emoji: "👵👴", text: "People in your family who lived long ago", correct: "ancestors" },
    { id: 4, emoji: "🕯️", text: "To honour and remember an important person or event", correct: "commemorate" },
    { id: 5, emoji: "✂️", text: "A short form such as I'm, don't or can't", correct: "contraction" },
    { id: 6, emoji: "📝", text: "The first version of a text", correct: "draft" },
    { id: 7, emoji: "✏️", text: "To correct or improve a text", correct: "edit" },
    { id: 8, emoji: "⏱️", text: "In a few words or in a short time", correct: "briefly" },
    { id: 9, emoji: "💬", text: "Short and containing only the necessary information", correct: "brief" },
    { id: 10, emoji: "🌍", text: "Traditional ways of behaving in a country or community", correct: "customs" }
  ];

  function renderWordBank() {
    const bankEl = document.getElementById('word-bank-tags');
    bankEl.innerHTML = wordsList.map(w => `
      <span class="word-tag">
        ${w}
        <button class="speaker-btn" onclick="speakWord('${w}')" title="Listen to '${w}'">🔊</button>
      </span>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach((q, index) => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      const options = ['<option value="">-- Choose word --</option>']
        .concat(wordsList.map(w => `<option value="${w}">${w}</option>`))
        .join('');

      row.innerHTML = `
        <div class="prompt-text">
          <span><b>${index + 1}.</b> ${q.emoji} ${q.text}</span>
        </div>
        <select id="select-${q.id}">
          ${options}
        </select>
      `;

      container.appendChild(row);
    });
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const selectEl = document.getElementById(`select-${q.id}`);
      const val = selectEl.value;

      selectEl.classList.remove('correct-select', 'wrong-select');

      if (val === q.correct) {
        score++;
        selectEl.classList.add('correct-select');
      } else {
        selectEl.classList.add('wrong-select');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderWordBank();
    renderQuiz();
  };
</script>

</body>
</html>
