<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business English Grammar Practice | Questions</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background-color: #1e293b;
      max-width: 820px;
      width: 100%;
      border-radius: 20px;
      padding: 35px 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
    }

    .header {
      margin-bottom: 25px;
      border-bottom: 1px solid #334155;
      padding-bottom: 20px;
    }

    .badge {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
    }

    p.instruction {
      margin: 0 0 10px 0;
      color: #94a3b8;
      font-size: 0.95rem;
    }

    .example-box {
      background-color: #0f172a;
      border-left: 4px solid #38bdf8;
      padding: 10px 15px;
      border-radius: 0 8px 8px 0;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .example-box strong {
      color: #38bdf8;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 25px;
      margin-bottom: 30px;
    }

    .exercise-item {
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.05rem;
      transition: border-color 0.2s ease;
      flex-wrap: wrap;
    }

    .exercise-item:hover {
      border-color: #3b82f6;
    }

    .q-number {
      font-weight: 700;
      color: #38bdf8;
      min-width: 25px;
    }

    .original-sentence {
      color: #94a3b8;
      font-weight: 500;
      min-width: 220px;
      border-right: 1px solid #334155;
      padding-right: 12px;
    }

    .sentence-target {
      flex: 1;
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      line-height: 1.6;
    }

    select {
      background-color: #1e293b;
      color: #38bdf8;
      border: 2px solid #38bdf8;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus {
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
    }

    select.correct {
      background-color: #064e3b;
      border-color: #10b981;
      color: #a7f3d0;
    }

    select.incorrect {
      background-color: #7f1d1d;
      border-color: #ef4444;
      color: #fecaca;
    }

    .audio-btn {
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
    }

    .audio-btn:hover {
      color: #38bdf8;
      background-color: #1e293b;
    }

    .correct-answer-hint {
      color: #f87171;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 6px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      border-top: 1px solid #334155;
      padding-top: 25px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #0369a1;
    }

    .btn-secondary {
      background-color: #334155;
      color: #cbd5e1;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .score-display {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
      display: none;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background-color: #334155;
      border-radius: 3px;
      margin-top: 15px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background-color: #10b981;
      transition: width 0.4s ease;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="badge">Business Grammar Practice</span>
    <h1>Exercise 3. Make questions</h1>
    <p class="instruction">Складіть загальні запитання. Поставте <strong>Am</strong>, <strong>Is</strong> або <strong>Are</strong> на початок речення.</p>
    <div class="example-box">
      <strong>Example:</strong> She is an assistant. &rarr; <strong>Is</strong> she an assistant?
    </div>
  </div>

  <div class="exercise-list" id="exerciseList"></div>

  <div class="progress-bar-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="actions">
    <div>
      <button class="btn btn-primary" onclick="checkAnswers()">Перевірити відповіді</button>
      <button class="btn btn-secondary" onclick="resetExercise()">Скинути</button>
    </div>
    <div class="score-display" id="scoreDisplay"></div>
  </div>
</div>

<script>
  const data = [
    { original: "You are a businessman.", rest: "you a businessman?", answer: "Are" },
    { original: "He is from Italy.", rest: "he from Italy?", answer: "Is" },
    { original: "They are business partners.", rest: "they business partners?", answer: "Are" },
    { original: "She is a lab assistant.", rest: "she a lab assistant?", answer: "Is" },
    { original: "We are late.", rest: "we late?", answer: "Are" },
    { original: "The businessman is in hospital.", rest: "the businessman in hospital?", answer: "Is" },
    { original: "I am in time.", rest: "I in time?", answer: "Am" },
    { original: "The meeting is at ten.", rest: "the meeting at ten?", answer: "Is" },
    { original: "The assistants are busy.", rest: "the assistants busy?", answer: "Are" },
    { original: "He is Italian.", rest: "he Italian?", answer: "Is" }
  ];

  function renderExercise() {
    const list = document.getElementById('exerciseList');
    list.innerHTML = '';

    data.forEach((item, index) => {
      const options = ['---', 'Am', 'Is', 'Are'];

      const selectHtml = `
        <select id="select-${index}">
          ${options.map(opt => `<option value="${opt === '---' ? '' : opt}">${opt}</option>`).join('')}
        </select>
      `;

      const itemHtml = `
        <div class="exercise-item">
          <span class="q-number">${index + 1}.</span>
          <span class="original-sentence">${item.original}</span>
          <div class="sentence-target">
            ${selectHtml}
            <span>${item.rest}</span>
            <span id="hint-${index}" class="correct-answer-hint"></span>
          </div>
          <button class="audio-btn" title="Прослухати вимову" onclick="speakSentence(${index})">🔊</button>
        </div>
      `;
      list.insertAdjacentHTML('beforeend', itemHtml);
    });
  }

  function checkAnswers() {
    let correctCount = 0;

    data.forEach((item, index) => {
      const select = document.getElementById(`select-${index}`);
      const hint = document.getElementById(`hint-${index}`);
      const val = select.value;

      select.classList.remove('correct', 'incorrect');
      hint.textContent = '';

      if (val === item.answer) {
        select.classList.add('correct');
        correctCount++;
      } else {
        select.classList.add('incorrect');
        hint.textContent = `(правильно: ${item.answer})`;
      }
    });

    const scoreDisplay = document.getElementById('scoreDisplay');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    const percentage = Math.round((correctCount / data.length) * 100);
    scoreDisplay.textContent = `Результат: ${correctCount} / ${data.length} (${percentage}%)`;
    scoreDisplay.style.display = 'block';

    progressContainer.style.display = 'block';
    progressBar.style.width = percentage + '%';
  }

  function resetExercise() {
    data.forEach((_, index) => {
      const select = document.getElementById(`select-${index}`);
      const hint = document.getElementById(`hint-${index}`);
      select.value = '';
      select.classList.remove('correct', 'incorrect');
      hint.textContent = '';
    });

    document.getElementById('scoreDisplay').style.display = 'none';
    document.getElementById('progressContainer').style.display = 'none';
    document.getElementById('progressBar').style.width = '0%';
    window.speechSynthesis.cancel();
  }

  function speakSentence(index) {
    const item = data[index];
    const select = document.getElementById(`select-${index}`);
    const verb = select.value || item.answer;

    const fullSentence = `${verb} ${item.rest}`;

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(fullSentence);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }

  renderExercise();
</script>

</body>
</html>
