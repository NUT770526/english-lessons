<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Family — English Games</title><style>body{font-family:Arial,sans-serif;background:#f2ebff;color:#37204f;margin:0;padding:22px}main{max-width:800px;margin:auto}h1{text-align:center;font-size:38px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1}button{border:0;border-radius:12px;padding:14px;font-size:17px;cursor:pointer;background:#6b3da2;color:white}button:disabled{opacity:.5;cursor:default}.panel{background:white;border-radius:20px;padding:26px;margin-top:18px;box-shadow:0 5px 18px #6b3da21a}.question{font-size:28px;text-align:center;margin:24px 0}.options{display:grid;gap:10px}.options button{background:#ede2fa;color:#40205e}.options button.good{background:#a8e5b6}.options button.bad{background:#ffc1c1}.muted{color:#6e5c7d}.feedback{font-weight:bold;margin:16px 0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.secondary{background:#d9c9eb;color:#40205e}.hidden{display:none}.phonetic{text-align:center;font-size:23px;margin:16px}.example{text-align:center;font-style:italic}.progress{text-align:right}.note{background:#fff9e9;border-radius:12px;padding:12px;margin-top:15px}</style></head><body><main><h1>💜 My Family — English Games</h1><p style="text-align:center">Три игры для запоминания слов и тренировки произношения</p><div class="tabs"><button onclick="start(0)">1. Find the Match</button><button onclick="start(1)">2. Say It!</button><button onclick="start(2)">3. Complete It!</button></div><section class="panel" id="game"></section></main><script>
const vocab=[['niece','племінниця','/niːs/','My niece is ten.'],['nephew','племінник','/ˈnef.juː/','My nephew is funny.'],['aunt','тітка','/ænt/ (амер.)','My aunt is kind.'],['uncle','дядько','/ˈʌŋ.kəl/','My uncle is tall.'],['cousin','двоюрідний брат / сестра','/ˈkʌz.ən/','My cousin is eleven.'],['cousins','двоюрідні брати / сестри','/ˈkʌz.ənz/','My cousins live nearby.'],['granddaughter','онука','/ˈɡræn.dɔː.tər/','She is my granddaughter.'],['grandson','онук','/ˈɡræn.sʌn/','He is my grandson.'],['parents','батьки','/ˈper.ənts/','My parents are at home.'],['finger','палець на руці','/ˈfɪŋ.ɡər/','This is my finger.'],['on the wall','на стіні','/ɒn ðə wɔːl/','The picture is on the wall.'],["I'm not sure",'Я не впевнена','/aɪm nɒt ʃʊər/',"I'm not sure."],['I believe','Я вірю / Я вважаю','/aɪ bɪˈliːv/','I believe you.']];
const match=[['племінниця','niece',['nephew','niece','cousin']],['дядько','uncle',['aunt','uncle','parents']],['двоюрідний брат / сестра','cousin',['cousin','grandson','nephew']],['Я не впевнена',"I'm not sure",['I believe',"I'm not sure",'I am happy']],['племінник','nephew',['niece','uncle','nephew']],['на стіні','on the wall',['on the wall','on the floor','in the wall']],['батьки','parents',['grandparents','parents','cousins']],['палець на руці','finger',['hand','finger','foot']],['тітка','aunt',['aunt','uncle','niece']],['Я вважаю / Я вірю','I believe',['I am sure','I believe','I know']],['двоюрідні брати / сестри','cousins',['cousin','cousins','parents']]];
const sentences=[["My mother's sister is my ____.",'aunt',['aunt','uncle','nephew']],["My father's brother is my ____.",'uncle',['niece','uncle','cousin']],["My sister's son is my ____.",'nephew',['nephew','niece','grandson']],["My brother's daughter is my ____.",'niece',['aunt','cousin','niece']],["My aunt's son is my ____.",'cousin',['nephew','cousin','uncle']],["I don't know the answer. I'm ____.",'not sure',['not sure','on the wall','aunt']],["The picture is ____.",'on the wall',['I believe','on the wall','parents']],["My mother and father are my ____.",'parents',['cousins','parents','grandchildren']],["I ____ you are right.",'believe',['finger','believe','uncle']],["I have five ____ on one hand.",'fingers',['parents','cousins','fingers']]];
let mode=0,index=0,score=0,answered=false,completed=new Set();const el=document.getElementById('game');function say(t){if(!('speechSynthesis' in window)){alert('Озвучивание недоступно в этом браузере');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;let voices=speechSynthesis.getVoices();let voice=voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;speechSynthesis.speak(u)}function start(m){mode=m;index=0;score=0;answered=false;render()}function render(){if(mode===1){const w=vocab[index];el.innerHTML=`<div class="progress">${index+1}/${vocab.length} • Отработано: ${completed.size}</div><h2>🎤 Pronunciation Challenge</h2><div class="question">${w[0]}</div><p style="text-align:center">${w[1]}</p><div class="controls"><button onclick="say(vocab[index][0])">🔊 Слушать слово</button><button onclick="say(vocab[index][3])">🔊 Слушать пример</button></div><div class="phonetic">${w[2]}</div><p class="example">${w[3]}</p><div class="note">Слушай → повтори 3 раза → скажи всё предложение.</div><div class="controls"><button class="secondary" onclick="index=(index-1+vocab.length)%vocab.length;render()">← Назад</button><button onclick="completed.add(index);index=(index+1)%vocab.length;render()">✓ Произнесла — дальше →</button></div>`;return}const arr=mode===0?match:sentences;if(index>=arr.length){el.innerHTML=`<h2>🎉 Well done!</h2><div class="question">${score} / ${arr.length}</div><button onclick="start(mode)">Играть снова</button>`;return}let q=arr[index];el.innerHTML=`<div class="progress">${index+1}/${arr.length} • Баллы: ${score}</div><h2>${mode===0?'🧩 Find the Match':'✏️ Complete the Sentence'}</h2><div class="question">${q[0]}</div><div class="options">${q[2].map((o,i)=>`<button id="opt${i}" onclick="choose(${i})">${o}</button>`).join('')}</div><div id="feedback" class="feedback"></div><div id="next"></div>`}function choose(i){if(answered)return;answered=true;let q=(mode===0?match:sentences)[index],v=q[2][i],correct=v===q[1];if(correct)score++;document.querySelectorAll('.options button').forEach((b,j)=>{b.disabled=true;if(q[2][j]===q[1])b.classList.add('good');else if(j===i)b.classList.add('bad')});document.getElementById('feedback').textContent=(correct?'✓ Great job!':'Правильный ответ: '+q[1])+(mode===2?' Прочитай полное предложение вслух.':'');let full=mode===2?q[0].replace('____',q[1]):q[1];document.getElementById('next').innerHTML=`<div class="controls"><button onclick="say(${JSON.stringify(full).replace(/"/g,'&quot;')})">🔊 Слушать</button><button onclick="index++;answered=false;render()">Дальше →</button></div>`}render();
</script></body></html>
