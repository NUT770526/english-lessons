<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7. Complete with the Words in the Box</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --neon-green: #22c55e;
            --neon-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 780px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* WORD BANK BOX */
        .word-bank {
            background: #111827;
            border: 2px dashed var(--accent-purple);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .word-tag {
            background: rgba(129, 140, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-purple);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            user-select: none;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sentence-card {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .sentence-num {
            font-weight: bold;
            color: var(--accent-purple);
        }

        .sentence-text {
            font-size: 1.05rem;
            line-height: 1.6;
            flex: 1;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
        }

        .input-inline {
            background: #1e293b;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            color: var(--accent-blue);
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            width: 130px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .input-inline:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        /* CHECKING STATES */
        .sentence-card.correct {
            border-color: var(--neon-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .sentence-card.wrong {
            border-color: var(--neon-red);
            background: rgba(239, 68, 68, 0.05);
        }

        .correct-answer-text {
            display: none;
            font-size: 0.9rem;
            color: var(--neon-green);
            font-weight: bold;
            margin-left: 6px;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
        }

        .btn-check:hover {
            transform: scale(1.03);
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1> Complete with the words in the box</h1>
        <p>Заполни пропуски словами из рамки</p>
    </div>

    <!-- WORD BANK -->
    <div class="word-bank">
        <span class="word-tag">personality</span>
        <span class="word-tag">listener</span>
        <span class="word-tag">only child</span>
        <span class="word-tag">sibling</span>
        <span class="word-tag">perfectionist</span>
        <span class="word-tag">leader</span>
        <span class="word-tag">cheerful</span>
        <span class="word-tag">generous</span>
        <span class="word-tag">stubborn</span>
        <span class="word-tag">take after</span>
    </div>

    <div class="exercise-list" id="exerciseList"></div>

    <div class="controls">
        <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        <div class="score-display" id="scoreDisplay"></div>
        <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔️</button>
    </div>
</div>

<script>
    const exerciseData = [
        {
            id: 1,
            prefix: "I'm a(n)",
            suffix: ", but I'd like to have a sister.",
            correct: "only child"
        },
        {
            id: 2,
            prefix: "My brother is a good",
            suffix: ". He always pays attention when I talk to him.",
            correct: "listener"
        },
        {
            id: 3,
            prefix: "Henry is a(n)",
            suffix: ", so he gets upset when he makes mistakes.",
            correct: "perfectionist"
        },
        {
            id: 4,
            prefix: "Rose is the",
            suffix: "of our team because she's good at giving instructions.",
            correct: "leader"
        },
        {
            id: 5,
            prefix: "My mum has only one",
            suffix: ", but my dad has three.",
            correct: "sibling"
        },
        {
            id: 6,
            prefix: "My best friend Victor has a bright and friendly",
            suffix: ".",
            correct: "personality"
        },
        {
            id: 7,
            prefix: "She is always",
            suffix: "and smiles at everyone in the morning.",
            correct: "cheerful"
        },
        {
            id: 8,
            prefix: "He is very",
            suffix: "and always buys nice presents for his family.",
            correct: "generous"
        },
        {
            id: 9,
            prefix: "My cousin is so",
            suffix: "— he never changes his mind!",
            correct: "stubborn"
        },
        {
            id: 10,
            prefix: "I really",
            suffix: "my father; we look and behave very similarly.",
            correct: "take after"
        }
    ];

    let userInputs = {};

    function renderExercise() {
        const list = document.getElementById('exerciseList');
        list.innerHTML = '';

        exerciseData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.id = `card-${item.id}`;

            const savedValue = userInputs[item.id] || '';

            card.innerHTML = `
                <span class="sentence-num">${item.id}.</span>
                <div class="sentence-text">
                    <span>${item.prefix}</span>
                    <input 
                        type="text" 
                        id="input-${item.id}" 
                        class="input-inline" 
                        value="${savedValue}" 
                        placeholder="..."
                        oninput="onInputChange(${item.id}, this.value)"
                    />
                    <span>${item.suffix}</span>
                    <span class="correct-answer-text" id="answer-${item.id}">(${item.correct})</span>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function onInputChange(id, val) {
        userInputs[id] = val;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('correct', 'wrong');
        document.getElementById(`answer-${id}`).style.display = 'none';
    }

    function normalizeText(text) {
        return text.trim().toLowerCase().replace(/\s+/g, " ");
    }

    function checkAnswers() {
        let correctCount = 0;

        exerciseData.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const answerHint = document.getElementById(`answer-${item.id}`);
            const userVal = userInputs[item.id] || '';

            const isCorrect = normalizeText(userVal) === normalizeText(item.correct);

            card.classList.remove('correct', 'wrong');

            if (isCorrect) {
                card.classList.add('correct');
                answerHint.style.display = 'none';
                correctCount++;
            } else {
                card.classList.add('wrong');
                answerHint.style.display = 'inline';
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        if (correctCount === exerciseData.length) {
            scoreDisplay.style.color = 'var(--neon-green)';
            scoreDisplay.textContent = `🎉 Excellent work! ${correctCount} / ${exerciseData.length}`;
        } else {
            scoreDisplay.style.color = 'var(--accent-blue)';
            scoreDisplay.textContent = `Score: ${correctCount} / ${exerciseData.length}`;
        }
    }

    function resetExercise() {
        userInputs = {};
        document.getElementById('scoreDisplay').textContent = '';
        renderExercise();
    }

    window.onload = () => {
        renderExercise();
    };
</script>

</body>
</html>
