<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose the correct option</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #0f172a;
    --primary-color: #2563eb;
    --primary-light: #eff6ff;
    --border-color: #cbd5e1;
    --success-color: #16a34a;
    --success-bg: #f0fdf4;
    --error-color: #dc2626;
    --error-bg: #fef2f2;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 800px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 36px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .icon-box {
    width: 48px;
    height: 48px;
    background-color: var(--primary-light);
    border: 2px solid #bfdbfe;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: var(--primary-color);
  }

  .title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e3a8a;
  }

  .questions-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .question-item {
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 18px 20px;
    transition: all 0.2s ease;
  }

  .question-item.correct {
    border-color: #86efac;
    background-color: var(--success-bg);
  }

  .question-item.incorrect {
    border-color: #fca5a5;
    background-color: var(--error-bg);
  }

  .question-line {
    font-size: 1.1rem;
    font-weight: 500;
    color: #1e293b;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  select.dropdown {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #0f172a;
    padding: 6px 32px 6px 14px;
    border-radius: 8px;
    border: 2px solid var(--border-color);
    background-color: #f8fafc;
    cursor: pointer;
    outline: none;
    transition: all 0.2s;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c64748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 16px;
    min-width: 140px;
  }

  select.dropdown:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  .audio-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    padding: 2px 6px;
    border-radius: 6px;
    transition: background-color 0.2s;
    margin-left: auto;
  }

  .audio-btn:hover {
    background-color: #e2e8f0;
  }

  .feedback-msg {
    margin-top: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    display: none;
  }

  .feedback-msg.correct {
    display: block;
    color: var(--success-color);
  }

  .feedback-msg.incorrect {
    display: block;
    color: var(--error-color);
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid #e2e8f0;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-check {
    background-color: var(--primary-color);
    color: #ffffff;
  }

  .btn-check:hover {
    background-color: #1d4ed8;
  }

  .btn-reset {
    background-color: #e2e8f0;
    color: #475569;
  }

  .btn-reset:hover {
    background-color: #cbd5e1;
  }

  .score-badge {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--primary-color);
    background-color: var(--primary-light);
    padding: 8px 16px;
    border-radius: 20px;
    display: none;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="icon-box">✓</div>
    <h1 class="title">Choose the correct option</h1>
  </div>

  <div class="questions-list">
    <!-- Item 1 -->
    <div class="question-item" data-correct="does">
      <div class="question-line">
        <span>1. Lily</span>
        <select class="dropdown">
          <option value="" disabled selected>-- select --</option>
          <option value="do">do</option>
          <option value="does">does</option>
          <option value="doesn't">doesn't</option>
        </select>
        <span>karate every Sunday.</span>
        <button class="audio-btn" title="Listen" onclick="speakText('Lily does karate every Sunday.')">🔊</button>
      </div>
      <div class="feedback-msg"></div>
    </div>

    <!-- Item 2 -->
    <div class="question-item" data-correct="go">
      <div class="question-line">
        <span>2. I usually</span>
        <select class="dropdown">
          <option value="" disabled selected>-- select --</option>
          <option value="go">go</option>
          <option value="goes">goes</option>
          <option value="going">going</option>
        </select>
        <span>to the museum once a month.</span>
        <button class="audio-btn" title="Listen" onclick="speakText('I usually go to the museum once a month.')">🔊</button>
      </div>
      <div class="feedback-msg"></div>
    </div>

    <!-- Item 3 -->
    <div class="question-item" data-correct="don't like">
      <div class="question-line">
        <span>3. My friends</span>
        <select class="dropdown">
          <option value="" disabled selected>-- select --</option>
          <option value="don't like">don't like</option>
          <option value="doesn't like">doesn't like</option>
          <option value="doesn't likes">doesn't likes</option>
        </select>
        <span>playing computer games.</span>
        <button class="audio-btn" title="Listen" onclick="speakText('My friends don\'t like playing computer games.')">🔊</button>
      </div>
      <div class="feedback-msg"></div>
    </div>

    <!-- Item 4 -->
    <div class="question-item" data-correct="eats">
      <div class="question-line">
        <span>4. He often</span>
        <select class="dropdown">
          <option value="" disabled selected>-- select --</option>
          <option value="eat">eat</option>
          <option value="eats">eats</option>
          <option value="eating">eating</option>
        </select>
        <span>pasta at the restaurant.</span>
        <button class="audio-btn" title="Listen" onclick="speakText('He often eats pasta at the restaurant.')">🔊</button>
      </div>
      <div class="feedback-msg"></div>
    </div>

    <!-- Item 5 -->
    <div class="question-item" data-correct="read">
      <div class="question-line">
        <span>5. Mary and Tim never</span>
        <select class="dropdown">
          <option value="" disabled selected>-- select --</option>
          <option value="read">read</option>
          <option value="reads">reads</option>
          <option value="don't read">don't read</option>
        </select>
        <span>books on Saturday.</span>
        <button class="audio-btn" title="Listen" onclick="speakText('Mary and Tim never read books on Saturday.')">🔊</button>
      </div>
      <div class="feedback-msg"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-reset" onclick="resetAnswers()">Reset 🔄</button>
    <div class="score-badge" id="scoreBadge">Score: 0/5</div>
    <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔</button>
  </div>
</div>

<script>
  function checkAnswers() {
    let score = 0;
    const items = document.querySelectorAll('.question-item');

    items.forEach((item) => {
      const select = item.querySelector('.dropdown');
      const feedback = item.querySelector('.feedback-msg');
      const correctAnswer = item.getAttribute('data-correct');
      const userVal = select.value;

      item.classList.remove('correct', 'incorrect');
      feedback.classList.remove('correct', 'incorrect');

      if (!userVal) {
        item.classList.add('incorrect');
        feedback.textContent = 'Please choose an option.';
        feedback.className = 'feedback-msg incorrect';
        return;
      }

      if (userVal === correctAnswer) {
        score++;
        item.classList.add('correct');
        feedback.textContent = '✓ Correct!';
        feedback.className = 'feedback-msg correct';
      } else {
        item.classList.add('incorrect');
        feedback.textContent = `✗ Correct answer: "${correctAnswer}"`;
        feedback.className = 'feedback-msg incorrect';
      }
    });

    const scoreBadge = document.getElementById('scoreBadge');
    scoreBadge.textContent = `Score: ${score} / ${items.length}`;
    scoreBadge.style.display = 'inline-block';
  }

  function resetAnswers() {
    const items = document.querySelectorAll('.question-item');
    items.forEach(item => {
      item.classList.remove('correct', 'incorrect');
      const select = item.querySelector('.dropdown');
      const feedback = item.querySelector('.feedback-msg');
      select.selectedIndex = 0;
      feedback.textContent = '';
      feedback.className = 'feedback-msg';
    });

    const scoreBadge = document.getElementById('scoreBadge');
    scoreBadge.style.display = 'none';
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }
</script>

</body>
</html>
