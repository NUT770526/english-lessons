<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business English Translation Practice 💼</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 1rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: #38bdf8;
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .quiz-row {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 18px 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .prompt-sentence {
    font-size: 1.05rem;
    font-weight: 600;
    color: #f1f5f9;
    line-height: 1.5;
  }

  .input-wrapper {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: 1rem;
    color: #f8fafc;
    background-color: #1e293b;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    outline: none;
    transition: all 0.2s ease;
    width: 100%;
    box-sizing: border-box;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"].correct-input {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  input[type="text"].wrong-input {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .feedback {
    font-size: 0.9rem;
    font-weight: 600;
    display: none;
  }

  .feedback.show {
    display: block;
  }

  .feedback.correct-text {
    color: #4ade80;
  }

  .feedback.wrong-text {
    color: #fca5a5;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Business English Translation 💼</h2>
      <div class="subtitle">Перекладіть речення англійською мовою.</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <!-- Vocabulary Section -->
  <div class="section-title">1. Key Business Vocabulary (Лексика та вимова)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <!-- Exercise Questions -->
  <div class="section-title">2. Translate the Sentences</div>
  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordBank = [
    { word: "review emails", phonetic: "[rɪˈvjuː ˈiː.meɪlz]", ukr: "переглядати листи" },
    { word: "schedule a meeting", phonetic: "[ˈʃed.juːl ə ˈmiː.tɪŋ]", ukr: "призначити зустріч" },
    { word: "updated report", phonetic: "[ʌpˈdeɪ.tɪd rɪˈpɔːt]", ukr: "оновлений звіт" },
    { word: "hungry and thirsty", phonetic: "[ˈhʌŋ.ɡri ænd ˈθɜː.sti]", ukr: "голодний і хоче пити" },
    { word: "I'd be happy to", phonetic: "[aɪd biː ˈhæp.i tuː]", ukr: "я із задоволенням" }
  ];

  const questions = [
    {
      id: 1,
      num: "1.",
      ukr: "Зазвичай я переглядаю свої електронні листи перед ранковою зустріччю.",
      displayCorrect: "I usually review my emails before the morning meeting.",
      answers: [
        "i usually review my emails before the morning meeting",
        "i usually review my e-mails before the morning meeting",
        "i usually look through my emails before the morning meeting",
        "i usually look at my emails before the morning meeting",
        "i usually check my emails before the morning meeting"
      ]
    },
    {
      id: 2,
      num: "2.",
      ukr: "Наразі я відповідаю на запитання клієнта.",
      displayCorrect: "I am currently answering the client's questions.",
      answers: [
        "i am currently answering the client's questions",
        "i'm currently answering the client's questions",
        "i am currently answering the client's question",
        "i'm currently answering the client's question",
        "i am currently replying to the client's questions",
        "i am answering the client's questions currently",
        "currently i am answering the client's questions",
        "i am currently answering the customer's questions"
      ]
    },
    {
      id: 3,
      num: "3.",
      ukr: "Учора ми обговорили цю проблему.",
      displayCorrect: "Yesterday we discussed this problem.",
      answers: [
        "yesterday we discussed this problem",
        "we discussed this problem yesterday",
        "yesterday we discussed this issue",
        "we discussed this issue yesterday"
      ]
    },
    {
      id: 4,
      num: "4.",
      ukr: "Вона вже надіслала оновлений звіт.",
      displayCorrect: "She has already sent the updated report.",
      answers: [
        "she has already sent the updated report",
        "she's already sent the updated report",
        "she has already sent an updated report"
      ]
    },
    {
      id: 5,
      num: "5.",
      ukr: "Я хотів(ла) б призначити зустріч на вівторок.",
      displayCorrect: "I would like to schedule a meeting for Tuesday.",
      answers: [
        "i would like to schedule a meeting for tuesday",
        "i'd like to schedule a meeting for tuesday",
        "i would like to arrange a meeting for tuesday",
        "i'd like to arrange a meeting for tuesday",
        "i would like to set up a meeting for tuesday",
        "i'd like to set up a meeting for tuesday"
      ]
    },
    {
      id: 6,
      num: "6.",
      ukr: "Нещодавно ми отримали новий рахунок.",
      displayCorrect: "Recently we have received a new invoice.",
      answers: [
        "recently we have received a new invoice",
        "recently we've received a new invoice",
        "we have recently received a new invoice",
        "we've recently received a new invoice",
        "we have received a new invoice recently",
        "we received a new invoice recently"
      ]
    },
    {
      id: 7,
      num: "7.",
      ukr: "Після тривалої презентації він був голодний і хотів пити.",
      displayCorrect: "After the long presentation, he was hungry and thirsty.",
      answers: [
        "after the long presentation he was hungry and thirsty",
        "after the long presentation, he was hungry and thirsty",
        "after a long presentation he was hungry and thirsty",
        "after a long presentation, he was hungry and thirsty"
      ]
    },
    {
      id: 8,
      num: "8.",
      ukr: "Ви хотіли б, щоб я відповів / відповіла на цей електронний лист?",
      displayCorrect: "Would you like me to answer this email?",
      answers: [
        "would you like me to answer this email",
        "would you like me to answer this e-mail",
        "would you like me to reply to this email",
        "would you like me to reply to this e-mail"
      ]
    },
    {
      id: 9,
      num: "9.",
      ukr: "Я із задоволенням перегляну цей документ.",
      displayCorrect: "I'd be happy to review this document.",
      answers: [
        "i'd be happy to review this document",
        "i would be happy to review this document",
        "i'd love to review this document",
        "i would love to review this document",
        "i'd be happy to look at this document",
        "i would be happy to look at this document",
        "i'd be happy to have a look at this document"
      ]
    },
    {
      id: 10,
      num: "10.",
      ukr: "З чого ви хотіли б почати?",
      displayCorrect: "What would you like to start with?",
      answers: [
        "what would you like to start with",
        "what would you like to begin with",
        "where would you like to start",
        "where would you like to begin"
      ]
    }
  ];

  function cleanText(str) {
    return str.toLowerCase()
      .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'’"]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = wordBank.map(item => `
      <div class="vocab-card">
        <div class="vocab-info">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach(q => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      row.innerHTML = `
        <div class="prompt-sentence">
          <b>${q.num}</b> ${q.ukr}
        </div>
        <div class="input-wrapper">
          <input type="text" id="input-${q.id}" placeholder="Type English translation here..." autocomplete="off" />
          <div class="feedback" id="feedback-${q.id}"></div>
        </div>
      `;

      container.appendChild(row);
    });
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const inputEl = document.getElementById(`input-${q.id}`);
      const feedbackEl = document.getElementById(`feedback-${q.id}`);
      const userVal = cleanText(inputEl.value);

      inputEl.classList.remove('correct-input', 'wrong-input');
      feedbackEl.classList.remove('show', 'correct-text', 'wrong-text');

      const isCorrect = q.answers.some(ans => cleanText(ans) === userVal);

      if (userVal !== "" && isCorrect) {
        score++;
        inputEl.classList.add('correct-input');
        feedbackEl.innerText = "✓ Perfect translation!";
        feedbackEl.classList.add('show', 'correct-text');
      } else {
        inputEl.classList.add('wrong-input');
        feedbackEl.innerText = `💡 Key answer: "${q.displayCorrect}"`;
        feedbackEl.classList.add('show', 'wrong-text');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderVocab();
    renderQuiz();
  };
</script>

</body>
</html>
