<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write the number you hear</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --accent-green: #22c55e;
            --accent-green-hover: #16a34a;
            --text-dark: #1e293b;
            --border-color: #cbd5e1;
            --correct-green: #22c55e;
            --incorrect-red: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 22px;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .example-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 28px;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #15803d;
            font-weight: 600;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8fafc;
            padding: 12px 18px;
            border-radius: 10px;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .score {
            font-weight: 700;
            font-size: 15px;
            color: #475569;
        }

        .global-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .global-btn:hover {
            background-color: var(--accent-green-hover);
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .item {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: box-shadow 0.2s;
        }

        .item:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .sentence-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 17px;
        }

        input[type="text"] {
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
            width: 100px;
            text-align: center;
            font-weight: 600;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
        }

        input.correct {
            border-color: var(--correct-green) !important;
            background-color: #f0fdf4;
        }

        input.incorrect {
            border-color: var(--incorrect-red) !important;
            background-color: #fef2f2;
        }

        .actions-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .audio-btn {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            transition: background 0.2s;
        }

        .audio-btn:hover {
            background: #e2e8f0;
        }

        .check-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s;
            margin-left: auto;
        }

        .check-btn:hover {
            background-color: var(--accent-green-hover);
        }

        .feedback-mark {
            font-weight: 700;
            font-size: 14px;
            margin-left: 8px;
        }

        .feedback-mark.correct { color: var(--correct-green); }
        .feedback-mark.incorrect { color: var(--incorrect-red); }
    </style>
</head>
<body>

<div class="container">
    <h1>✏️ Write the number you hear</h1>

    <div class="example-box">
        <span>✓</span>
        <span>I'm Raffe. I'm <strong>11</strong> years old. (Example)</span>[cite: 26]
    </div>

    <div class="header-bar">
        <span class="score">Score: <span id="score">0</span> / 3</span>
        <div>
            <button class="global-btn" onclick="checkAll()">Check All</button>
            <button class="global-btn" style="background-color: #94a3b8;" onclick="resetAll()">Reset</button>
        </div>
    </div>

    <div class="exercise-list">
        <!-- 1 -->
        <div class="item">
            <div class="sentence-row">
                <span>1. My name is Eva. I’m</span>
                <input type="text" id="input1" data-answer="45" placeholder="age">
                <span>years old.</span>
                <button class="check-btn" onclick="checkItem(1)">CHECK</button>
            </div>
            <div class="actions-row">
                <button class="audio-btn" onclick="speakText('Hello! My name is Eva. I am 45 years old.')">🔊 Listen to Eva</button>
                <span id="mark1" class="feedback-mark">[ . ]</span>
            </div>
        </div>

        <!-- 2 -->
        <div class="item">
            <div class="sentence-row">
                <span>2. I’m John. I’m</span>
                <input type="text" id="input2" data-answer="60" placeholder="age">
                <span>years old.</span>
                <button class="check-btn" onclick="checkItem(2)">CHECK</button>
            </div>
            <div class="actions-row">
                <button class="audio-btn" onclick="speakText('Hi! I am John. I am 60 years old.')">🔊 Listen to John</button>
                <span id="mark2" class="feedback-mark">[ . ]</span>
            </div>
        </div>

        <!-- 3 -->
        <div class="item">
            <div class="sentence-row">
                <span>3. I’m Wendy. I’m</span>
                <input type="text" id="input3" data-answer="27" placeholder="age">
                <span>years old.</span>
                <button class="check-btn" onclick="checkItem(3)">CHECK</button>
            </div>
            <div class="actions-row">
                <button class="audio-btn" onclick="speakText('Hi! I am Wendy. I am 27 years old.')">🔊 Listen to Wendy</button>
                <span id="mark3" class="feedback-mark">[ . ]</span>
            </div>
        </div>
    </div>
</div>

<script>
    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        } else {
            alert('Your browser does not support text-to-speech.');
        }
    }

    function checkItem(num) {
        const input = document.getElementById('input' + num);
        const mark = document.getElementById('mark' + num);
        const correctAnswer = input.dataset.answer;
        const val = input.value.trim();

        if (val === "") {
            input.className = "";
            mark.className = "feedback-mark";
            mark.innerText = "[ . ]";
            updateTotalScore();
            return false;
        }

        if (val === correctAnswer) {
            input.className = "correct";
            mark.className = "feedback-mark correct";
            mark.innerText = "[ ✓ Correct ]";
            updateTotalScore();
            return true;
        } else {
            input.className = "incorrect";
            mark.className = "feedback-mark incorrect";
            mark.innerText = "[ ✗ Incorrect ]";
            updateTotalScore();
            return false;
        }
    }

    function checkAll() {
        for (let i = 1; i <= 3; i++) {
            checkItem(i);
        }
    }

    function resetAll() {
        for (let i = 1; i <= 3; i++) {
            const input = document.getElementById('input' + i);
            const mark = document.getElementById('mark' + i);
            input.value = "";
            input.className = "";
            mark.className = "feedback-mark";
            mark.innerText = "[ . ]";
        }
        document.getElementById('score').innerText = "0";
    }

    function updateTotalScore() {
        let count = 0;
        for (let i = 1; i <= 3; i++) {
            if (document.getElementById('input' + i).classList.contains('correct')) {
                count++;
            }
        }
        document.getElementById('score').innerText = count;
    }
</script>

</body>
</html>
