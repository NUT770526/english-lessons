<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan your next travel =)</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f0fdf4;
    color: #0f172a;
    padding: 40px 16px 24px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .app-container {
    max-width: 820px;
    width: 100%;
    background-color: #ffffff;
    border-radius: 24px;
    padding: 32px;
    box-shadow: 0 10px 25px rgba(14, 116, 144, 0.08);
    border: 2px solid #bae6fd;
    overflow: visible;
  }

  .header-title {
    font-size: 1.6rem;
    color: #0369a1;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
  }

  /* Table Design */
  .travel-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border: 2px solid #38bdf8;
    border-radius: 16px;
    margin-bottom: 24px;
  }

  .travel-table tr:not(:last-child) td {
    border-bottom: 1px solid #bae6fd;
  }

  .table-label-cell {
    background-color: #e0f2fe;
    width: 42%;
    padding: 18px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #0f172a;
    border-right: 2px solid #38bdf8;
    vertical-align: middle;
    position: relative;
    overflow: visible;
  }

  .table-input-cell {
    background-color: #ffffff;
    padding: 12px 16px;
    vertical-align: middle;
  }

  /* Colored labels */
  .label-destination {
    color: #ef4444;
  }

  .label-accommodation {
    color: #f97316;
  }

  .label-luggage {
    color: #a855f7;
  }

  .label-transport {
    color: #0d9488;
  }

  .label-sightseeing {
    color: #f43f5e;
  }

  /* Fixed Tooltip logic — drops BELOW the word so it never gets cut off */
  .word-tooltip {
    border-bottom: 2px dotted currentColor;
    cursor: pointer;
    position: relative;
    display: inline-block;
  }

  .word-tooltip:hover::after {
    content: attr(data-hint);
    position: absolute;
    top: 130%;
    left: 0;
    background-color: #0f172a;
    color: #ffffff;
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.88rem;
    font-weight: 500;
    white-space: nowrap;
    z-index: 9999;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    text-align: left;
    pointer-events: none;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid #bae6fd;
    background-color: #f8fafc;
    color: #0f172a;
    outline: none;
    transition: all 0.2s;
    width: 100%;
  }

  input[type="text"]:focus {
    border-color: #0284c7;
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }

  .footer-controls {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    padding-top: 10px;
  }

  .btn-reset {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 10px;
    border: none;
    background-color: #e0f2fe;
    color: #0369a1;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-reset:hover {
    background-color: #bae6fd;
  }
</style>
</head>
<body>

<div class="app-container">
  
  <div class="header-title">
    <span>🎬</span>
    <h2>Plan your next travel and fill in the table =)</h2>
  </div>

  <table class="travel-table">
    <tbody>
      
      <!-- Destination -->
      <tr>
        <td class="table-label-cell">
          Your <span class="word-tooltip label-destination" data-hint="[ˌdes.tɪˈneɪ.ʃən] — пункт призначення" onmouseenter="playAudio('destination')">destination</span>
        </td>
        <td class="table-input-cell">
          <input type="text" placeholder="Where are you going?..." autocomplete="off" spellcheck="false">
        </td>
      </tr>

      <!-- Accommodation -->
      <tr>
        <td class="table-label-cell">
          Your <span class="word-tooltip label-accommodation" data-hint="[əˌkɒm.əˈdeɪ.ʃən] — житло / готель" onmouseenter="playAudio('accommodation')">accommodation</span>
        </td>
        <td class="table-input-cell">
          <input type="text" placeholder="Where will you stay?..." autocomplete="off" spellcheck="false">
        </td>
      </tr>

      <!-- Luggage -->
      <tr>
        <td class="table-label-cell">
          Your <span class="word-tooltip label-luggage" data-hint="[ˈlʌɡ.ɪdʒ] — багаж / речі" onmouseenter="playAudio('luggage')">luggage</span>
        </td>
        <td class="table-input-cell">
          <input type="text" placeholder="What will you pack?..." autocomplete="off" spellcheck="false">
        </td>
      </tr>

      <!-- Transport -->
      <tr>
        <td class="table-label-cell">
          Your <span class="word-tooltip label-transport" data-hint="[ˈtræn.spɔːt] — транспорт" onmouseenter="playAudio('transport')">transport</span>
        </td>
        <td class="table-input-cell">
          <input type="text" placeholder="How will you travel?..." autocomplete="off" spellcheck="false">
        </td>
      </tr>

      <!-- Sightseeing list -->
      <tr>
        <td class="table-label-cell">
          Your <span class="word-tooltip label-sightseeing" data-hint="[ˈsaɪtˌsiː.ɪŋ lɪst] — список пам'яток" onmouseenter="playAudio('sightseeing list')">sightseeing list</span>
        </td>
        <td class="table-input-cell">
          <input type="text" placeholder="What will you see?..." autocomplete="off" spellcheck="false">
        </td>
      </tr>

    </tbody>
  </table>

  <div class="footer-controls">
    <button type="button" class="btn-reset" onclick="resetAll()">Очистити таблицю 🔄</button>
  </div>

</div>

<script>
  function resetAll() {
    document.querySelectorAll('input[type="text"]').forEach(input => {
      input.value = '';
    });
  }

  function playAudio(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }
</script>

</body>
</html>
