<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Dialogues Practice 💼</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 1rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: #38bdf8;
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .quiz-row {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 18px 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .dialogue-speaker {
    font-size: 1.05rem;
    color: #f1f5f9;
    line-height: 1.6;
  }

  .dialogue-speaker b {
    color: #38bdf8;
  }

  .interactive-line {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  select {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #38bdf8;
    background-color: #1e293b;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  select:focus {
    border-color: var(--accent);
  }

  select.correct-select {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  select.wrong-select {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Exercise 4. Complete the business dialogues 💬</h2>
      <div class="subtitle">Доповніть діалоги відповідними фразами з випадаючого списку.</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <!-- Vocabulary Section -->
  <div class="section-title">1. Useful Phrases & Audio (Фрази та вимова)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <!-- Exercise Questions -->
  <div class="section-title">2. Dialogues</div>
  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordBank = [
    { word: "I'd love to", phonetic: "[aɪd lʌv tuː]", ukr: "Я із задоволенням" },
    { word: "Not just yet", phonetic: "[nɒt ʤʌst jet]", ukr: "Ще ні / Поки ні" },
    { word: "That would be great", phonetic: "[ðæt wʊd biː ɡreɪt]", ukr: "Це було б чудово" },
    { word: "as you prefer", phonetic: "[æz juː prɪˈfɜːr]", ukr: "як вам зручніше" },
    { word: "if you like", phonetic: "[ɪf juː laɪk]", ukr: "якщо бажаєте" },
    { word: "Would you like me to", phonetic: "[wʊd juː laɪk miː tuː]", ukr: "Чи хочете ви, щоб я..." },
    { word: "What would you like me to do?", phonetic: "[wɒt wʊd juː laɪk miː tuː duː]", ukr: "Що ви хочете, щоб я зробив(ла)?" },
    { word: "have a look at", phonetic: "[hæv ə lʊk æt]", ukr: "поглянути на" },
    { word: "I'd be happy to", phonetic: "[aɪd biː ˈhæp.i tuː]", ukr: "Я з радістю..." }
  ];

  const phraseOptions = [
    "I'd love to",
    "No, thank you",
    "Not just yet",
    "That would be great",
    "as you prefer",
    "if you like",
    "Would you like me to",
    "What would you like me to do?",
    "have a look at",
    "I'd be happy to"
  ];

  const dialogues = [
    {
      id: 1,
      num: "1.",
      lineA: "A: Would you like to join our meeting?",
      bPrefix: "B: Yes, ",
      bSuffix: ".",
      correct: "I'd love to"
    },
    {
      id: 2,
      num: "2.",
      lineA: "A: Would you like some coffee?",
      bPrefix: "B: ",
      bSuffix: ". I'm not thirsty.",
      correct: "No, thank you"
    },
    {
      id: 3,
      num: "3.",
      lineA: "A: Are you ready to begin the presentation?",
      bPrefix: "B: ",
      bSuffix: ". I need two more minutes.",
      correct: "Not just yet"
    },
    {
      id: 4,
      num: "4.",
      lineA: "A: I can send you the report today.",
      bPrefix: "B: ",
      bSuffix: ".",
      correct: "That would be great"
    },
    {
      id: 5,
      num: "5.",
      lineA: "A: Would you like to meet online or in the office?",
      bPrefix: "B: We can meet online, but ",
      bSuffix: ".",
      correct: "as you prefer"
    },
    {
      id: 6,
      num: "6.",
      lineA: "A: We can discuss the payment now, ",
      bPrefix: "",
      bSuffix: ".",
      lineBAfter: "B: Yes, let’s discuss it.",
      correct: "if you like",
      isOptionInA: true
    },
    {
      id: 7,
      num: "7.",
      lineA: "A: ",
      bPrefix: "",
      bSuffix: " send the invoice to the client?",
      lineBAfter: "B: Yes, please.",
      correct: "Would you like me to",
      isOptionInA: true
    },
    {
      id: 8,
      num: "8.",
      lineA: "A: We have finished the report. ",
      bPrefix: "",
      bSuffix: "",
      lineBAfter: "B: Please email it to the manager.",
      correct: "What would you like me to do?",
      isOptionInA: true
    },
    {
      id: 9,
      num: "9.",
      lineA: "A: Could you ",
      bPrefix: "",
      bSuffix: " this contract?",
      lineBAfter: "B: Yes, of course.",
      correct: "have a look at",
      isOptionInA: true
    },
    {
      id: 10,
      num: "10.",
      lineA: "A: Could you answer the client’s questions?",
      bPrefix: "B: Certainly. ",
      bSuffix: " help.",
      correct: "I'd be happy to"
    }
  ];

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = wordBank.map(item => `
      <div class="vocab-card">
        <div class="vocab-info">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    dialogues.forEach(d => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      const optionsHtml = ['<option value="">-- select phrase --</option>']
        .concat(phraseOptions.map(opt => `<option value="${opt}">${opt}</option>`))
        .join('');

      if (d.isOptionInA) {
        row.innerHTML = `
          <div class="interactive-line dialogue-speaker">
            <span><b>${d.num}</b> ${d.lineA}</span>
            <select id="select-${d.id}">
              ${optionsHtml}
            </select>
            <span>${d.bSuffix}</span>
          </div>
          <div class="dialogue-speaker">${d.lineBAfter}</div>
        `;
      } else {
        row.innerHTML = `
          <div class="dialogue-speaker"><b>${d.num}</b> ${d.lineA}</div>
          <div class="interactive-line dialogue-speaker">
            <span>${d.bPrefix}</span>
            <select id="select-${d.id}">
              ${optionsHtml}
            </select>
            <span>${d.bSuffix}</span>
          </div>
        `;
      }

      container.appendChild(row);
    });
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    dialogues.forEach(d => {
      const selectEl = document.getElementById(`select-${d.id}`);
      const val = selectEl.value;

      selectEl.classList.remove('correct-select', 'wrong-select');

      if (val === d.correct) {
        score++;
        selectEl.classList.add('correct-select');
      } else {
        selectEl.classList.add('wrong-select');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderVocab();
    renderQuiz();
  };
</script>

</body>
</html>
