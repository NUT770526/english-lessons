<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вправа 5. Знайдіть і виправте помилку</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #f1f5f9;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d2d2d;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 2px solid #333333;
      padding-bottom: 15px;
    }

    .header-icon {
      font-size: 1.8rem;
    }

    h2 {
      color: #ffffff;
      margin: 0;
      font-size: 1.5rem;
    }

    .instruction {
      background: #262626;
      border-left: 4px solid #38bdf8;
      padding: 14px 16px;
      border-radius: 6px;
      margin-bottom: 25px;
      font-size: 0.95rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .exercise-card {
      background: #262626;
      border: 1px solid #3b3b3b;
      border-radius: 12px;
      padding: 16px 20px;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sentence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 1.05rem;
      color: #ffffff;
      line-height: 1.5;
    }

    .item-num {
      color: #38bdf8;
      font-weight: bold;
      margin-right: 6px;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .arrow {
      color: #38bdf8;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .text-input {
      flex-grow: 1;
      background-color: #1e1e1e;
      color: #38bdf8;
      border: 2px solid #3b3b3b;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .text-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
    }

    /* Validation Styles */
    .text-input.correct {
      border-color: #22c55e;
      color: #4ade80;
      background-color: #14532d;
    }

    .text-input.incorrect {
      border-color: #ef4444;
      color: #f87171;
      background-color: #7f1d1d;
    }

    .correct-answer-hint {
      font-size: 0.85rem;
      color: #4ade80;
      margin-left: 28px;
      display: none;
      line-height: 1.4;
    }

    /* Audio Button */
    .audio-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.7;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      opacity: 1;
    }

    /* Controls */
    .controls {
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid #333333;
      padding-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-check {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-check:hover {
      background-color: #0369a1;
    }

    .btn-reset {
      background-color: #334155;
      color: #f1f5f9;
    }

    .btn-reset:hover {
      background-color: #475569;
    }

    .score-display {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="header-icon">🔍</span>
    <h2>Вправа 5. Знайдіть і виправте помилку</h2>
  </div>

  <div class="instruction">
    У кожному мікродіалозі є одна помилка. Напишіть <strong>правильний варіант всієї другої репліки</strong> (або правильне слово) у поле нижче.
  </div>

  <div class="exercise-list" id="exerciseContainer"></div>

  <div class="controls">
    <div>
      <button class="btn btn-check" onclick="checkAnswers()">Перевірити</button>
      <button class="btn btn-reset" onclick="resetExercise()">Скинути</button>
    </div>
    <div class="score-display" id="scoreDisplay"></div>
  </div>
</div>

<script>
  const exerciseData = [
    {
      id: 1,
      part1: "“I approve invoices every Monday.”",
      incorrectPart: "“So am I.”",
      correctFull: "So do I.",
      correctWord: "do",
      fullSpeech: "I approve invoices every Monday. So do I."
    },
    {
      id: 2,
      part1: "“The accountant is available today.”",
      incorrectPart: "“So does the manager.”",
      correctFull: "So is the manager.",
      correctWord: "is",
      fullSpeech: "The accountant is available today. So is the manager."
    },
    {
      id: 3,
      part1: "“We attended the conference yesterday.”",
      incorrectPart: "“So do they.”",
      correctFull: "So did they.",
      correctWord: "did",
      fullSpeech: "We attended the conference yesterday. So did they."
    },
    {
      id: 4,
      part1: "“I’m showing the report now.”",
      incorrectPart: "“So do I.”",
      correctFull: "So am I.",
      correctWord: "am",
      fullSpeech: "I'm showing the report now. So am I."
    },
    {
      id: 5,
      part1: "“Our clients are pleased with the service.”",
      incorrectPart: "“So do we.”",
      correctFull: "So are we.",
      correctWord: "are",
      fullSpeech: "Our clients are pleased with the service. So are we."
    },
    {
      id: 6,
      part1: "“I don’t count these payments.”",
      incorrectPart: "“Neither am I.”",
      correctFull: "Neither do I.",
      correctWord: "do",
      fullSpeech: "I don't count these payments. Neither do I."
    },
    {
      id: 7,
      part1: "“The manager didn’t approve the invoice.”",
      incorrectPart: "“Neither does the accountant.”",
      correctFull: "Neither did the accountant.",
      correctWord: "did",
      fullSpeech: "The manager didn't approve the invoice. Neither did the accountant."
    },
    {
      id: 8,
      part1: "“Anna isn’t available now.”",
      incorrectPart: "“Neither does Mark.”",
      correctFull: "Neither is Mark.",
      correctWord: "is",
      fullSpeech: "Anna isn't available now. Neither is Mark."
    },
    {
      id: 9,
      part1: "“We weren’t pleased with the results.”",
      incorrectPart: "“Neither did they.”",
      correctFull: "Neither were they.",
      correctWord: "were",
      fullSpeech: "We weren't pleased with the results. Neither were they."
    },
    {
      id: 10,
      part1: "“I didn’t attend the meeting.”",
      incorrectPart: "“I don’t either.”",
      correctFull: "I didn't either.",
      correctWord: "didn't",
      fullSpeech: "I didn't attend the meeting. I didn't either."
    },
    {
      id: 11,
      part1: "“The accountant is counting the payments.”",
      incorrectPart: "“So does the manager.”",
      correctFull: "So is the manager.",
      correctWord: "is",
      fullSpeech: "The accountant is counting the payments. So is the manager."
    },
    {
      id: 12,
      part1: "“We aren’t working at the weekend.”",
      incorrectPart: "“Neither do they.”",
      correctFull: "Neither are they.",
      correctWord: "are",
      fullSpeech: "We aren't working at the weekend. Neither are they."
    }
  ];

  function speak(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }

  function normalizeText(text) {
    return text
      .trim()
      .toLowerCase()
      .replace(/’/g, "'")
      .replace(/[“„”"]/g, "")
      .replace(/[.,?!]/g, "")
      .replace(/\s+/g, " ");
  }

  function renderExercise() {
    const container = document.getElementById("exerciseContainer");
    container.innerHTML = "";

    exerciseData.forEach(item => {
      const card = document.createElement("div");
      card.className = "exercise-card";

      // Sentence Row
      const sentenceRow = document.createElement("div");
      sentenceRow.className = "sentence-row";

      const textSpan = document.createElement("span");
      textSpan.innerHTML = `<span class="item-num">${item.id}.</span> ${item.part1} — <span style="color: #f87171;">${item.incorrectPart}</span>`;

      const audioBtn = document.createElement("button");
      audioBtn.className = "audio-btn";
      audioBtn.innerHTML = "🔊";
      audioBtn.title = "Прослухати правильний варіант";
      audioBtn.onclick = () => speak(item.fullSpeech);

      sentenceRow.appendChild(textSpan);
      sentenceRow.appendChild(audioBtn);

      // Input Row
      const inputRow = document.createElement("div");
      inputRow.className = "input-row";

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.innerHTML = "&rarr;";

      const input = document.createElement("input");
      input.type = "text";
      input.className = "text-input";
      input.id = `input-${item.id}`;
      input.placeholder = "Напишіть правильну репліку або замінене слово...";

      input.addEventListener("input", () => {
        input.classList.remove("correct", "incorrect");
        document.getElementById(`hint-${item.id}`).style.display = "none";
      });

      inputRow.appendChild(arrow);
      inputRow.appendChild(input);

      // Hint Element
      const hint = document.createElement("div");
      hint.className = "correct-answer-hint";
      hint.id = `hint-${item.id}`;

      card.appendChild(sentenceRow);
      card.appendChild(inputRow);
      card.appendChild(hint);
      container.appendChild(card);
    });
  }

  function checkAnswers() {
    let score = 0;

    exerciseData.forEach(item => {
      const input = document.getElementById(`input-${item.id}`);
      const hint = document.getElementById(`hint-${item.id}`);
      const userVal = normalizeText(input.value);

      const targetFull = normalizeText(item.correctFull);
      const targetWord = normalizeText(item.correctWord);

      // Принимает как полную исправленную реплику, так и одно замененное слово
      if (userVal === targetFull || userVal === targetWord) {
        input.className = "text-input correct";
        hint.style.display = "none";
        score++;
      } else {
        input.className = "text-input incorrect";
        hint.innerText = `Правильний варіант: "${item.correctFull}" (слово: "${item.correctWord}")`;
        hint.style.display = "block";
      }
    });

    document.getElementById("scoreDisplay").innerText = `Результат: ${score} / ${exerciseData.length}`;
  }

  function resetExercise() {
    renderExercise();
    document.getElementById("scoreDisplay").innerText = "";
  }

  renderExercise();
</script>

</body>
</html>
