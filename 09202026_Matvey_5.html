<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make Your Own List of Hobbies! 🎨</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --input-bg: #ffffff;
    --input-text: #0f172a;
    --success: #22c55e;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 800px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: var(--accent);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 0.95rem;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* List Inputs Area */
  .inputs-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 24px;
    border-radius: 16px;
    margin-bottom: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .row-num {
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent);
    width: 24px;
  }

  .hobby-input {
    flex: 1;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--input-text);
    background-color: var(--input-bg);
    border: 2px solid #cbd5e1;
    border-radius: 10px;
    padding: 10px 16px;
    outline: none;
    transition: all 0.2s ease;
  }

  .hobby-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }

  /* Suggested Vocab Grid */
  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    cursor: pointer;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: var(--accent);
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 6px 10px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .status-msg {
    text-align: center;
    margin-top: 16px;
    font-weight: 700;
    font-size: 1rem;
    min-height: 24px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>▶ Make your own list of hobbies! 🎨</h2>
    <div class="subtitle">Складіть свій власний список з 5 захоплень. Ви можете ввести власні варіанти або кликнути на ідею зі словника ниже.</div>
  </div>

  <!-- Interactive Inputs -->
  <div class="section-title">Your Hobby List</div>
  <div class="inputs-card">
    <div class="input-row">
      <span class="row-num">1.</span>
      <input type="text" class="hobby-input" id="hobby-1" placeholder="Type a hobby here...">
    </div>
    <div class="input-row">
      <span class="row-num">2.</span>
      <input type="text" class="hobby-input" id="hobby-2" placeholder="Type a hobby here...">
    </div>
    <div class="input-row">
      <span class="row-num">3.</span>
      <input type="text" class="hobby-input" id="hobby-3" placeholder="Type a hobby here...">
    </div>
    <div class="input-row">
      <span class="row-num">4.</span>
      <input type="text" class="hobby-input" id="hobby-4" placeholder="Type a hobby here...">
    </div>
    <div class="input-row">
      <span class="row-num">5.</span>
      <input type="text" class="hobby-input" id="hobby-5" placeholder="Type a hobby here...">
    </div>
  </div>

  <!-- Suggested Vocabulary -->
  <div class="section-title">Hobby Ideas & Pronunciation (Натисніть, щоб додати у список)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkList()">Complete List ✨</button>
    <button class="action-btn secondary" onclick="resetList()">Reset 🔄</button>
  </div>

  <div class="status-msg" id="status"></div>
</div>

<script>
  const vocabData = [
    { word: "Swimming", phonetic: "[ˈswɪm.ɪŋ]", ukr: "плавання" },
    { word: "Playing chess", phonetic: "[ˈpleɪ.ɪŋ tʃes]", ukr: "гра в шахи" },
    { word: "Solving puzzles", phonetic: "[ˈsɒl.vɪŋ ˈpʌz.əlz]", ukr: "розв'язування головоломок" },
    { word: "Computing", phonetic: "[kəmˈpjuː.tɪŋ]", ukr: "програмування / ПК" },
    { word: "Photography", phonetic: "[fəˈtɒɡ.rə.fi]", ukr: "фотографія" },
    { word: "Reading books", phonetic: "[ˈriː.dɪŋ bʊks]", ukr: "читання книг" }
  ];

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = vocabData.map(item => `
      <div class="vocab-card">
        <div class="vocab-info" onclick="addIdea('${item.word}')">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');
  }

  function addIdea(word) {
    for (let i = 1; i <= 5; i++) {
      const input = document.getElementById(`hobby-${i}`);
      if (input.value.trim() === '') {
        input.value = word;
        speakWord(word);
        break;
      }
    }
  }

  function speakWord(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkList() {
    let filledCount = 0;
    for (let i = 1; i <= 5; i++) {
      const input = document.getElementById(`hobby-${i}`);
      if (input.value.trim() !== '') {
        filledCount++;
      }
    }

    const statusEl = document.getElementById('status');
    if (filledCount === 5) {
      statusEl.style.color = '#22c55e';
      statusEl.innerText = 'Great job! Your list of 5 hobbies is complete! 🎉';
    } else {
      statusEl.style.color = '#38bdf8';
      statusEl.innerText = `You filled ${filledCount} of 5 hobbies. Add ${5 - filledCount} more! ✍️`;
    }
  }

  function resetList() {
    for (let i = 1; i <= 5; i++) {
      document.getElementById(`hobby-${i}`).value = '';
    }
    document.getElementById('status').innerText = '';
  }

  window.onload = () => {
    renderVocab();
  };
</script>

</body>
</html>
