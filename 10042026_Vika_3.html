<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Збери фразу, потім доповни речення</title>
<style>
  :root {
    --bg-color: #f0f9ff;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --accent-color: #0284c7;
    --accent-hover: #0369a1;
    --border-color: #bae6fd;
    --selected-bg: #e0f2fe;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px;
    border: 3px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15);
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .title {
    font-size: 1.6rem;
    font-weight: 800;
    color: #0369a1;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 1rem;
    color: #0284c7;
    background: #e0f2fe;
    padding: 8px 16px;
    border-radius: 12px;
    display: inline-block;
  }

  .section-title {
    font-size: 1.2rem;
    font-weight: 800;
    color: #0369a1;
    margin: 24px 0 16px;
    padding-bottom: 6px;
    border-bottom: 2px dashed var(--border-color);
  }

  /* Matching Section */
  .match-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
  }

  .match-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .match-item {
    background-color: #ffffff;
    border: 2px solid var(--border-color);
    border-radius: 14px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
  }

  .match-item:hover {
    border-color: var(--accent-color);
    background-color: #f8fafc;
  }

  .match-item.selected {
    background-color: var(--selected-bg);
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
  }

  .match-slot {
    width: 38px;
    height: 38px;
    border: 2px dashed var(--accent-color);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: var(--accent-color);
    background-color: #e0f2fe;
    margin-left: auto;
    font-size: 1.1rem;
  }

  /* Sentences Section */
  .sentence-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 28px;
  }

  .sentence-card {
    background-color: #ffffff;
    border: 2px solid var(--border-color);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .sentence-num {
    color: var(--accent-color);
    font-weight: 800;
    min-width: 24px;
  }

  .gap-input {
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    color: #0369a1;
    background-color: #e0f2fe;
    border: 2px solid var(--border-color);
    border-radius: 10px;
    padding: 6px 12px;
    outline: none;
    min-width: 180px;
    flex: 1;
    max-width: 300px;
  }

  .gap-input:focus {
    border-color: var(--accent-color);
    background-color: #ffffff;
  }

  /* Speaker Button */
  .speaker-btn {
    background: #e0f2fe;
    border: 2px solid var(--border-color);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    margin-left: auto;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background-color: var(--accent-color);
    color: #ffffff;
    transform: scale(1.1);
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .btn-reset {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    padding: 10px 24px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #64748b;
    color: #ffffff;
    transition: all 0.2s ease;
  }

  .btn-reset:hover {
    background: #475569;
  }

  @media (max-width: 600px) {
    .match-container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 class="title">3. Збери фразу, потім доповни речення</h2>
    <p class="subtitle">1. Натисни на початок фрази зліва, а потім на закінчення справа!</p>
  </div>

  <!-- Part 1: Matching -->
  <div class="section-title">1. З'єднай частини фраз:</div>
  <div class="match-container">
    <div class="match-list" id="beginnings-list"></div>
    <div class="match-list" id="endings-list"></div>
  </div>

  <!-- Part 2: Sentences -->
  <div class="section-title">2. Встав утворені фрази (кожну один раз):</div>
  <div class="sentence-list" id="sentences-list"></div>

  <div class="controls">
    <button class="btn-reset" onclick="resetExercise()">Скинути 🔄</button>
  </div>
</div>

<script>
  const matchData = [
    { id: 1, text: "have" },
    { id: 2, text: "solve" },
    { id: 3, text: "as fast" },
    { id: 4, text: "revise" },
    { id: 5, text: "describe" }
  ];

  const endingsData = [
    { letter: "a", text: "my room" },
    { letter: "b", text: "new words" },
    { letter: "c", text: "a shower" },
    { letter: "d", text: "the riddles" },
    { letter: "e", text: "as possible" }
  ];

  const sentencesData = [
    { num: 1, before: "I", after: "every morning." },
    { num: 2, before: "I", after: "before an English test." },
    { num: 3, before: "I run", after: "." },
    { num: 4, before: "I", after: ": it is small and nice." },
    { num: 5, before: "I", after: "in this book." }
  ];

  let activeLeftIndex = null;

  function speakText(text) {
    if (!text) return;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }
  }

  function renderPart1() {
    const beginningsContainer = document.getElementById('beginnings-list');
    const endingsContainer = document.getElementById('endings-list');

    beginningsContainer.innerHTML = '';
    endingsContainer.innerHTML = '';

    matchData.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'match-item';
      row.id = `left-item-${index}`;
      
      row.onclick = () => selectLeft(index, item.text);

      row.innerHTML = `
        <span style="color: var(--accent-color);">${index + 1}.</span>
        <span>${item.text}</span>
        <div class="match-slot" id="slot-${index}">?</div>
      `;
      beginningsContainer.appendChild(row);
    });

    endingsData.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'match-item';
      
      row.onclick = () => selectRight(item.letter, item.text);

      row.innerHTML = `
        <span style="color: var(--accent-color); font-weight: 800;">${item.letter}.</span>
        <span>${item.text}</span>
      `;
      endingsContainer.appendChild(row);
    });
  }

  function selectLeft(index, text) {
    speakText(text);

    document.querySelectorAll('#beginnings-list .match-item').forEach(el => el.classList.remove('selected'));
    
    if (activeLeftIndex === index) {
      activeLeftIndex = null;
    } else {
      activeLeftIndex = index;
      document.getElementById(`left-item-${index}`).classList.add('selected');
    }
  }

  function selectRight(letter, text) {
    speakText(text);

    if (activeLeftIndex !== null) {
      const slot = document.getElementById(`slot-${activeLeftIndex}`);
      slot.textContent = letter;

      document.getElementById(`left-item-${activeLeftIndex}`).classList.remove('selected');
      activeLeftIndex = null;
    }
  }

  function renderPart2() {
    const container = document.getElementById('sentences-list');
    container.innerHTML = '';

    sentencesData.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = 'sentence-card';

      row.innerHTML = `
        <span class="sentence-num">${item.num}.</span>
        <span>${item.before}</span>
        <input type="text" class="gap-input" id="gap-input-${index}" placeholder="...">
        <span>${item.after}</span>
        <button class="speaker-btn" title="Слухати написане" onclick="speakSentence(${index})">🔊</button>
      `;

      container.appendChild(row);
    });
  }

  function speakSentence(index) {
    const item = sentencesData[index];
    const userVal = document.getElementById(`gap-input-${index}`).value.trim();
    const fullText = `${item.before} ${userVal} ${item.after}`;
    speakText(fullText);
  }

  function resetExercise() {
    activeLeftIndex = null;
    matchData.forEach((_, index) => {
      const slot = document.getElementById(`slot-${index}`);
      if (slot) slot.textContent = '?';
      const item = document.getElementById(`left-item-${index}`);
      if (item) item.classList.remove('selected');
    });

    sentencesData.forEach((_, index) => {
      const input = document.getElementById(`gap-input-${index}`);
      if (input) input.value = '';
    });
  }

  renderPart1();
  renderPart2();
</script>

</body>
</html>
