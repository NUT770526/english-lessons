<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Put these words in the correct form</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-yellow: #f59e0b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .task-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .task-icon {
            font-size: 1.8rem;
        }

        .task-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .questions-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .question-card {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .item-num {
            background: rgba(245, 158, 11, 0.15);
            border: 1.5px solid var(--accent-yellow);
            color: var(--accent-yellow);
            font-weight: 700;
            font-size: 1rem;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .question-content {
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.8;
            flex-grow: 1;
        }

        .input-wrapper {
            display: inline-flex;
            align-items: center;
            position: relative;
            margin: 0 4px;
        }

        .gap-input {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 1rem;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .gap-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .gap-input.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.1) !important;
            color: var(--accent-green);
        }

        .gap-input.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.1) !important;
            color: var(--accent-red);
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            border: none;
            color: var(--accent-blue);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="task-header">
        <span class="task-icon">▶️</span>
        <div class="task-title">Put these words in the correct form</div>
    </div>

    <div class="questions-container" id="questionsContainer"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Score: - / 5</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Check ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        </div>
    </div>
</div>

<script>
    const quizData = [
        {
            id: 1,
            prefix: "At the moment I am",
            placeholder: "to learn",
            suffix: "English here.",
            answers: ["learning"],
            audioTemplate: "At the moment I am learning English here."
        },
        {
            id: 2,
            prefix: "That’s cool, but what are you",
            placeholder: "to study",
            suffix: "exactly?",
            answers: ["studying"],
            audioTemplate: "That’s cool, but what are you studying exactly?"
        },
        {
            id: 3,
            prefix: "I",
            placeholder: "to be",
            suffix: "not an expert on sociology, really.",
            answers: ["am", "'m"],
            audioTemplate: "I am not an expert on sociology, really."
        },
        {
            id: 4,
            prefix: "It’s about how people",
            placeholder: "to think",
            suffix: "differently.",
            answers: ["think"],
            audioTemplate: "It’s about how people think differently."
        },
        {
            id: 5,
            prefix: "So, students and workers",
            placeholder: "to think",
            suffix: "exactly the same way?",
            answers: ["think", "don't think", "do not think"],
            audioTemplate: "So, students and workers think exactly the same way?"
        }
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderQuiz() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        quizData.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';

            const width = Math.max(q.placeholder.length * 12, 100);

            card.innerHTML = `
                <div class="item-num">${q.id}</div>
                <div class="question-content">
                    ${q.prefix} 
                    <span class="input-wrapper">
                        <input type="text" 
                               class="gap-input" 
                               id="input-${q.id}" 
                               placeholder="${q.placeholder}"
                               style="width: ${width}px;"
                               autocomplete="off">
                    </span>
                    ${q.suffix}
                </div>
                <button class="audio-btn" onclick="speak('${q.audioTemplate.replace(/'/g, "\\'")}')" title="Listen sentence">🔊</button>
            `;
            container.appendChild(card);
        });
    }

    function checkAnswers() {
        let score = 0;

        quizData.forEach(q => {
            const input = document.getElementById(`input-${q.id}`);
            const val = input.value.trim().toLowerCase();
            
            input.classList.remove('correct', 'incorrect');

            const isCorrect = q.answers.some(ans => ans.toLowerCase() === val);

            if (isCorrect) {
                score++;
                input.classList.add('correct');
            } else {
                input.classList.add('incorrect');
                input.value = `${input.value} (${q.answers[0]})`;
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: ${score} / ${quizData.length}`;
        scoreDisplay.style.color = score === quizData.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        quizData.forEach(q => {
            const input = document.getElementById(`input-${q.id}`);
            input.value = '';
            input.classList.remove('correct', 'incorrect');
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: - / ${quizData.length}`;
        scoreDisplay.style.color = 'var(--accent-blue)';
    }

    window.onload = renderQuiz;
</script>

</body>
</html>
