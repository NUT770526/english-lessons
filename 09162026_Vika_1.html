<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 1. Match the Words</title>
<style>
  :root {
    --primary: #8b5cf6;
    --primary-hover: #7c3aed;
    --bg: #f5f3ff;
    --card: #ffffff;
    --text: #1e1b4b;
    --border: #ddd6fe;
    --selected: #c4b5fd;
    --correct: #10b981;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 820px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 4px 0;
    font-size: 1.5rem;
    color: #4c1d95;
    font-weight: 700;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #6b21a8;
    font-style: italic;
  }

  .score-board {
    background: #f3e8ff;
    border: 1.5px solid var(--border);
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 700;
    color: #581c87;
    font-size: 1.05rem;
  }

  .instructions {
    background-color: #faf5ff;
    border-left: 4px solid var(--primary);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 24px;
    font-size: 0.92rem;
    color: #581c87;
  }

  .matching-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .column-title {
    font-weight: 700;
    color: #6b21a8;
    margin-bottom: 8px;
    text-align: center;
    text-transform: uppercase;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }

  .item-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .match-card {
    background: #ffffff;
    border: 2px solid #e9d5ff;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 24px;
  }

  .match-card:hover:not(.disabled) {
    border-color: var(--primary);
    background-color: #faf5ff;
    transform: translateY(-1px);
  }

  .match-card.selected {
    background-color: var(--selected);
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
  }

  .match-card.matched {
    background-color: #d1fae5;
    border-color: var(--correct);
    color: #065f46;
    cursor: default;
  }

  .match-card.wrong {
    background-color: #fee2e2;
    border-color: var(--wrong);
    color: #991b1b;
    animation: shake 0.3s ease;
  }

  .audio-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 6px;
    transition: transform 0.15s ease;
  }

  .audio-btn:hover {
    transform: scale(1.15);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
  }

  .reset-btn {
    background-color: var(--primary);
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    transition: all 0.2s ease;
  }

  .reset-btn:hover {
    background-color: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
  }

  @media (max-width: 600px) {
    .matching-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Exercise 1. Match the words</h2>
      <div class="subtitle">З'єднай слово з відповідною транскрипцією.</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <div class="instructions">
    🎯 <b>Як грати:</b> Натисни слово з лівого стовпчика, а потім обери його транскрипцію справа.
  </div>

  <div class="matching-grid">
    <div>
      <div class="column-title">English Words</div>
      <div class="item-list" id="words-list"></div>
    </div>
    <div>
      <div class="column-title">Transcription</div>
      <div class="item-list" id="trans-list"></div>
    </div>
  </div>

  <div class="controls">
    <button class="reset-btn" onclick="initGame()">Restart Game 🔄</button>
  </div>
</div>

<script>
  const data = [
    { id: 1, word: '1. guitar', text: 'guitar', trans: 'f. /ɡɪˈtɑːr/' },
    { id: 2, word: '2. piano', text: 'piano', trans: 'j. /piˈænəʊ/' },
    { id: 3, word: '3. violin', text: 'violin', trans: 'h. /ˌvaɪəˈlɪn/' },
    { id: 4, word: '4. drums', text: 'drums', trans: 'c. /drʌmz/' },
    { id: 5, word: '5. keyboard', text: 'keyboard', trans: 'd. /ˈkiːbɔːd/' },
    { id: 6, word: '6. famous', text: 'famous', trans: 'a. /ˈfeɪməs/' },
    { id: 7, word: '7. cousin', text: 'cousin', trans: 'e. /ˈkʌzən/' },
    { id: 8, word: '8. Ireland', text: 'Ireland', trans: 'b. /ˈaɪələnd/' },
    { id: 9, word: '9. often', text: 'often', trans: 'g. /ˈɒfən/' },
    { id: 10, word: '10. late', text: 'late', trans: 'i. /leɪt/' }
  ];

  let selectedWord = null;
  let selectedTrans = null;
  let score = 0;

  function speakWord(text, event) {
    if (event) event.stopPropagation();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  function shuffle(array) {
    return array.slice().sort(() => Math.random() - 0.5);
  }

  function initGame() {
    selectedWord = null;
    selectedTrans = null;
    score = 0;
    document.getElementById('score').innerText = score;

    const wordsList = document.getElementById('words-list');
    const transList = document.getElementById('trans-list');

    wordsList.innerHTML = '';
    transList.innerHTML = '';

    const shuffledWords = shuffle(data);
    const shuffledTrans = shuffle(data);

    shuffledWords.forEach(item => {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.dataset.id = item.id;
      card.innerHTML = `
        <span>${item.word}</span>
        <button class="audio-btn" onclick="speakWord('${item.text}', event)" title="Listen">🔊</button>
      `;
      card.onclick = () => selectWord(card);
      wordsList.appendChild(card);
    });

    shuffledTrans.forEach(item => {
      const card = document.createElement('div');
      card.className = 'match-card';
      card.dataset.id = item.id;
      card.innerText = item.trans;
      card.onclick = () => selectTrans(card);
      transList.appendChild(card);
    });
  }

  function selectWord(card) {
    if (card.classList.contains('matched')) return;
    
    document.querySelectorAll('#words-list .match-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedWord = card;

    const wordObj = data.find(item => item.id == card.dataset.id);
    if (wordObj) speakWord(wordObj.text);

    checkMatch();
  }

  function selectTrans(card) {
    if (card.classList.contains('matched')) return;

    document.querySelectorAll('#trans-list .match-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedTrans = card;

    checkMatch();
  }

  function checkMatch() {
    if (selectedWord && selectedTrans) {
      const wordId = selectedWord.dataset.id;
      const transId = selectedTrans.dataset.id;

      if (wordId === transId) {
        selectedWord.classList.remove('selected');
        selectedTrans.classList.remove('selected');
        selectedWord.classList.add('matched', 'disabled');
        selectedTrans.classList.add('matched', 'disabled');

        selectedWord = null;
        selectedTrans = null;

        score++;
        document.getElementById('score').innerText = score;
      } else {
        const tempWord = selectedWord;
        const tempTrans = selectedTrans;

        tempWord.classList.add('wrong');
        tempTrans.classList.add('wrong');

        setTimeout(() => {
          tempWord.classList.remove('wrong', 'selected');
          tempTrans.classList.remove('wrong', 'selected');
        }, 500);

        selectedWord = null;
        selectedTrans = null;
      }
    }
  }

  window.onload = initGame;
</script>

</body>
</html>
