<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6. Change Present Simple into Past Simple</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #6c5ce7;
      --accent-hover: #5a4bcf;
      --text: #f1f2f6;
      --text-muted: #a4b0be;
      --correct: #2ed573;
      --incorrect: #ff4757;
      --border: #2f3542;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.8rem;
      margin-top: 0;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 25px;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }

    .sentence-card {
      background: #252530;
      padding: 16px 20px;
      border-radius: 12px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
    }

    .original-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .time-marker {
      color: var(--accent);
      font-style: italic;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input.text-input {
      flex-grow: 1;
      background-color: #1a1a24;
      color: var(--text);
      border: 2px solid var(--border);
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    input.text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(108, 92, 231, 0.4);
    }

    .audio-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      background: rgba(108, 92, 231, 0.2);
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    button.action-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.action-btn:hover {
      background-color: var(--accent-hover);
    }

    button.reset-btn {
      background-color: transparent;
      border: 2px solid var(--border);
      color: var(--text-muted);
    }

    button.reset-btn:hover {
      background-color: var(--border);
      color: var(--text);
    }

    .result {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .correct-card {
      border-color: var(--correct) !important;
      background: rgba(46, 213, 115, 0.1) !important;
    }

    .incorrect-card {
      border-color: var(--incorrect) !important;
      background: rgba(255, 71, 87, 0.1) !important;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Exercise 6. Change Present Simple into Past Simple</h1>
  <p class="subtitle">Rewrite each sentence in the Past Simple using the time expression in brackets:</p>

  <div class="exercise-list" id="exercise-list"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers</button>
    <button class="action-btn reset-btn" onclick="resetExercise()">Reset</button>
    <div class="result" id="result-text"></div>
  </div>
</div>

<script>
  const sentencesData = [
    {
      num: 1,
      present: "I run to the office when I am late.",
      bracket: "yesterday",
      answers: [
        "I ran to the office yesterday when I was late.",
        "I ran to the office when I was late yesterday.",
        "Yesterday I ran to the office when I was late."
      ]
    },
    {
      num: 2,
      present: "The company lorry runs from the warehouse to the shop.",
      bracket: "last Monday",
      answers: [
        "The company lorry ran from the warehouse to the shop last Monday.",
        "Last Monday the company lorry ran from the warehouse to the shop."
      ]
    },
    {
      num: 3,
      present: "The receptionist gives directions to our visitors.",
      bracket: "yesterday",
      answers: [
        "The receptionist gave directions to our visitors yesterday.",
        "Yesterday the receptionist gave directions to our visitors."
      ]
    },
    {
      num: 4,
      present: "The manager controls the delivery process.",
      bracket: "last month",
      answers: [
        "The manager controlled the delivery process last month.",
        "Last month the manager controlled the delivery process."
      ]
    },
    {
      num: 5,
      present: "We meet our clients in the square.",
      bracket: "last Tuesday",
      answers: [
        "We met our clients in the square last Tuesday.",
        "Last Tuesday we met our clients in the square."
      ]
    },
    {
      num: 6,
      present: "We walk round the building before the inspection.",
      bracket: "yesterday",
      answers: [
        "We walked round the building before the inspection yesterday.",
        "Yesterday we walked round the building before the inspection.",
        "We walked around the building before the inspection yesterday.",
        "Yesterday we walked around the building before the inspection."
      ]
    },
    {
      num: 7,
      present: "The café is round the corner from our office.",
      bracket: "last year",
      answers: [
        "The café was round the corner from our office last year.",
        "The cafe was round the corner from our office last year.",
        "The café was around the corner from our office last year.",
        "The cafe was around the corner from our office last year.",
        "Last year the café was round the corner from our office.",
        "Last year the cafe was round the corner from our office."
      ]
    },
    {
      num: 8,
      present: "The courier stops at the side of the building.",
      bracket: "yesterday morning",
      answers: [
        "The courier stopped at the side of the building yesterday morning.",
        "Yesterday morning the courier stopped at the side of the building."
      ]
    },
    {
      num: 9,
      present: "Our team sees the monument in front of the hotel.",
      bracket: "during our business trip",
      answers: [
        "Our team saw the monument in front of the hotel during our business trip.",
        "During our business trip our team saw the monument in front of the hotel."
      ]
    },
    {
      num: 10,
      present: "The driver turns the corner carefully.",
      bracket: "yesterday",
      answers: [
        "The driver turned the corner carefully yesterday.",
        "Yesterday the driver turned the corner carefully."
      ]
    }
  ];

  function renderExercise() {
    const listEl = document.getElementById('exercise-list');
    listEl.innerHTML = '';
    document.getElementById('result-text').textContent = '';

    sentencesData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'sentence-card';
      card.id = `card-${idx}`;

      card.innerHTML = `
        <div class="original-text">
          <span>${item.num}. ${item.present} <span class="time-marker">(${item.bracket})</span></span>
        </div>
        <div class="input-wrapper">
          <input type="text" class="text-input" id="input-${idx}" placeholder="Type Past Simple sentence here..." autocomplete="off">
          <button class="audio-btn" title="Listen sentence" onclick="speakSentence(${idx})">🔊</button>
        </div>
      `;

      listEl.appendChild(card);
    });
  }

  function normalizeText(text) {
    return text
      .trim()
      .toLowerCase()
      .replace(/[?.,!]/g, '')
      .replace(/’/g, "'")
      .replace(/`|'/g, "'")
      .replace(/\s+/g, ' ');
  }

  function checkAnswers() {
    let correctCount = 0;

    sentencesData.forEach((item, idx) => {
      const card = document.getElementById(`card-${idx}`);
      const input = document.getElementById(`input-${idx}`);
      const userValue = normalizeText(input.value);

      card.classList.remove('correct-card', 'incorrect-card');

      const isCorrect = item.answers.some(ans => normalizeText(ans) === userValue);

      if (isCorrect) {
        correctCount++;
        card.classList.add('correct-card');
      } else {
        card.classList.add('incorrect-card');
      }
    });

    const resultText = document.getElementById('result-text');
    resultText.textContent = `Score: ${correctCount} / ${sentencesData.length}`;
    resultText.style.color = correctCount === sentencesData.length ? 'var(--correct)' : 'var(--text)';
  }

  function resetExercise() {
    renderExercise();
  }

  function speakSentence(idx) {
    const item = sentencesData[idx];
    const input = document.getElementById(`input-${idx}`);
    const textToSpeak = input.value.trim() !== '' ? input.value : item.answers[0];

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  window.onload = renderExercise;
</script>

</body>
</html>
