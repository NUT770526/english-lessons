<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True or False - Self-Checking Exercise</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f7fb;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border-color: #e5e7eb;
      
      --correct-color: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      
      --wrong-color: #dc2626;
      --wrong-bg: #fef2f2;
      --wrong-border: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container {
      max-width: 840px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .score-board {
      display: none;
      background: linear-gradient(135deg, #e0e7ff, #eeeffe);
      border: 2px solid #c7d2fe;
      border-radius: 16px;
      padding: 16px 24px;
      text-align: center;
      margin-bottom: 24px;
      font-family: 'Fredoka', sans-serif;
    }

    .score-board.active {
      display: block;
    }

    .score-title {
      font-size: 1.2rem;
      color: #3730a3;
    }

    .score-value {
      font-size: 2rem;
      color: var(--primary);
    }

    .exercise-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
    }

    .statement-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .statement-card {
      display: flex;
      flex-direction: column;
      background: #fafafa;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 20px;
      gap: 14px;
      transition: all 0.2s ease;
    }

    .statement-card.is-correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
    }

    .statement-card.is-wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
    }

    .statement-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .num-badge {
      background: #e0e7ff;
      color: var(--primary);
      font-weight: 700;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .statement-text {
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-main);
      flex-grow: 1;
    }

    .options-group {
      display: flex;
      gap: 12px;
      align-self: flex-end;
    }

    .btn-option {
      border: 2px solid var(--border-color);
      background: white;
      padding: 8px 22px;
      border-radius: 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }

    .btn-option:hover:not(:disabled) {
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .btn-option.selected {
      border-color: var(--primary);
      background-color: #eeeffe;
      color: var(--primary);
    }

    .btn-option.correct-choice {
      background-color: #dcfce7 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
    }

    .btn-option.wrong-choice {
      background-color: #fee2e2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    .explanation {
      display: none;
      font-size: 0.9rem;
      color: #475569;
      background: #ffffff;
      padding: 10px 14px;
      border-radius: 10px;
      border-left: 4px solid var(--primary);
      margin-top: 4px;
    }

    .explanation.active {
      display: block;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 32px;
    }

    .btn-submit, .btn-reset {
      border: none;
      padding: 14px 32px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      font-family: 'Fredoka', sans-serif;
      transition: all 0.2s ease;
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn-reset {
      background-color: #e2e8f0;
      color: #475569;
    }

    .btn-reset:hover {
      background-color: #cbd5e1;
    }

    @media (min-width: 640px) {
      .statement-card {
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
      }
      .options-group {
        align-self: center;
      }
      .explanation {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🎯 True or False (Self-Checking)</h1>
      <p class="subtitle">Read the statements based on the dialogue, select TRUE or FALSE, and check your answers!</p>
    </header>

    <div class="score-board" id="scoreBoard">
      <div class="score-title">Your Score</div>
      <div class="score-value" id="scoreText">0 / 10</div>
    </div>

    <div class="exercise-card">
      <div class="statement-list" id="statementList"></div>

      <div class="actions">
        <button class="btn-submit" id="checkBtn" onclick="checkAnswers()">Check Answers 🚀</button>
        <button class="btn-reset" id="resetBtn" onclick="resetExercise()" style="display: none;">Try Again 🔄</button>
      </div>
    </div>
  </div>

  <script>
    const data = [
      {
        id: 1,
        stmt: "Peter is looking for a hobby that he will stick with for a long time.",
        answer: "TRUE",
        explanation: "💡 Text says: Peter wants a hobby that he 'won't back out of in a week or two'."
      },
      {
        id: 2,
        stmt: "Amalia suggested chess because she thought Peter would enjoy sitting quietly.",
        answer: "FALSE",
        explanation: "💡 Text says: Amalia suggested chess just as an idea. Peter rejected it because he 'can't stand sitting down for too long'."
      },
      {
        id: 3,
        stmt: "Peter thinks that most regular sports are too similar to each other.",
        answer: "TRUE",
        explanation: "💡 Text says: Peter complains that in basketball, football, and rugby 'you just run'."
      },
      {
        id: 4,
        stmt: "Amalia has already started doing extreme mountain biking herself.",
        answer: "FALSE",
        explanation: "💡 Text says: Amalia says 'I decided to take up extreme mountain biking', meaning she is planning to start."
      },
      {
        id: 5,
        stmt: "To go mountain biking, Amalia says you need to bring a lot of equipment with you.",
        answer: "FALSE",
        explanation: "💡 Text says: Amalia explicitly says 'you don't need to set up a lot of equipment. Actually, you don't need to set up anything'."
      },
      {
        id: 6,
        stmt: "Peter never learned to ride a bike when he was a child.",
        answer: "TRUE",
        explanation: "💡 Text says: Peter confesses 'when I was a kid, I never learned how to ride a bike'."
      },
      {
        id: 7,
        stmt: "Peter tried snowboarding last year and found it enjoyable.",
        answer: "FALSE",
        explanation: "💡 Text says: Peter tried SKIING last year ('I tried to ski last year...'), not snowboarding."
      },
      {
        id: 8,
        stmt: "Amalia's brother agreed to try snowboarding right away without any hesitation.",
        answer: "FALSE",
        explanation: "💡 Text says: Her brother 'absolutely refused for months' before finally agreeing."
      },
      {
        id: 9,
        stmt: "Peter and Amalia plan to buy equipment before going to the slopes.",
        answer: "TRUE",
        explanation: "💡 Text says: Amalia says 'we can pick you up a board and some equipment this week, then hit the slopes on the weekend'."
      },
      {
        id: 10,
        stmt: "Peter hopes that Amalia's brother will come along and help him learn.",
        answer: "TRUE",
        explanation: "💡 Text says: Peter says 'Maybe your brother will also turn up and both of you can teach me and give me tips'."
      }
    ];

    const userAnswers = {};
    let isChecked = false;

    function render() {
      const listEl = document.getElementById('statementList');
      listEl.innerHTML = '';

      data.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'statement-card';
        card.id = `card-${item.id}`;

        let statusClass = '';
        if (isChecked) {
          const userAns = userAnswers[item.id];
          if (userAns === item.answer) {
            card.classList.add('is-correct');
          } else {
            card.classList.add('is-wrong');
          }
        }

        card.innerHTML = `
          <div class="statement-header">
            <div class="num-badge">${item.id}</div>
            <div class="statement-text">${item.stmt}</div>
          </div>
          <div class="options-group">
            <button class="btn-option ${getBtnClass(item, 'TRUE')}" 
                    onclick="selectOption(${item.id}, 'TRUE')" 
                    ${isChecked ? 'disabled' : ''}>
              ✓ TRUE
            </button>
            <button class="btn-option ${getBtnClass(item, 'FALSE')}" 
                    onclick="selectOption(${item.id}, 'FALSE')" 
                    ${isChecked ? 'disabled' : ''}>
              ✗ FALSE
            </button>
          </div>
          <div class="explanation ${isChecked ? 'active' : ''}">${item.explanation}</div>
        `;

        listEl.appendChild(card);
      });
    }

    function getBtnClass(item, optionVal) {
      const userAns = userAnswers[item.id];

      if (!isChecked) {
        return userAns === optionVal ? 'selected' : '';
      }

      // If checked
      if (optionVal === item.answer) {
        return 'correct-choice';
      }
      if (userAns === optionVal && userAns !== item.answer) {
        return 'wrong-choice';
      }
      return '';
    }

    function selectOption(id, val) {
      if (isChecked) return;
      userAnswers[id] = val;
      render();
    }

    function checkAnswers() {
      if (Object.keys(userAnswers).length < data.length) {
        alert("Please answer all questions before checking!");
        return;
      }

      isChecked = true;
      let score = 0;

      data.forEach(item => {
        if (userAnswers[item.id] === item.answer) {
          score++;
        }
      });

      render();

      const scoreBoard = document.getElementById('scoreBoard');
      const scoreText = document.getElementById('scoreText');
      scoreText.textContent = `${score} / ${data.length}`;
      scoreBoard.classList.add('active');

      document.getElementById('checkBtn').style.display = 'none';
      document.getElementById('resetBtn').style.display = 'inline-block';
    }

    function resetExercise() {
      for (let key in userAnswers) delete userAnswers[key];
      isChecked = false;
      document.getElementById('scoreBoard').classList.remove('active');
      document.getElementById('checkBtn').style.display = 'inline-block';
      document.getElementById('resetBtn').style.display = 'none';
      render();
    }

    // Initial render
    render();
  </script>
</body>
</html>
