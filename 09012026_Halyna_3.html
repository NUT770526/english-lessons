<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3. Translate into English (Level A2)</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #6c5ce7;
      --accent-hover: #5a4bcf;
      --text: #f1f2f6;
      --text-muted: #a4b0be;
      --correct: #2ed573;
      --incorrect: #ff4757;
      --border: #2f3542;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.8rem;
      margin-top: 0;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 25px;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }

    .sentence-card {
      background: #252530;
      padding: 16px 20px;
      border-radius: 12px;
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s, background 0.2s;
    }

    .original-text {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input.text-input {
      flex-grow: 1;
      background-color: #1a1a24;
      color: var(--text);
      border: 2px solid var(--border);
      padding: 10px 14px;
      font-size: 1rem;
      border-radius: 8px;
      outline: none;
      transition: all 0.2s ease;
    }

    input.text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(108, 92, 231, 0.4);
    }

    .audio-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      background: rgba(108, 92, 231, 0.2);
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    button.action-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.action-btn:hover {
      background-color: var(--accent-hover);
    }

    button.reset-btn {
      background-color: transparent;
      border: 2px solid var(--border);
      color: var(--text-muted);
    }

    button.reset-btn:hover {
      background-color: var(--border);
      color: var(--text);
    }

    .result {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .correct-card {
      border-color: var(--correct) !important;
      background: rgba(46, 213, 115, 0.1) !important;
    }

    .incorrect-card {
      border-color: var(--incorrect) !important;
      background: rgba(255, 71, 87, 0.1) !important;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Exercise 3. Translate into English (Level A2)</h1>
  <p class="subtitle">Перекладіть речення англійською мовою у відповідні поля:</p>

  <div class="exercise-list" id="exercise-list"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Перевірити</button>
    <button class="action-btn reset-btn" onclick="resetExercise()">Скинути</button>
    <div class="result" id="result-text"></div>
  </div>
</div>

<script>
  const sentencesData = [
    {
      num: 1,
      ua: "Наш офіс на головній площі.",
      answers: [
        "Our office is in the main square.",
        "Our office is on the main square.",
        "Our office is in the central square."
      ]
    },
    {
      num: 2,
      ua: "Перед офісом є пам'ятник.",
      answers: [
        "In front of the office there is a monument.",
        "There is a monument in front of the office."
      ]
    },
    {
      num: 3,
      ua: "Вантажівка стоїть біля будівлі.",
      answers: [
        "The lorry is next to the building.",
        "The lorry is at the side of the building.",
        "The truck is next to the building.",
        "The truck is near the building."
      ]
    },
    {
      num: 4,
      ua: "Банк за два квартали звідси.",
      answers: [
        "The bank is two blocks away from here.",
        "The bank is two blocks away."
      ]
    },
    {
      num: 5,
      ua: "Будь ласка, йдіть сюди.",
      answers: [
        "Please go in this direction.",
        "Please walk in this direction.",
        "Please go this way."
      ]
    },
    {
      num: 6,
      ua: "Менеджер перевіряє всі доставки.",
      answers: [
        "The manager checks all deliveries.",
        "The manager controls all deliveries.",
        "The manager checks all the deliveries."
      ]
    },
    {
      num: 7,
      ua: "Учора ми обійшли навколо центру.",
      answers: [
        "Yesterday we walked round the centre.",
        "Yesterday we walked around the centre.",
        "We walked round the centre yesterday.",
        "We walked around the centre yesterday.",
        "Yesterday we walked round the center.",
        "Yesterday we walked around the center."
      ]
    },
    {
      num: 8,
      ua: "Поверніть за ріг, і ви побачите офіс праворуч.",
      answers: [
        "Turn the corner and you will see the office on the right.",
        "Turn the corner and you'll see the office on the right."
      ]
    },
    {
      num: 9,
      ua: "Напишіть номер у верхньому правому куті.",
      answers: [
        "Write the number in the top right corner.",
        "Write the number in the top right-hand corner."
      ]
    },
    {
      num: 10,
      ua: "Учора клієнти чекали перед готелем.",
      answers: [
        "Yesterday customers waited in front of the hotel.",
        "Yesterday the clients waited in front of the hotel.",
        "Customers waited in front of the hotel yesterday.",
        "The clients waited in front of the hotel yesterday."
      ]
    }
  ];

  function renderExercise() {
    const listEl = document.getElementById('exercise-list');
    listEl.innerHTML = '';
    document.getElementById('result-text').textContent = '';

    sentencesData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'sentence-card';
      card.id = `card-${idx}`;

      card.innerHTML = `
        <div class="original-text">
          <span>${item.num}. ${item.ua}</span>
        </div>
        <div class="input-wrapper">
          <input type="text" class="text-input" id="input-${idx}" placeholder="Type English translation here..." autocomplete="off">
          <button class="audio-btn" title="Listen correct translation" onclick="speakTranslation(${idx})">🔊</button>
        </div>
      `;

      listEl.appendChild(card);
    });
  }

  function normalizeText(text) {
    return text
      .trim()
      .toLowerCase()
      .replace(/[?.,!]/g, '')
      .replace(/’/g, "'")
      .replace(/`|'/g, "'")
      .replace(/\s+/g, ' ');
  }

  function checkAnswers() {
    let correctCount = 0;

    sentencesData.forEach((item, idx) => {
      const card = document.getElementById(`card-${idx}`);
      const input = document.getElementById(`input-${idx}`);
      const userValue = normalizeText(input.value);

      card.classList.remove('correct-card', 'incorrect-card');

      const isCorrect = item.answers.some(ans => normalizeText(ans) === userValue);

      if (isCorrect) {
        correctCount++;
        card.classList.add('correct-card');
      } else {
        card.classList.add('incorrect-card');
      }
    });

    const resultText = document.getElementById('result-text');
    resultText.textContent = `Результат: ${correctCount} / ${sentencesData.length}`;
    resultText.style.color = correctCount === sentencesData.length ? 'var(--correct)' : 'var(--text)';
  }

  function resetExercise() {
    renderExercise();
  }

  function speakTranslation(idx) {
    const item = sentencesData[idx];
    const input = document.getElementById(`input-${idx}`);
    const textToSpeak = input.value.trim() !== '' ? input.value : item.answers[0];

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  window.onload = renderExercise;
</script>

</body>
</html>
