<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose the correct option</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #0f172a;
    --accent-color: #2563eb;
    --border-color: #cbd5e1;
    --correct-bg: #dcfce7;
    --correct-border: #16a34a;
    --correct-text: #15803d;
    --incorrect-bg: #fee2e2;
    --incorrect-border: #dc2626;
    --incorrect-text: #b91c1c;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 720px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 36px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
  }

  /* Header Section */
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 2px solid #f1f5f9;
  }

  .header-icon {
    width: 42px;
    height: 42px;
    background: #e0e7ff;
    color: #3730a3;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: bold;
    border: 2px solid #c7d2fe;
  }

  .title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #1e3a8a;
  }

  /* Sentences List */
  .sentences-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 32px;
  }

  .sentence-item {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1.1rem;
    background: #f8fafc;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    transition: background-color 0.2s ease;
    flex-wrap: wrap;
  }

  .sentence-item:hover {
    background: #f1f5f9;
  }

  .sentence-num {
    background: #93c5fd;
    color: #1e3a8a;
    font-weight: bold;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    flex-shrink: 0;
  }

  .sentence-text {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    cursor: pointer;
  }

  /* Custom Select Container */
  .select-wrapper {
    display: inline-block;
    position: relative;
  }

  select {
    appearance: none;
    -webkit-appearance: none;
    background-color: #ffffff;
    border: 2px solid #94a3b8;
    border-radius: 8px;
    padding: 6px 32px 6px 14px;
    font-size: 1.05rem;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    outline: none;
    transition: all 0.2s ease;
    min-width: 130px;
  }

  select:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* Dropdown Arrow */
  .select-wrapper::after {
    content: '⌵';
    font-size: 1rem;
    font-weight: bold;
    color: #64748b;
    position: absolute;
    right: 12px;
    top: 45%;
    transform: translateY(-50%);
    pointer-events: none;
  }

  /* Validation Styles */
  select.correct {
    background-color: var(--correct-bg) !important;
    border-color: var(--correct-border) !important;
    color: var(--correct-text) !important;
  }

  select.incorrect {
    background-color: var(--incorrect-bg) !important;
    border-color: var(--incorrect-border) !important;
    color: var(--incorrect-text) !important;
  }

  .audio-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    opacity: 0.6;
    transition: opacity 0.2s ease;
    margin-left: auto;
  }

  .audio-btn:hover {
    opacity: 1;
  }

  /* Controls and Feedback */
  .controls {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-check {
    background: #2563eb;
    color: #ffffff;
  }

  .btn-check:hover {
    background: #1d4ed8;
  }

  .btn-reset {
    background: #64748b;
    color: #ffffff;
  }

  .btn-reset:hover {
    background: #475569;
  }

  .feedback-msg {
    text-align: center;
    font-weight: 700;
    font-size: 1.15rem;
    margin-top: 24px;
    min-height: 32px;
  }

  @media (max-width: 480px) {
    .container {
      padding: 20px 16px;
    }
    .sentence-item {
      font-size: 1rem;
    }
    select {
      font-size: 0.95rem;
      padding: 4px 28px 4px 10px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-icon">✓</div>
    <h1 class="title">Choose the correct option</h1>
  </div>

  <div class="sentences-list" id="sentences-container"></div>

  <div class="controls">
    <button class="btn btn-check" onclick="checkAnswers()">Check 🎯</button>
    <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
  </div>

  <div class="feedback-msg" id="feedback"></div>
</div>

<script>
  const sentencesData = [
    {
      id: 1,
      prefix: "They",
      suffix: "to the cinema on Fridays.",
      options: ["go", "gos", "goes"],
      answer: "go"
    },
    {
      id: 2,
      prefix: "He",
      suffix: "to the cinema on Fridays.",
      options: ["don't go", "go", "goes"],
      answer: "goes"
    },
    {
      id: 3,
      prefix: "We",
      suffix: "a taxi to work.",
      options: ["takes", "don't take", "doesn't take"],
      answer: "don't take"
    },
    {
      id: 4,
      prefix: "He",
      suffix: "a bus to work.",
      options: ["take", "takes", "taking"],
      answer: "takes"
    },
    {
      id: 5,
      prefix: "Tim",
      suffix: "reading in the evening.",
      options: ["like", "likes", "don't like"],
      answer: "likes"
    },
    {
      id: 6,
      prefix: "Mary and Pete",
      suffix: "to school on Saturday.",
      options: ["don't goes", "don't go", "doesn't go"],
      answer: "don't go"
    }
  ];

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      window.speechSynthesis.speak(utterance);
    }
  }

  function getFullSentenceText(item) {
    const selectElem = document.getElementById(`select-${item.id}`);
    const selectedVal = selectElem.value ? selectElem.value : "___";
    return `${item.prefix} ${selectedVal} ${item.suffix}`;
  }

  function renderSentences() {
    const container = document.getElementById('sentences-container');
    container.innerHTML = '';

    sentencesData.forEach(item => {
      const row = document.createElement('div');
      row.className = 'sentence-item';

      const optionsHtml = item.options
        .map(opt => `<option value="${opt}">${opt}</option>`)
        .join('');

      row.innerHTML = `
        <span class="sentence-num">${item.id}</span>
        <div class="sentence-text">
          <span>${item.prefix}</span>
          <div class="select-wrapper">
            <select id="select-${item.id}">
              <option value="" disabled selected hidden></option>
              ${optionsHtml}
            </select>
          </div>
          <span>${item.suffix}</span>
        </div>
        <button class="audio-btn" title="Listen" onclick="speakText(getFullSentenceText(sentencesData[${item.id - 1}]))">🔊</button>
      `;

      container.appendChild(row);
    });
  }

  function checkAnswers() {
    let allSelected = true;
    let correctCount = 0;

    sentencesData.forEach(item => {
      const select = document.getElementById(`select-${item.id}`);
      select.classList.remove('correct', 'incorrect');

      if (!select.value) {
        allSelected = false;
      } else if (select.value === item.answer) {
        select.classList.add('correct');
        correctCount++;
      } else {
        select.classList.add('incorrect');
      }
    });

    const feedback = document.getElementById('feedback');
    if (!allSelected) {
      feedback.style.color = '#d97706';
      feedback.textContent = 'Please choose an option for all sentences! ✏️';
      return;
    }

    if (correctCount === sentencesData.length) {
      feedback.style.color = '#16a34a';
      feedback.textContent = `Score: ${correctCount} / ${sentencesData.length}. Well done! 🎉`;
    } else {
      feedback.style.color = '#dc2626';
      feedback.textContent = `Score: ${correctCount} / ${sentencesData.length}. Review highlighted answers and try again! 💡`;
    }
  }

  function resetExercise() {
    sentencesData.forEach(item => {
      const select = document.getElementById(`select-${item.id}`);
      select.value = '';
      select.classList.remove('correct', 'incorrect');
    });
    const feedback = document.getElementById('feedback');
    feedback.textContent = '';
  }

  window.onload = renderSentences;
</script>

</body>
</html>
