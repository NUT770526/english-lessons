<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Town Map & Vocabulary 🗺️</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 1rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 1rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: #38bdf8;
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .preps-container {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 24px;
  }

  .word-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .word-tag {
    background: #1e293b;
    color: #e2e8f0;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-row {
    background: #1e293b;
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .prompt-text {
    font-size: 1.05rem;
    font-weight: 500;
    color: #f1f5f9;
    flex: 1;
    min-width: 280px;
  }

  select {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #38bdf8;
    background-color: #0f172a;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
    min-width: 200px;
  }

  select:focus {
    border-color: var(--accent);
  }

  select.correct-select {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  select.wrong-select {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Town Map & Vocabulary 🗺️</h2>
      <div class="subtitle">Послухай вимову окремих слів (🔊), вивчи транскрипцію та розв'яжи завдання!</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <!-- Vocab Section with Transcription & Audio -->
  <div class="section-title">1. Places Vocabulary (Нові слова)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <!-- Prepositions Section -->
  <div class="preps-container">
    <div class="section-title">2. Prepositions (Прийменники місця)</div>
    <div class="word-tags" id="preps-container"></div>
  </div>

  <!-- Quiz Questions -->
  <div class="section-title">3. Town Map Practice</div>
  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const locations = [
    { word: "police station", phonetic: "[pəˈliːs ˈsteɪ.ʃən]", ukr: "поліцейський участок" },
    { word: "concert hall", phonetic: "[ˈkɒn.sət hɔːl]", ukr: "концертний зал" },
    { word: "chemist's", phonetic: "[ˈkem.ɪsts]", ukr: "аптека" },
    { word: "grocery store", phonetic: "[ˈɡrəʊ.sər.i stɔːr]", ukr: "продуктовий магазин" },
    { word: "school", phonetic: "[skuːl]", ukr: "школа" },
    { word: "bank", phonetic: "[bæŋk]", ukr: "банк" },
    { word: "church", phonetic: "[tʃɜːtʃ]", ukr: "церква" },
    { word: "litter bin", phonetic: "[ˈlɪt.ər bɪn]", ukr: "урна для сміття" }
  ];

  const prepositions = [
    { word: "opposite", phonetic: "[ˈɒp.ə.zɪt]", ukr: "напроти" },
    { word: "across", phonetic: "[əˈkrɒs]", ukr: "через / з іншого боку" },
    { word: "behind", phonetic: "[bɪˈhaɪnd]", ukr: "позаду / за" },
    { word: "to the left of", phonetic: "[tə ðə left əv]", ukr: "ліворуч від" },
    { word: "to the right of", phonetic: "[tə ðə raɪt əv]", ukr: "праворуч від" },
    { word: "next to", phonetic: "[nekst tə]", ukr: "поруч з" },
    { word: "between", phonetic: "[bɪˈtwiːn]", ukr: "між" }
  ];

  const questions = [
    { id: 1, question: "1. The school is _______ the police station.", correct: "behind" },
    { id: 2, question: "2. The concert hall is _______ the chemist's and the police station.", correct: "between" },
    { id: 3, question: "3. The bank is _______ the chemist's.", correct: "next to" },
    { id: 4, question: "4. Is the school opposite or behind the chemist's? It is _______ the chemist's.", correct: "behind" },
    { id: 5, question: "5. The litter bin is _______ the grocery store.", correct: "next to" },
    { id: 6, question: "6. The green car is _______ the school.", correct: "across" },
    { id: 7, question: "7. The grocery store is _______ the street from the concert hall.", correct: "across" },
    { id: 8, question: "8. Is there a church next to the police station? No, the church is _______ the grocery store.", correct: "next to" },
    { id: 9, question: "9. The chemist's is _______ the bank.", correct: "to the right of" },
    { id: 10, question: "10. The police station is _______ the concert hall.", correct: "to the right of" }
  ];

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = locations.map(item => `
      <div class="vocab-card">
        <div class="vocab-info">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');

    const prepsEl = document.getElementById('preps-container');
    prepsEl.innerHTML = prepositions.map(item => `
      <span class="word-tag">
        <span><b>${item.word}</b> ${item.phonetic} — <i>${item.ukr}</i></span>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </span>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    const prepListOptions = prepositions.map(p => p.word);

    questions.forEach(q => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      const options = ['<option value="">-- Choose preposition --</option>']
        .concat(prepListOptions.map(w => `<option value="${w}">${w}</option>`))
        .join('');

      row.innerHTML = `
        <div class="prompt-text">
          <span>${q.question}</span>
        </div>
        <select id="select-${q.id}">
          ${options}
        </select>
      `;

      container.appendChild(row);
    });
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const selectEl = document.getElementById(`select-${q.id}`);
      const val = selectEl.value;

      selectEl.classList.remove('correct-select', 'wrong-select');

      if (val === q.correct) {
        score++;
        selectEl.classList.add('correct-select');
      } else {
        selectEl.classList.add('wrong-select');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderVocab();
    renderQuiz();
  };
</script>

</body>
</html>
