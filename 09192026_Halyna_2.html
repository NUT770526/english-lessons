<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business English Translation Practice 💼</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 1rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: #38bdf8;
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .quiz-row {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 18px 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .prompt-sentence {
    font-size: 1.05rem;
    font-weight: 600;
    color: #f1f5f9;
    line-height: 1.5;
  }

  .tense-badge {
    font-size: 0.8rem;
    font-weight: 700;
    color: #38bdf8;
    background: #1e293b;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    margin-left: 8px;
  }

  .input-wrapper {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: 1rem;
    color: #f8fafc;
    background-color: #1e293b;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    outline: none;
    transition: all 0.2s ease;
    width: 100%;
    box-sizing: border-box;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"].correct-input {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  input[type="text"].wrong-input {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .feedback {
    font-size: 0.9rem;
    font-weight: 600;
    display: none;
  }

  .feedback.show {
    display: block;
  }

  .feedback.correct-text {
    color: #4ade80;
  }

  .feedback.wrong-text {
    color: #fca5a5;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Business English Translation 💼</h2>
      <div class="subtitle">Перекладіть речення англійською мовою у вказаному часі.</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <!-- Vocabulary Section -->
  <div class="section-title">1. Key Business Vocabulary (Лексика та вимова)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <!-- Exercise Questions -->
  <div class="section-title">2. Translate the Sentences</div>
  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordBank = [
    { word: "answer emails", phonetic: "[ˈɑːn.sər ˈiː.meɪlz]", ukr: "відповідати на листи" },
    { word: "prepare a report", phonetic: "[prɪˈpeər ə rɪˈpɔːt]", ukr: "готувати звіт" },
    { word: "payment terms", phonetic: "[ˈpeɪ.mənt tɜːmz]", ukr: "умови оплати" },
    { word: "invoice", phonetic: "[ˈɪn.vɔɪs]", ukr: "рахунок / инвойс" },
    { word: "solve a problem", phonetic: "[sɒlv ə ˈprɒb.ləm]", ukr: "розв'язати проблему" },
    { word: "review a contract", phonetic: "[rɪˈvjuː ə ˈkɒn.trækt]", ukr: "переглянути контракт" }
  ];

  const questions = [
    {
      id: 1,
      num: "1.",
      ukr: "Я зазвичай відповідаю на електронні листи вранці.",
      tense: "Present Simple",
      displayCorrect: "I usually answer emails in the morning.",
      answers: [
        "i usually answer emails in the morning",
        "i usually answer e-mails in the morning",
        "i usually reply to emails in the morning",
        "i usually reply to e-mails in the morning"
      ]
    },
    {
      id: 2,
      num: "2.",
      ukr: "Наразі я готую звіт для менеджера.",
      tense: "Present Continuous",
      displayCorrect: "I am currently preparing a report for the manager.",
      answers: [
        "i am currently preparing a report for the manager",
        "i'm currently preparing a report for the manager",
        "currently i am preparing a report for the manager",
        "currently i'm preparing a report for the manager",
        "i am preparing a report for the manager currently",
        "i am preparing the report for the manager right now",
        "i am currently preparing the report for the manager"
      ]
    },
    {
      id: 3,
      num: "3.",
      ukr: "Учора ми переглянули цей контракт.",
      tense: "Past Simple",
      displayCorrect: "Yesterday we reviewed this contract.",
      answers: [
        "yesterday we reviewed this contract",
        "we reviewed this contract yesterday",
        "yesterday we looked at this contract",
        "we looked at this contract yesterday",
        "yesterday we checked this contract"
      ]
    },
    {
      id: 4,
      num: "4.",
      ukr: "Я вже надіслав(ла) рахунок клієнту.",
      tense: "Present Perfect",
      displayCorrect: "I have already sent the invoice to the client.",
      answers: [
        "i have already sent the invoice to the client",
        "i've already sent the invoice to the client",
        "i have already sent the invoice to the customer",
        "i've already sent the invoice to the customer",
        "i have already sent a bill to the client"
      ]
    },
    {
      id: 5,
      num: "5.",
      ukr: "Я хотів(ла) б обговорити умови оплати.",
      tense: "Modal / Phrase",
      displayCorrect: "I would like to discuss the payment terms.",
      answers: [
        "i would like to discuss the payment terms",
        "i'd like to discuss the payment terms",
        "i would like to discuss payment terms",
        "i'd like to discuss payment terms"
      ]
    },
    {
      id: 6,
      num: "6.",
      ukr: "Останнім часом ми отримали багато запитань від клієнтів.",
      tense: "Present Perfect",
      displayCorrect: "Recently we have received many questions from clients.",
      answers: [
        "recently we have received many questions from clients",
        "recently we have received a lot of questions from clients",
        "we have received many questions from clients recently",
        "we have received a lot of questions from clients recently",
        "we've received a lot of questions from clients recently",
        "we've received many questions from customers recently",
        "recently we have received many questions from customers"
      ]
    },
    {
      id: 7,
      num: "7.",
      ukr: "Учора я хотів(ла) пити, тому замовив(ла) воду.",
      tense: "Past Simple",
      displayCorrect: "Yesterday I was thirsty, so I ordered water.",
      answers: [
        "yesterday i was thirsty, so i ordered water",
        "yesterday i was thirsty so i ordered water",
        "i was thirsty yesterday, so i ordered water",
        "i was thirsty yesterday so i ordered water",
        "i was thirsty, so i ordered water yesterday"
      ]
    },
    {
      id: 8,
      num: "8.",
      ukr: "З чого ви хотіли б почати?",
      tense: "Question Phrase",
      displayCorrect: "What would you like to start with?",
      answers: [
        "what would you like to start with",
        "what would you like to begin with",
        "where would you like to start",
        "where would you like to begin"
      ]
    },
    {
      id: 9,
      num: "9.",
      ukr: "Вона зазвичай переглядає звіт перед зустріччю.",
      tense: "Present Simple",
      displayCorrect: "She usually reviews the report before the meeting.",
      answers: [
        "she usually reviews the report before the meeting",
        "she usually looks at the report before the meeting",
        "she usually checks the report before the meeting",
        "she usually reviews a report before a meeting"
      ]
    },
    {
      id: 10,
      num: "10.",
      ukr: "Я дуже хочу розв’язати цю проблему сьогодні.",
      tense: "Present Simple",
      displayCorrect: "I really want to solve this problem today.",
      answers: [
        "i really want to solve this problem today",
        "i really want to resolve this problem today",
        "i really want to solve this issue today",
        "i really want to resolve this issue today"
      ]
    }
  ];

  function cleanText(str) {
    return str.toLowerCase()
      .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = wordBank.map(item => `
      <div class="vocab-card">
        <div class="vocab-info">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach(q => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      row.innerHTML = `
        <div class="prompt-sentence">
          <b>${q.num}</b> ${q.ukr}
          <span class="tense-badge">${q.tense}</span>
        </div>
        <div class="input-wrapper">
          <input type="text" id="input-${q.id}" placeholder="Type English translation here..." autocomplete="off" />
          <div class="feedback" id="feedback-${q.id}"></div>
        </div>
      `;

      container.appendChild(row);
    });
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const inputEl = document.getElementById(`input-${q.id}`);
      const feedbackEl = document.getElementById(`feedback-${q.id}`);
      const userVal = cleanText(inputEl.value);

      inputEl.classList.remove('correct-input', 'wrong-input');
      feedbackEl.classList.remove('show', 'correct-text', 'wrong-text');

      const isCorrect = q.answers.some(ans => cleanText(ans) === userVal);

      if (userVal !== "" && isCorrect) {
        score++;
        inputEl.classList.add('correct-input');
        feedbackEl.innerText = "✓ Perfect translation!";
        feedbackEl.classList.add('show', 'correct-text');
      } else {
        inputEl.classList.add('wrong-input');
        feedbackEl.innerText = `💡 Key answer: "${q.displayCorrect}"`;
        feedbackEl.classList.add('show', 'wrong-text');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderVocab();
    renderQuiz();
  };
</script>

</body>
</html>
