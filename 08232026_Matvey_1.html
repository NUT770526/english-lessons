<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Matching Game</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f0f4f8; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    h1 { color: #333; margin-bottom: 5px; }
    p.subtitle { color: #666; margin-bottom: 20px; }
    
    /* Bank of terms */
    .word-bank {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      background: #ffffff; padding: 15px; border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; width: 100%; max-width: 900px;
    }
    .word-chip {
      background-color: #ffffff; border: 2px solid #3b82f6; color: #1d4ed8;
      padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: grab;
      user-select: none; transition: transform 0.2s, background-color 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .word-chip:hover { background-color: #eff6ff; transform: translateY(-2px); }
    .word-chip.dragging { opacity: 0.5; }
    .word-chip.used { opacity: 0.3; cursor: not-allowed; border-color: #9ca3af; color: #6b7280; }

    /* Definitions Grid */
    .board {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px; width: 100%; max-width: 1000px;
    }
    .card {
      background-color: #fef08a; border-radius: 8px; padding: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column;
      justify-content: space-between; min-height: 180px; position: relative;
    }
    .definition { font-size: 0.95rem; color: #1f2937; line-height: 1.4; margin-bottom: 15px; }
    
    /* Drop Zone */
    .drop-zone {
      border: 2px dashed #ca8a04; border-radius: 6px; padding: 10px; min-height: 45px;
      display: flex; align-items: center; justify-content: center; background-color: rgba(255,255,255,0.4);
      font-weight: bold; color: #854d0e; transition: background-color 0.2s;
    }
    .drop-zone.drag-over { background-color: #fef9c3; border-color: #854d0e; }
    .drop-zone.correct { background-color: #dcfce7; border: 2px solid #16a34a; color: #15803d; }
    .drop-zone.incorrect { background-color: #fee2e2; border: 2px solid #dc2626; color: #b91c1c; }

    /* Audio button */
    .audio-btn {
      position: absolute; top: 10px; right: 10px; background: none; border: none;
      cursor: pointer; font-size: 1.1rem; opacity: 0.6; transition: opacity 0.2s;
    }
    .audio-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <h1>Vocabulary Game</h1>
  <p class="subtitle">Кликните на слово, чтобы услышать его произношение, или перетащите к определению</p>

  <!-- Word Bank -->
  <div class="word-bank" id="wordBank"></div>

  <!-- Board -->
  <div class="board" id="board"></div>

  <script>
    const data = [
      { id: "1", word: "fluency", def: "the ability to speak or write a language easily, well, and quickly" },
      { id: "2", word: "jargon", def: "special words and phrases that are used by particular groups of people, especially in their work" },
      { id: "3", word: "accuracy", def: "the ability to do something without making mistakes" },
      { id: "4", word: "slang", def: "very informal language that is usually spoken rather than written, used especially by particular groups of people" },
      { id: "5", word: "bilingual", def: "able to use two languages equally well" },
      { id: "6", word: "foreign language", def: "is not the official or main language in the country and people study it as an additional" },
      { id: "7", word: "mother tongue", def: "the first language that you learn when you are a baby" }
    ];

    const wordBank = document.getElementById("wordBank");
    const board = document.getElementById("board");

    // Озвучка текста (Web Speech API)
    function speak(text) {
      window.speechSynthesis.cancel(); // Остановка предыдущей озвучки
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9; // Слегка замедленный темп для четкости
      window.speechSynthesis.speak(utterance);
    }

    // Инициализация
    function init() {
      const shuffledWords = [...data].sort(() => Math.random() - 0.5);
      
      shuffledWords.forEach(item => {
        const chip = document.createElement("div");
        chip.className = "word-chip";
        chip.draggable = true;
        chip.innerText = item.word;
        chip.id = `chip-${item.id}`;
        
        // Озвучка при клике на слово
        chip.addEventListener("click", () => {
          speak(item.word);
        });

        chip.addEventListener("dragstart", (e) => {
          e.dataTransfer.setData("text/plain", item.id);
          chip.classList.add("dragging");
        });

        chip.addEventListener("dragend", () => {
          chip.classList.remove("dragging");
        });

        wordBank.appendChild(chip);
      });

      const shuffledDefs = [...data].sort(() => Math.random() - 0.5);

      shuffledDefs.forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const audioBtn = document.createElement("button");
        audioBtn.className = "audio-btn";
        audioBtn.innerHTML = "🔊";
        audioBtn.title = "Прослушать определение";
        audioBtn.onclick = () => speak(item.def);
        card.appendChild(audioBtn);

        const defText = document.createElement("div");
        defText.className = "definition";
        defText.innerText = item.def;
        card.appendChild(defText);

        const dropZone = document.createElement("div");
        dropZone.className = "drop-zone";
        dropZone.innerText = "Перетащите сюда";

        dropZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropZone.classList.add("drag-over");
        });

        dropZone.addEventListener("dragleave", () => {
          dropZone.classList.remove("drag-over");
        });

        dropZone.addEventListener("drop", (e) => {
          e.preventDefault();
          dropZone.classList.remove("drag-over");
          
          const draggedId = e.dataTransfer.getData("text/plain");
          const draggedChip = document.getElementById(`chip-${draggedId}`);

          if (draggedId === item.id) {
            dropZone.innerText = item.word;
            dropZone.className = "drop-zone correct";
            draggedChip.classList.add("used");
            draggedChip.draggable = false;
            speak(item.word);
          } else {
            dropZone.innerText = "Неверно!";
            dropZone.classList.add("incorrect");
            setTimeout(() => {
              if (!dropZone.classList.contains("correct")) {
                dropZone.innerText = "Перетащите сюда";
                dropZone.classList.remove("incorrect");
              }
            }, 1000);
          }
        });

        card.appendChild(dropZone);
        board.appendChild(card);
      });
    }

    init();
  </script>
</body>
</html>
