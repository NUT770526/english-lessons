<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4. Виправ помилку в перекладі</title>
<style>
  :root {
    --bg-color: #f0f9ff;
    --card-bg: #ffffff;
    --text-color: #1e293b;
    --accent-color: #0284c7;
    --accent-hover: #0369a1;
    --border-color: #bae6fd;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px;
    border: 3px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.15);
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .title {
    font-size: 1.6rem;
    font-weight: 800;
    color: #0369a1;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 1rem;
    color: #0284c7;
    background: #e0f2fe;
    padding: 10px 18px;
    border-radius: 12px;
    display: inline-block;
  }

  /* List of Tasks */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 28px;
  }

  .task-card {
    background-color: #ffffff;
    border: 2px solid var(--border-color);
    border-radius: 18px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .sentence-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.15rem;
    font-weight: 800;
    color: #0369a1;
  }

  .sentence-num {
    color: var(--accent-color);
    font-size: 1.2rem;
    min-width: 24px;
  }

  .wrong-translation {
    font-size: 1rem;
    font-weight: 700;
    color: #ef4444;
    text-decoration: line-through;
    margin-left: 34px;
  }

  .translation-input {
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1e293b;
    background-color: #e0f2fe;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 8px 14px;
    outline: none;
    margin-left: 34px;
    width: calc(100% - 34px);
    transition: all 0.2s ease;
  }

  .translation-input:focus {
    border-color: var(--accent-color);
    background-color: #ffffff;
  }

  /* Speaker button */
  .speaker-btn {
    background: #e0f2fe;
    border: 2px solid var(--border-color);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
    margin-left: auto;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background-color: var(--accent-color);
    color: #ffffff;
    transform: scale(1.1);
  }

  /* Controls */
  .controls {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }

  .btn-reset {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 800;
    padding: 10px 24px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: #64748b;
    color: #ffffff;
    transition: all 0.2s ease;
  }

  .btn-reset:hover {
    background: #475569;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 class="title">4. Виправ помилку в перекладі</h2>
    <p class="subtitle">Англійські речення правильні, але в перекладі є помилка. Напиши правильний переклад!</p>
  </div>

  <div class="task-list" id="task-container"></div>

  <div class="controls">
    <button class="btn-reset" onclick="resetExercise()">Скинути 🔄</button>
  </div>
</div>

<script>
  const taskData = [
    { num: 1, en: "I carry my bag.", wrong: "Я описую свою сумку." },
    { num: 2, en: "I try every day.", wrong: "Я повторюю щодня." },
    { num: 3, en: "I revise new words.", wrong: "Я несу нові слова." },
    { num: 4, en: "I describe my room.", wrong: "Я прибираю свою кімнату." },
    { num: 5, en: "I have a shower every morning.", wrong: "Я приймаю ванну щоранку." },
    { num: 6, en: "I solve the riddles.", wrong: "Я пишу загадки." },
    { num: 7, en: "I run as fast as possible.", wrong: "Я бігаю дуже повільно." },
    { num: 8, en: "There is furniture in my room.", wrong: "У моїй кімнаті є квіти." }
  ];

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }
  }

  function renderExercise() {
    const container = document.getElementById('task-container');
    container.innerHTML = '';

    taskData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'task-card';

      card.innerHTML = `
        <div class="sentence-row">
          <span class="sentence-num">${item.num}.</span>
          <span>${item.en}</span>
          <button class="speaker-btn" title="Слухати речення" onclick="speakText('${item.en.replace(/'/g, "\\'")}')">🔊</button>
        </div>
        <div class="wrong-translation">${item.wrong}</div>
        <input type="text" class="translation-input" id="input-${index}" placeholder="Введи правильний переклад...">
      `;

      container.appendChild(card);
    });
  }

  function resetExercise() {
    taskData.forEach((_, index) => {
      const input = document.getElementById(`input-${index}`);
      if (input) input.value = '';
    });
  }

  renderExercise();
</script>

</body>
</html>
