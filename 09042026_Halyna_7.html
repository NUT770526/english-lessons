<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business English - Matching Exercise</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 30px 15px; display: flex; justify-content: center; margin: 0; }
    .container { max-width: 900px; width: 100%; background: #1e293b; padding: 30px; border-radius: 16px; border: 1px solid #334155; }
    h2 { color: #38bdf8; margin-top: 0; }
    .instruction { background: #0f172a; border-left: 4px solid #38bdf8; padding: 12px; border-radius: 6px; margin-bottom: 25px; color: #cbd5e1; }
    
    .matching-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    .matching-table th { text-align: left; padding: 12px; border-bottom: 2px solid #334155; color: #38bdf8; }
    .matching-table td { padding: 10px 12px; border-bottom: 1px solid #334155; vertical-align: middle; }
    
    .num { color: #38bdf8; font-weight: bold; width: 30px; }
    .english-term { font-weight: 600; font-size: 1.05rem; }
    
    select { 
      background-color: #0f172a; 
      color: #f8fafc; 
      border: 1px solid #475569; 
      padding: 8px 12px; 
      border-radius: 6px; 
      font-size: 0.95rem; 
      outline: none; 
      width: 100%;
      cursor: pointer;
    }
    select.correct { border-color: #22c55e; background-color: #064e3b; color: #4ade80; }
    select.incorrect { border-color: #ef4444; background-color: #7f1d1d; color: #f87171; }

    .audio-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; opacity: 0.8; transition: opacity 0.2s; }
    .audio-btn:hover { opacity: 1; }

    .controls { margin-top: 25px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #334155; padding-top: 20px; }
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 1rem; }
    .btn-check { background: #0284c7; color: white; margin-right: 10px; }
    .btn-reset { background: #475569; color: white; }
    .score { font-size: 1.1rem; color: #38bdf8; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Вправа 1. З'єднайте вираз із перекладом</h2>
  <div class="instruction">
    Оберіть правильний український переклад для кожного англійського виразу з випадаючого списку.
  </div>

  <table class="matching-table">
    <thead>
      <tr>
        <th style="width: 5%;">№</th>
        <th style="width: 35%;">Англійський вираз</th>
        <th style="width: 5%;"></th>
        <th style="width: 55%;">Український переклад</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <div class="controls">
    <div>
      <button class="btn btn-check" onclick="checkAnswers()">Перевірити</button>
      <button class="btn btn-reset" onclick="resetExercise()">Скинути</button>
    </div>
    <div class="score" id="scoreDisplay"></div>
  </div>
</div>

<script>
  const pairs = [
    { id: 1, en: "in front of", ua: "перед" },
    { id: 2, en: "at the side of", ua: "збоку від" },
    { id: 3, en: "on all sides of", ua: "з усіх боків" },
    { id: 4, en: "round the building", ua: "навколо будівлі" },
    { id: 5, en: "two blocks away", ua: "за два квартали звідси" },
    { id: 6, en: "in this direction", ua: "у цьому напрямку" },
    { id: 7, en: "on the right-hand side", ua: "з правого боку; праворуч" },
    { id: 8, en: "at/on the corner", ua: "на розі двох вулиць" },
    { id: 9, en: "in the corner", ua: "у кутку приміщення" },
    { id: 10, en: "round the corner", ua: "за рогом; зовсім поруч" },
    { id: 11, en: "turn the corner", ua: "повернути за ріг" },
    { id: 12, en: "in the left-hand corner", ua: "у лівому куті" },
    { id: 13, en: "in the top right-hand corner", ua: "у правому верхньому куті" }
  ];

  // Перемешивание вариантов перевода для dropdown
  const allTranslations = pairs.map(p => p.ua).sort(() => Math.random() - 0.5);

  function speak(text) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    window.speechSynthesis.speak(u);
  }

  function renderTable() {
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    pairs.forEach((item) => {
      const tr = document.createElement("tr");
      
      let optionsHTML = `<option value="">-- Оберіть переклад --</option>`;
      allTranslations.forEach(trans => {
        optionsHTML += `<option value="${trans}">${trans}</option>`;
      });

      tr.innerHTML = `
        <td class="num">${item.id}</td>
        <td class="english-term">${item.en}</td>
        <td><button class="audio-btn" onclick="speak('${item.en.replace(/'/g, "\\'")}')" title="Прослухати">🔊</button></td>
        <td>
          <select id="select-${item.id}">
            ${optionsHTML}
          </select>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function checkAnswers() {
    let score = 0;
    pairs.forEach(item => {
      const select = document.getElementById(`select-${item.id}`);
      if (select.value === item.ua) {
        select.className = "correct";
        score++;
      } else {
        select.className = "incorrect";
      }
    });
    document.getElementById("scoreDisplay").innerText = `Результат: ${score} / ${pairs.length}`;
  }

  function resetExercise() {
    renderTable();
    document.getElementById("scoreDisplay").innerText = "";
  }

  renderTable();
</script>
</body>
</html>
