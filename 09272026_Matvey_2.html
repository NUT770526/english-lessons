<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Put the verb into the correct form</title>
<style>
  :root {
    --bg-color: #0f172a;
    --panel-bg: #1e293b;
    --card-bg: #0f172a;
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.2);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
    --input-bg: #0f172a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 800px;
    width: 100%;
    background: var(--panel-bg);
    border-radius: 24px;
    padding: 36px;
    border: 1px solid var(--border-color);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
  }

  .title {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .title-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(56, 189, 248, 0.1);
    color: var(--accent);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 1rem;
  }

  /* Exercise Sentences List */
  .questions-list {
    display: flex;
    flex-direction: flex-column;
    flex-direction: column;
    gap: 16px;
  }

  .question-item {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 18px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    color: #f1f5f9;
    flex-wrap: wrap;
  }

  .q-num {
    font-weight: 700;
    color: var(--accent);
    min-width: 24px;
  }

  .blank-input {
    background: var(--input-bg);
    border: 1.5px solid var(--border-color);
    border-radius: 10px;
    padding: 10px 16px;
    color: var(--accent);
    font-size: 1.05rem;
    font-weight: 600;
    font-family: inherit;
    outline: none;
    min-width: 160px;
    text-align: center;
    transition: all 0.2s ease;
  }

  .blank-input::placeholder {
    color: var(--text-secondary);
    font-weight: 400;
    opacity: 0.7;
  }

  .blank-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
    background: #141f33;
  }

  /* Controls Section */
  .controls {
    margin-top: 32px;
    display: flex;
    justify-content: center;
  }

  .btn-reset {
    background: #334155;
    color: #ffffff;
    font-size: 0.95rem;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-reset:hover {
    background: #475569;
    border-color: #64748b;
  }

  .btn-reset:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">
    <span class="title-icon">▶</span>
    <span>Put the verb into the correct form</span>
  </div>

  <div class="questions-list">

    <!-- 1 -->
    <div class="question-item">
      <span class="q-num">1.</span>
      <span>Julie</span>
      <input type="text" class="blank-input" placeholder="not drink" autocomplete="off" spellcheck="false">
      <span>tea very often.</span>
    </div>

    <!-- 2 -->
    <div class="question-item">
      <span class="q-num">2.</span>
      <span>What time</span>
      <input type="text" class="blank-input" placeholder="the banks close" autocomplete="off" spellcheck="false">
      <span>here?</span>
    </div>

    <!-- 3 -->
    <div class="question-item">
      <span class="q-num">3.</span>
      <span>I've got a car, but I</span>
      <input type="text" class="blank-input" placeholder="not use" autocomplete="off" spellcheck="false">
      <span>it much.</span>
    </div>

    <!-- 4 -->
    <div class="question-item">
      <span class="q-num">4.</span>
      <span>Where</span>
      <input type="text" class="blank-input" placeholder="Ricardo come" autocomplete="off" spellcheck="false">
      <span>from?</span>
    </div>

    <!-- 5 -->
    <div class="question-item">
      <span class="q-num">5.</span>
      <span>What</span>
      <input type="text" class="blank-input" placeholder="you do" autocomplete="off" spellcheck="false">
      <span>?</span>
    </div>

    <!-- 6 -->
    <div class="question-item">
      <span class="q-num">6.</span>
      <span>It</span>
      <input type="text" class="blank-input" placeholder="take" autocomplete="off" spellcheck="false">
      <span>me an hour to get to work. How long</span>
      <input type="text" class="blank-input" placeholder="it take" autocomplete="off" spellcheck="false">
      <span>you?</span>
    </div>

    <!-- 7 -->
    <div class="question-item">
      <span class="q-num">7.</span>
      <span>Look at this sentence. What</span>
      <input type="text" class="blank-input" placeholder="this word mean" autocomplete="off" spellcheck="false">
      <span>?</span>
    </div>

    <!-- 8 -->
    <div class="question-item">
      <span class="q-num">8.</span>
      <span>David isn't very fit. He</span>
      <input type="text" class="blank-input" placeholder="not do" autocomplete="off" spellcheck="false">
      <span>any sport.</span>
    </div>

  </div>

  <div class="controls">
    <button class="btn-reset" type="button" onclick="clearFields()">Clear All / Очистить 🔄</button>
  </div>
</div>

<script>
  // Function to clear all input fields for student re-attempts
  function clearFields() {
    document.querySelectorAll('.blank-input').forEach(input => {
      input.value = '';
    });
  }
</script>

</body>
</html>
