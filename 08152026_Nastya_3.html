<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3. Choose the correct form</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 6px;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        /* SENTENCES LIST */
        .sentences-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sentence-card {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .sentence-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-card.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .sentence-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            flex-wrap: wrap;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .num-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 0.95rem;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .sentence-text {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            color: var(--text-main);
        }

        /* CHOICE BUTTONS */
        .option-group {
            display: inline-flex;
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 3px;
            gap: 4px;
            margin: 0 4px;
        }

        .option-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 7px;
            font-size: 0.98rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .option-btn.selected {
            background: var(--accent-purple);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(129, 140, 248, 0.4);
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
            transform: scale(1.1);
        }

        /* CONTROLS */
        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span>☑️</span> 3. Choose the correct form
    </div>
    <div class="header-subtitle">
        Обери правильний варіант дієслова для кожного речення.
    </div>

    <!-- SENTENCES LIST -->
    <div class="sentences-list" id="sentencesList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Score: - / 15</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        </div>
    </div>
</div>

<script>
    const sentencesData = [
        { id: 1, prefix: "My best friend", opt1: "believe", opt2: "believes", suffix: "in people.", answer: "believes" },
        { id: 2, prefix: "Anna", opt1: "work", opt2: "works", suffix: "well in a team.", answer: "works" },
        { id: 3, prefix: "I", opt1: "am", opt2: "is", suffix: "a good listener.", answer: "am" },
        { id: 4, prefix: "Our teacher", opt1: "is", opt2: "are", suffix: "very encouraging.", answer: "is" },
        { id: 5, prefix: "My friends", opt1: "like", opt2: "likes", suffix: "helping other people.", answer: "like" },
        { id: 6, prefix: "Mark", opt1: "have", opt2: "has", suffix: "good communication skills.", answer: "has" },
        { id: 7, prefix: "We", opt1: "are", opt2: "is", suffix: "organised and hard-working.", answer: "are" },
        { id: 8, prefix: "She", opt1: "have", opt2: "has", suffix: "a passion for dancing.", answer: "has" },
        { id: 9, prefix: "They", opt1: "are", opt2: "is", suffix: "cheerful and friendly today.", answer: "are" },
        { id: 10, prefix: "This English lesson", opt1: "is", opt2: "are", suffix: "very useful for us.", answer: "is" },
        { id: 11, prefix: "Good communication skills", opt1: "is", opt2: "are", suffix: "important for teamwork.", answer: "are" },
        { id: 12, prefix: "Hard work", opt1: "lead", opt2: "leads", suffix: "to great success.", answer: "leads" },
        { id: 13, prefix: "A good employee", opt1: "respect", opt2: "respects", suffix: "other colleagues.", answer: "respects" },
        { id: 14, prefix: "My sister", opt1: "is", opt2: "are", suffix: "a role model for me.", answer: "is" },
        { id: 15, prefix: "He always", opt1: "try", opt2: "tries", suffix: "to be hard-working.", answer: "tries" }
    ];

    const userChoices = {};

    function renderSentences() {
        const list = document.getElementById('sentencesList');
        list.innerHTML = '';

        sentencesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.id = `card-${item.id}`;

            card.innerHTML = `
                <div class="sentence-content">
                    <span class="num-badge">${item.id}</span>
                    <div class="sentence-text">
                        <span>${item.prefix}</span>
                        <div class="option-group">
                            <button class="option-btn" id="opt-${item.id}-1" onclick="selectOption(${item.id}, '${item.opt1}', 1)">${item.opt1}</button>
                            <button class="option-btn" id="opt-${item.id}-2" onclick="selectOption(${item.id}, '${item.opt2}', 2)">${item.opt2}</button>
                        </div>
                        <span>${item.suffix}</span>
                    </div>
                </div>
                <button class="audio-btn" onclick="playAudio(${item.id})" title="Listen">🔊</button>
            `;
            list.appendChild(card);
        });
    }

    function selectOption(id, val, optNum) {
        userChoices[id] = val;

        const btn1 = document.getElementById(`opt-${id}-1`);
        const btn2 = document.getElementById(`opt-${id}-2`);

        if (optNum === 1) {
            btn1.classList.add('selected');
            btn2.classList.remove('selected');
        } else {
            btn2.classList.add('selected');
            btn1.classList.remove('selected');
        }
    }

    function checkAnswers() {
        let correctCount = 0;

        sentencesData.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const chosenVal = userChoices[item.id];

            card.classList.remove('correct', 'incorrect');

            if (chosenVal === item.answer) {
                card.classList.add('correct');
                correctCount++;
            } else {
                card.classList.add('incorrect');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: ${correctCount} / ${sentencesData.length}`;
        if (correctCount === sentencesData.length) {
            scoreDisplay.style.color = 'var(--accent-green)';
        } else {
            scoreDisplay.style.color = 'var(--accent-blue)';
        }
    }

    function playAudio(id) {
        const item = sentencesData.find(s => s.id === id);
        const chosenVal = userChoices[id] || `${item.opt1}/${item.opt2}`;
        const fullText = `${item.prefix} ${chosenVal} ${item.suffix}`;

        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Ваш браузер не поддерживает озвучку.");
        }
    }

    function resetExercise() {
        sentencesData.forEach(item => {
            delete userChoices[item.id];
            const card = document.getElementById(`card-${item.id}`);
            const btn1 = document.getElementById(`opt-${item.id}-1`);
            const btn2 = document.getElementById(`opt-${item.id}-2`);

            if (card) card.classList.remove('correct', 'incorrect');
            if (btn1) btn1.classList.remove('selected');
            if (btn2) btn2.classList.remove('selected');
        });

        document.getElementById('scoreDisplay').textContent = `Score: - / ${sentencesData.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = () => {
        renderSentences();
    };
</script>

</body>
</html>
