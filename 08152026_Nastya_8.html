<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Complete with have got or has got</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .sentences-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .sentence-card {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05rem;
            line-height: 1.6;
            transition: all 0.2s ease;
            flex-wrap: wrap;
        }

        .sentence-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-card.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .num-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 0.95rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .select-box {
            background: #1e293b;
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .select-box:focus {
            border-color: var(--accent-blue);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">2. Complete with have got or has got</div>
    <div class="header-subtitle">Доповни речення відповідною формою (have got / has got).</div>

    <div class="sentences-list" id="exerciseList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Score: - / 10</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        </div>
    </div>
</div>

<script>
    const optionsList = ["have got", "has got"];

    const data = [
        { id: 1, pre: "My best friend", post: "a cheerful personality.", answer: "has got" },
        { id: 2, pre: "A good employee", post: "useful communication skills.", answer: "has got" },
        { id: 3, pre: "We", post: "a passion for helping other people.", answer: "have got" },
        { id: 4, pre: "Our teacher", post: "a lot of useful ideas.", answer: "has got" },
        { id: 5, pre: "They", post: "the skills they need for success.", answer: "have got" },
        { id: 6, pre: "My older sister", post: "all the qualities of a good role model.", answer: "has got" },
        { id: 7, pre: "You", post: "a great talent for working well in a team.", answer: "have got" },
        { id: 8, pre: "Good managers", post: "respect for their employees.", answer: "have got" },
        { id: 9, pre: "A good listener", post: "patience and time for people.", answer: "has got" },
        { id: 10, pre: "She", post: "a passion for learning new skills.", answer: "has got" }
    ];

    function renderExercise() {
        const list = document.getElementById('exerciseList');
        list.innerHTML = '';

        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.id = `card-${item.id}`;

            card.innerHTML = `
                <span class="num-badge">${item.id}</span>
                <span>${item.pre}</span>
                <select class="select-box" id="select-${item.id}">
                    <option value="">-- select --</option>
                    ${optionsList.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>
                <span>${item.post}</span>
            `;
            list.appendChild(card);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        data.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);

            card.classList.remove('correct', 'incorrect');

            if (select.value === item.answer) {
                card.classList.add('correct');
                correctCount++;
            } else {
                card.classList.add('incorrect');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: ${correctCount} / ${data.length}`;
        scoreDisplay.style.color = correctCount === data.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        data.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);

            card.classList.remove('correct', 'incorrect');
            select.value = '';
        });

        document.getElementById('scoreDisplay').textContent = `Score: - / ${data.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = renderExercise;
</script>

</body>
</html>
