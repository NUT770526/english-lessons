<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. Склади речення зі слів</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: #f8fafc;
    color: #0f172a;
  }

  .word-chip {
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
  }

  .word-chip:hover {
    transform: translateY(-2px);
  }

  .word-chip:active {
    transform: translateY(0);
  }

  /* Tooltip logic */
  .tooltip-wrapper {
    position: relative;
    display: inline-block;
  }

  .tooltip-box {
    visibility: hidden;
    opacity: 0;
    width: max-content;
    max-width: 240px;
    background-color: #0f172a;
    color: #ffffff;
    text-align: center;
    border-radius: 12px;
    padding: 6px 12px;
    position: absolute;
    z-index: 50;
    bottom: 125%;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
    pointer-events: none;
  }

  .tooltip-box::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -6px;
    border-width: 6px;
    border-style: solid;
    border-color: #0f172a transparent transparent transparent;
  }

  .tooltip-wrapper:hover .tooltip-box {
    visibility: visible;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body class="min-h-screen py-8 px-4 flex justify-center items-center">

<div class="max-w-4xl w-full bg-white rounded-3xl p-6 sm:p-10 shadow-xl border border-slate-200">
  
  <!-- Header -->
  <div class="flex items-center justify-between flex-wrap gap-4 mb-6">
    <div class="flex items-center gap-4">
      <div class="w-14 h-14 rounded-2xl bg-violet-100 text-violet-600 flex items-center justify-center text-3xl font-extrabold shadow-sm">
        🧩
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-800 tracking-tight">
          3. Склади речення зі слів
        </h1>
        <p class="text-slate-500 font-semibold text-sm sm:text-base mt-0.5">
          Тема: <span class="text-violet-600">Verb Patterns (Infinitive & Gerund)</span>
        </p>
      </div>
    </div>
    
    <!-- Score Badge -->
    <div class="bg-violet-50 border border-violet-200 px-4 py-2 rounded-2xl flex items-center gap-2">
      <span class="text-slate-500 font-bold text-xs uppercase tracking-wider">Прогрес:</span>
      <span id="score-counter" class="text-violet-700 font-extrabold text-lg">0 / 10</span>
    </div>
  </div>

  <!-- Instruction Banner -->
  <div class="bg-indigo-50/80 border-l-4 border-indigo-500 p-4 rounded-xl mb-8 flex items-start gap-3 shadow-xs">
    <span class="text-2xl leading-none">💡</span>
    <div>
      <p class="text-indigo-950 font-bold text-sm sm:text-base">
        Використай усі слова. Починай із великої літери.
      </p>
      <p class="text-indigo-700 text-xs sm:text-sm mt-0.5">
        Натискай на слова, щоб скласти речення. Натисни повторно, щоб прибрати слово. Наводь для транскрипції!
      </p>
    </div>
  </div>

  <!-- Sentences List -->
  <div id="sentences-container" class="space-y-6 mb-8">
    <!-- Dynamic items generated by JavaScript -->
  </div>

  <!-- Global Actions -->
  <div class="flex flex-wrap gap-3 justify-center items-center pt-4 border-t border-slate-100">
    <button onclick="checkAnswers()" class="px-7 py-3.5 bg-violet-600 hover:bg-violet-700 active:scale-95 text-white font-bold rounded-2xl shadow-lg shadow-violet-200 transition-all flex items-center gap-2">
      <span>Check</span>
      <span class="text-lg">🎯</span>
    </button>
    <button onclick="resetAll()" class="px-6 py-3.5 bg-slate-600 hover:bg-slate-700 active:scale-95 text-white font-bold rounded-2xl shadow-md transition-all flex items-center gap-2">
      <span>Reset</span>
      <span class="text-lg">🔄</span>
    </button>
    <button onclick="toggleAnswers()" class="px-6 py-3.5 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold rounded-2xl shadow-md transition-all flex items-center gap-2">
      <span id="answers-toggle-text">Show Answers</span>
      <span class="text-lg">💡</span>
    </button>
  </div>

  <!-- Feedback Card -->
  <div id="feedback-banner" class="hidden mt-6 p-4 rounded-2xl text-center font-bold text-base sm:text-lg transition-all duration-300">
  </div>

</div>

<script>
  // 10 Sentences Data
  const exerciseData = [
    {
      id: 1,
      scrambled: ["love", "I’d", "try", "to", "snowboarding"],
      target: ["I’d", "love", "to", "try", "snowboarding"],
      translation: "Я дуже хотів би спробувати сноубординг",
      ipa: "/aɪd lʌv tuː traɪ ˈsnəʊ.bɔː.dɪŋ/"
    },
    {
      id: 2,
      scrambled: ["playing", "enjoys", "tennis", "Anna"],
      target: ["Anna", "enjoys", "playing", "tennis"],
      translation: "Анна отримує задоволення від гри в теніс",
      ipa: "/ˈæn.ə ɪnˈdʒɔɪz ˈpleɪ.ɪŋ ˈten.ɪs/"
    },
    {
      id: 3,
      scrambled: ["about", "thinking", "cycling", "is", "Tom"],
      target: ["Tom", "is", "thinking", "about", "cycling"],
      translation: "Том розмірковує про катання на велосипеді",
      ipa: "/tɒm ɪz ˈθɪŋk.ɪŋ əˈbaʊt ˈsaɪ.klɪŋ/"
    },
    {
      id: 4,
      scrambled: ["me", "Dad", "swim", "lets"],
      target: ["Dad", "lets", "me", "swim"],
      translation: "Тато дозволяє мені плавати",
      ipa: "/dæd lets miː swɪm/"
    },
    {
      id: 5,
      scrambled: ["not", "prefer", "I’d", "to", "go"],
      target: ["I’d", "prefer", "not", "to", "go"],
      translation: "Я волів би не йти",
      ipa: "/aɪd prɪˈfɜː nɒt tuː ɡəʊ/"
    },
    {
      id: 6,
      scrambled: ["quite", "I", "like", "climbing", "rock"],
      target: ["I", "quite", "like", "rock", "climbing"],
      translation: "Мені доволі подобається скелелазіння",
      ipa: "/aɪ kwaɪt laɪk rɒk ˈklaɪ.mɪŋ/"
    },
    {
      id: 7,
      scrambled: ["stand", "losing", "I", "can’t"],
      target: ["I", "can’t", "stand", "losing"],
      translation: "Я терпіти не можу програвати",
      ipa: "/aɪ kɑːnt stænd ˈluː.zɪŋ/"
    },
    {
      id: 8,
      scrambled: ["to", "decided", "watch", "We", "match", "the"],
      target: ["We", "decided", "to", "watch", "the", "match"],
      translation: "Ми вирішили подивитися матч",
      ipa: "/wiː dɪˈsaɪ.dɪd tuː wɒtʃ ðə mætʃ/"
    },
    {
      id: 9,
      scrambled: ["considering", "join", "is", "Ben", "a", "club"],
      target: ["Ben", "is", "considering", "joining", "a", "club"],
      // Fixing 'join' chip dynamically in exercise mapping to 'joining'
      scrambledOverride: ["considering", "joining", "is", "Ben", "a", "club"],
      target: ["Ben", "is", "considering", "joining", "a", "club"],
      translation: "Бен розмірковує про те, щоб вступити до клубу",
      ipa: "/ben ɪz kənˈsɪd.ər.ɪŋ ˈdʒɔɪ.nɪŋ ə klʌb/"
    },
    {
      id: 10,
      scrambled: ["to", "like", "would", "I", "learn", "chess"],
      target: ["I", "would", "like", "to", "learn", "chess"],
      translation: "Я хотів би навчитися грати в шахи",
      ipa: "/aɪ wʊd laɪk tuː lɜːn tʃes/"
    }
  ];

  // User state: sentenceId -> array of selected word indices from scrambled list
  let userSelections = {};
  let showingAnswers = false;

  function renderExercise() {
    const container = document.getElementById("sentences-container");
    container.innerHTML = "";

    exerciseData.forEach((item, index) => {
      const words = item.scrambledOverride || item.scrambled;
      if (!userSelections[item.id]) {
        userSelections[item.id] = [];
      }

      const card = document.createElement("div");
      card.className = "p-5 sm:p-6 bg-slate-50 border-2 border-slate-200 rounded-2xl transition-all duration-300";
      card.id = `sentence-card-${item.id}`;

      // Sentence header line
      const selectedIndices = userSelections[item.id];
      const builtWords = selectedIndices.map(i => words[i]);

      card.innerHTML = `
        <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
          <div class="flex items-center gap-2">
            <span class="bg-violet-200 text-violet-800 font-extrabold text-xs sm:text-sm px-2.5 py-1 rounded-lg">
              ${index + 1}
            </span>
            <div class="tooltip-wrapper">
              <button onclick="speakText('${item.target.join(' ')}')" class="text-slate-400 hover:text-violet-600 transition-colors p-1" title="Прослухати вимову">
                🔊
              </button>
              <div class="tooltip-box">
                <span class="text-violet-300 font-mono text-xs">${item.ipa}</span><br>
                <span class="text-xs font-medium">${item.translation}</span>
              </div>
            </div>
          </div>
          <span class="text-xs text-slate-400 italic" id="hint-${item.id}"></span>
        </div>

        <!-- Target Construction Area -->
        <div 
          id="target-area-${item.id}"
          class="min-h-[56px] p-2 sm:p-3 bg-white border-2 border-dashed border-slate-300 rounded-xl flex flex-wrap gap-2 items-center mb-4 transition-all"
        >
          ${builtWords.length === 0 ? `<span class="text-slate-400 text-sm font-medium italic select-none">Натискай на слова нижче, щоб скласти речення...</span>` : ''}
          ${selectedIndices.map((wordIndex) => `
            <button 
              onclick="deselectWord(${item.id}, ${wordIndex})"
              class="word-chip bg-violet-600 hover:bg-violet-700 text-white font-bold px-3.5 py-1.5 rounded-xl shadow-sm text-sm sm:text-base flex items-center gap-1.5"
            >
              <span>${words[wordIndex]}</span>
              <span class="text-violet-200 text-xs">✕</span>
            </button>
          `).join('')}
        </div>

        <!-- Scrambled Words Pool -->
        <div class="flex flex-wrap gap-2 items-center">
          ${words.map((word, wIdx) => {
            const isSelected = selectedIndices.includes(wIdx);
            return `
              <button 
                onclick="selectWord(${item.id}, ${wIdx})"
                ${isSelected ? 'disabled' : ''}
                class="word-chip px-3.5 py-1.5 rounded-xl font-bold text-sm sm:text-base border-2 transition-all ${
                  isSelected 
                    ? 'bg-slate-200 border-slate-200 text-slate-400 cursor-not-allowed opacity-50' 
                    : 'bg-white border-slate-300 hover:border-violet-400 text-slate-700 hover:text-violet-600 shadow-xs'
                }"
              >
                ${word}
              </button>
            `;
          }).join('')}
        </div>

        <!-- Correct Answer Display (hidden by default) -->
        <div id="answer-key-${item.id}" class="hidden mt-3 pt-3 border-t border-slate-200 text-sm font-semibold text-emerald-700 flex items-center gap-2">
          <span>💡 Правильно:</span>
          <span class="font-bold text-slate-800">${item.target.join(' ')}</span>
        </div>
      `;

      container.appendChild(card);
    });

    updateProgress();
  }

  function selectWord(sentenceId, wordIndex) {
    if (!userSelections[sentenceId].includes(wordIndex)) {
      userSelections[sentenceId].push(wordIndex);
      const item = exerciseData.find(s => s.id === sentenceId);
      const words = item.scrambledOverride || item.scrambled;
      speakText(words[wordIndex]);
      renderExercise();
    }
  }

  function deselectWord(sentenceId, wordIndex) {
    userSelections[sentenceId] = userSelections[sentenceId].filter(idx => idx !== wordIndex);
    renderExercise();
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function updateProgress() {
    let completedCount = 0;
    exerciseData.forEach(item => {
      const words = item.scrambledOverride || item.scrambled;
      if (userSelections[item.id].length === words.length) {
        completedCount++;
      }
    });
    document.getElementById('score-counter').textContent = `${completedCount} / 10`;
  }

  function checkAnswers() {
    let correctCount = 0;
    const total = exerciseData.length;

    exerciseData.forEach(item => {
      const words = item.scrambledOverride || item.scrambled;
      const selectedIndices = userSelections[item.id];
      const userSentence = selectedIndices.map(i => words[i]).join(' ');
      const targetSentence = item.target.join(' ');

      const card = document.getElementById(`sentence-card-${item.id}`);
      const targetArea = document.getElementById(`target-area-${item.id}`);

      card.classList.remove('border-slate-200', 'border-emerald-300', 'border-red-300', 'bg-emerald-50/30', 'bg-red-50/30');

      if (userSentence === targetSentence) {
        correctCount++;
        card.classList.add('border-emerald-300', 'bg-emerald-50/30');
        targetArea.classList.remove('border-slate-300', 'border-red-300');
        targetArea.classList.add('border-emerald-400');
      } else {
        card.classList.add('border-red-300', 'bg-red-50/30');
        targetArea.classList.remove('border-slate-300', 'border-emerald-400');
        targetArea.classList.add('border-red-300');
      }
    });

    const banner = document.getElementById('feedback-banner');
    banner.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-900', 'border-emerald-300', 'bg-red-100', 'text-red-900', 'border-red-300', 'bg-amber-100', 'text-amber-900', 'border-amber-300');

    if (correctCount === total) {
      banner.className = "mt-6 p-4 rounded-2xl text-center font-bold text-base sm:text-lg bg-emerald-100 text-emerald-900 border-2 border-emerald-300";
      banner.textContent = `Чудово! 🎉 Усі ${correctCount}/${total} речень складено абсолютно правильно!`;
    } else {
      banner.className = "mt-6 p-4 rounded-2xl text-center font-bold text-base sm:text-lg bg-red-100 text-red-900 border-2 border-red-300";
      banner.textContent = `Твій результат: ${correctCount} з ${total} правильних речень. Перевірте виділені червоним пункти! ❌`;
    }
  }

  function resetAll() {
    userSelections = {};
    showingAnswers = false;
    document.getElementById('answers-toggle-text').textContent = 'Show Answers';
    document.getElementById('feedback-banner').classList.add('hidden');
    renderExercise();
  }

  function toggleAnswers() {
    showingAnswers = !showingAnswers;
    document.getElementById('answers-toggle-text').textContent = showingAnswers ? 'Hide Answers' : 'Show Answers';

    exerciseData.forEach(item => {
      const answerKey = document.getElementById(`answer-key-${item.id}`);
      if (answerKey) {
        if (showingAnswers) {
          answerKey.classList.remove('hidden');
        } else {
          answerKey.classList.add('hidden');
        }
      }
    });
  }

  // Initialize on load
  window.onload = renderExercise;
</script>

</body>
</html>
