<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Past Participle Practice</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; padding: 30px 15px; display: flex; justify-content: center; margin: 0; }
    .container { max-width: 750px; width: 100%; background: #ffffff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px solid #e2e8f0; }
    
    .section-title { font-size: 1.25rem; font-weight: bold; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    
    /* Table Styling */
    table { width: 100%; border-collapse: collapse; margin-bottom: 25px; border-radius: 8px; overflow: hidden; }
    th, td { border: 1.5 solid #0d9488; text-align: center; padding: 10px 12px; font-size: 1.05rem; }
    
    th { background-color: #a7f3d0; color: #d97706; font-size: 1.15rem; font-weight: bold; width: 33.33%; border: 1.5px solid #10b981; }
    td { background-color: #fef3c7; border: 1.5px solid #10b981; color: #1e293b; font-weight: 500; }
    
    /* Input Field Styling */
    input[type="text"] {
      width: 90%;
      max-width: 180px;
      padding: 6px 10px;
      border: 1.5px solid #94a3b8;
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
      outline: none;
      background-color: #ffffff;
      transition: all 0.2s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      background-color: #ffffff;
    }

    .btn-audio {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      margin-left: 5px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .btn-audio:hover { opacity: 1; }

    .controls { display: flex; justify-content: flex-end; margin-top: 15px; }
    .btn-reset { padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; font-size: 0.95rem; background: #94a3b8; color: white; transition: background 0.2s; }
    .btn-reset:hover { background: #64748b; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- Example Section -->
  <div class="section-title">📺 Study this example!</div>
  <table>
    <thead>
      <tr>
        <th>Infinitive</th>
        <th>Past Simple</th>
        <th>Past Participle</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>be <button class="btn-audio" onclick="speak('be, was, were, been')">🔊</button></td>
        <td>was<br>were</td>
        <td>been</td>
      </tr>
    </tbody>
  </table>

  <!-- Practice Section -->
  <div class="section-title">📺 Refresh your knowledge and complete the table</div>
  <table>
    <thead>
      <tr>
        <th>Infinitive</th>
        <th>Past Simple</th>
        <th>Past Participle</th>
      </tr>
    </thead>
    <tbody id="table-body">
      <!-- Generated via JS -->
    </tbody>
  </table>

  <div class="controls">
    <button class="btn-reset" onclick="resetExercise()">Reset Answers 🔄</button>
  </div>

</div>

<script>
  const verbs = [
    { inf: "do", past: "did", target: "done" },
    { inf: "come", past: "came", target: "come" },
    { inf: "eat", past: "ate", target: "eaten" },
    { inf: "make", past: "made", target: "made" },
    { inf: "see", past: "saw", target: "seen" },
    { inf: "take", past: "took", target: "taken" },
    { inf: "write", past: "wrote", target: "written" },
    { inf: "begin", past: "began", target: "begun" },
    { inf: "cut", past: "cut", target: "cut" },
    { inf: "understand", past: "understood", target: "understood" }
  ];

  function speak(text) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    window.speechSynthesis.speak(u);
  }

  function renderTable() {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = "";

    verbs.forEach((item, index) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          ${item.inf} 
          <button class="btn-audio" title="Listen" onclick="speak('${item.inf}, ${item.past}, ${item.target}')">🔊</button>
        </td>
        <td>${item.past}</td>
        <td>
          <input type="text" id="input-${index}" autocomplete="off" spellcheck="false" placeholder="↩">
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function resetExercise() {
    document.querySelectorAll("input[type='text']").forEach(input => input.value = "");
  }

  renderTable();
</script>

</body>
</html>
