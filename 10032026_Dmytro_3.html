<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3. One fact — two sentences</title>
<style>
  :root {
    --bg-color: #0f172a;
    --card-bg: #1e293b;
    --text-color: #f8fafc;
    --accent-color: #38bdf8;
    --border-color: #334155;
    --correct-bg: rgba(34, 197, 94, 0.2);
    --correct-border: #22c55e;
    --incorrect-bg: rgba(239, 68, 68, 0.2);
    --incorrect-border: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 800px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 32px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
  }

  .header {
    margin-bottom: 24px;
  }

  .title {
    font-size: 1.5rem;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 1.05rem;
    color: #94a3b8;
    margin-bottom: 16px;
  }

  /* Example Box */
  .example-box {
    background-color: #0f172a;
    border: 1px dashed var(--accent-color);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 28px;
    font-size: 1rem;
  }

  .example-title {
    font-weight: 700;
    color: var(--accent-color);
    margin-bottom: 4px;
  }

  .example-text {
    color: #cbd5e1;
  }

  /* List of Tasks */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 32px;
  }

  .task-card {
    background-color: #0f172a;
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 18px 20px;
  }

  .task-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .task-prompt {
    font-size: 1.15rem;
    font-weight: 800;
    color: #ffffff;
  }

  .audio-btn {
    background: none;
    border: none;
    color: var(--accent-color);
    font-size: 1.2rem;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .audio-btn:hover {
    transform: scale(1.15);
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .prefix-label {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--accent-color);
    min-width: 45px;
  }

  .input-field {
    flex: 1;
    min-width: 220px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    padding: 10px 14px;
    background-color: #1e293b;
    color: #ffffff;
    border: 1.5px solid #475569;
    border-radius: 8px;
    outline: none;
    transition: all 0.2s ease;
  }

  .input-field:focus {
    border-color: var(--accent-color);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
  }

  /* Feedback indicators */
  .input-field.correct {
    background-color: var(--correct-bg) !important;
    border-color: var(--correct-border) !important;
    color: #4ade80 !important;
  }

  .input-field.incorrect {
    background-color: var(--incorrect-bg) !important;
    border-color: var(--incorrect-border) !important;
    color: #f87171 !important;
  }

  .hint-text {
    font-size: 0.85rem;
    font-weight: 600;
    color: #f87171;
    width: 100%;
    margin-left: 55px;
    margin-top: -6px;
  }

  /* Controls */
  .controls {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .btn-group {
    display: flex;
    gap: 12px;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-submit {
    background: var(--accent-color);
    color: #0f172a;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
  }

  .btn-submit:hover {
    background: #0284c7;
    color: #ffffff;
  }

  .btn-reset {
    background: #475569;
    color: #ffffff;
  }

  .btn-reset:hover {
    background: #64748b;
  }

  .score {
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--accent-color);
    min-height: 28px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 class="title">3. One fact — two sentences</h2>
    <p class="subtitle">Прочитай інформацію та напиши два речення про кожного: звідки ця людина та якої вона національності.[cite: 9]</p>
  </div>

  <div class="example-box">
    <div class="example-title">Зразок:[cite: 9]</div>
    <div class="example-text">
      Leo — Italy<br>
      → <strong>Leo is from Italy. He is Italian.</strong>[cite: 9]
    </div>
  </div>

  <div class="task-list" id="task-container"></div>

  <div class="controls">
    <div class="btn-group">
      <button class="btn btn-submit" onclick="checkAnswers()">Check Answers</button>
      <button class="btn btn-reset" onclick="resetExercise()">Reset</button>
    </div>
    <div id="score" class="score"></div>
  </div>
</div>

<script>
  const taskData = [
    {
      num: 1,
      prompt: "Emma — Germany",
      prefix1: "Emma",
      prefix2: "She",
      correct1: "is from Germany.",
      correct2: "is German."
    },
    {
      num: 2,
      prompt: "Max — Poland",
      prefix1: "Max",
      prefix2: "He",
      correct1: "is from Poland.",
      correct2: "is Polish."
    },
    {
      num: 3,
      prompt: "Anna and Tom — the UK",
      prefix1: "Anna and Tom",
      prefix2: "They",
      correct1: "are from the UK.",
      correct2: "are British."
    },
    {
      num: 4,
      prompt: "I — Argentina",
      prefix1: "I",
      prefix2: "I",
      correct1: "am from Argentina.",
      correct2: "am Argentinian."
    },
    {
      num: 5,
      prompt: "We — China",
      prefix1: "We",
      prefix2: "We",
      correct1: "are from China.",
      correct2: "are Chinese."
    },
    {
      num: 6,
      prompt: "Mia — France",
      prefix1: "Mia",
      prefix2: "She",
      correct1: "is from France.",
      correct2: "is French."
    }
  ];

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      window.speechSynthesis.speak(utterance);
    }
  }

  function renderTasks() {
    const container = document.getElementById('task-container');
    container.innerHTML = '';

    taskData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'task-card';

      card.innerHTML = `
        <div class="task-header">
          <span class="task-prompt">${item.num}. ${item.prompt}</span>
          <button class="audio-btn" title="Listen" onclick="speakItem(${index})">🔊</button>
        </div>
        <div class="input-group">
          <div class="input-row">
            <span class="prefix-label">${item.prefix1}</span>
            <input type="text" class="input-field" id="input-${index}-1" autocomplete="off" placeholder="is from...">
          </div>
          <div class="hint-text" id="hint-${index}-1"></div>

          <div class="input-row">
            <span class="prefix-label">${item.prefix2}</span>
            <input type="text" class="input-field" id="input-${index}-2" autocomplete="off" placeholder="is...">
          </div>
          <div class="hint-text" id="hint-${index}-2"></div>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function speakItem(index) {
    const item = taskData[index];
    const inp1 = document.getElementById(`input-${index}-1`).value.trim();
    const inp2 = document.getElementById(`input-${index}-2`).value.trim();

    const text1 = inp1 ? `${item.prefix1} ${inp1}` : `${item.prefix1} ${item.correct1}`;
    const text2 = inp2 ? `${item.prefix2} ${inp2}` : `${item.prefix2} ${item.correct2}`;

    speakText(`${text1} ${text2}`);
  }

  // Normalize string for checking (removes extra spaces, standardizes punctuation)
  function normalize(str) {
    return str.trim().toLowerCase().replace(/\s+/g, ' ').replace(/\.$/, '');
  }

  function checkAnswers() {
    let totalScore = 0;
    const maxScore = taskData.length * 2;

    taskData.forEach((item, index) => {
      const inp1 = document.getElementById(`input-${index}-1`);
      const inp2 = document.getElementById(`input-${index}-2`);
      const hint1 = document.getElementById(`hint-${index}-1`);
      const hint2 = document.getElementById(`hint-${index}-2`);

      [inp1, inp2].forEach(inp => inp.classList.remove('correct', 'incorrect'));
      hint1.textContent = '';
      hint2.textContent = '';

      // Check part 1
      if (normalize(inp1.value) === normalize(item.correct1)) {
        inp1.classList.add('correct');
        totalScore++;
      } else {
        inp1.classList.add('incorrect');
        hint1.textContent = `✓ ${item.prefix1} ${item.correct1}`;
      }

      // Check part 2
      if (normalize(inp2.value) === normalize(item.correct2)) {
        inp2.classList.add('correct');
        totalScore++;
      } else {
        inp2.classList.add('incorrect');
        hint2.textContent = `✓ ${item.prefix2} ${item.correct2}`;
      }
    });

    const scoreElem = document.getElementById('score');
    scoreElem.textContent = `Результат: ${totalScore} / ${maxScore} 🎉`;
  }

  function resetExercise() {
    taskData.forEach((_, index) => {
      const inp1 = document.getElementById(`input-${index}-1`);
      const inp2 = document.getElementById(`input-${index}-2`);
      const hint1 = document.getElementById(`hint-${index}-1`);
      const hint2 = document.getElementById(`hint-${index}-2`);

      if (inp1) {
        inp1.value = '';
        inp1.classList.remove('correct', 'incorrect');
      }
      if (inp2) {
        inp2.value = '';
        inp2.classList.remove('correct', 'incorrect');
      }
      if (hint1) hint1.textContent = '';
      if (hint2) hint2.textContent = '';
    });
    document.getElementById('score').textContent = '';
  }

  renderTasks();
</script>

</body>
</html>
