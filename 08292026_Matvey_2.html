<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Розкрийте дужки — Інтерактивна вправа</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .sentence-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .sentence-item {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s ease;
            font-size: 1rem;
            line-height: 1.5;
        }

        .sentence-item.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-item.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .num-badge {
            color: var(--accent-blue);
            font-weight: 700;
            margin-right: 4px;
        }

        .sentence-text {
            flex-grow: 1;
        }

        .verb-input {
            background: var(--card-bg);
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            width: 120px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .verb-input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .verb-hint {
            color: var(--text-muted);
            font-style: italic;
            margin-left: 4px;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            border: none;
            color: var(--accent-blue);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .correct-answer-text {
            display: none;
            font-size: 0.85rem;
            color: var(--accent-red);
            margin-top: 4px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">1. Розкрийте дужки</div>
        <div class="subtitle">Поставте дієслово у правильний час.</div>
    </div>

    <div class="sentence-list" id="sentenceList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Результат: - / 12</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Перевірити ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Скинути 🔄</button>
        </div>
    </div>
</div>

<script>
    const sentences = [
        { id: 1, prefix: "Our boss usually ", suffix: " students during the summer.", verb: "employ", correct: ["employs"] },
        { id: 2, prefix: "The employee ", suffix: " research at the moment.", verb: "do", correct: ["is doing"] },
        { id: 3, prefix: "My teammate ", suffix: " to our partner now.", verb: "talk", correct: ["is talking"] },
        { id: 4, prefix: "The company ", suffix: " my classmate last summer.", verb: "employ", correct: ["employed"] },
        { id: 5, prefix: "At five o'clock yesterday, the mentor ", suffix: " with a new team member.", verb: "work", correct: ["was working"] },
        { id: 6, prefix: "I often ", suffix: " to work with a partner.", verb: "prefer", correct: ["prefer"] },
        { id: 7, prefix: "The students ", suffix: " research now.", verb: "do", correct: ["are doing"] },
        { id: 8, prefix: "The boss ", suffix: " to an employee when I entered the office.", verb: "talk", correct: ["was talking"] },
        { id: 9, prefix: "Our mentor ", suffix: " us last week.", verb: "help", correct: ["helped"] },
        { id: 10, prefix: "This employee regularly ", suffix: " research with her teammate.", verb: "do", correct: ["does"] },
        { id: 11, prefix: "At eight o'clock yesterday, my classmates ", suffix: " research.", verb: "do", correct: ["were doing"] },
        { id: 12, prefix: "Our partner usually ", suffix: " to work with experienced employees.", verb: "prefer", correct: ["prefers"] }
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderSentences() {
        const list = document.getElementById('sentenceList');
        list.innerHTML = '';

        sentences.forEach(s => {
            const div = document.createElement('div');
            div.className = 'sentence-item';
            div.id = `item-${s.id}`;

            const textToSpeak = `${s.prefix} ${s.correct[0]} ${s.suffix}`;

            div.innerHTML = `
                <div class="sentence-text">
                    <span class="num-badge">${s.id}.</span>
                    ${s.prefix}
                    <input type="text" class="verb-input" id="input-${s.id}" placeholder="${s.verb}" autocomplete="off" spellcheck="false">
                    <span class="verb-hint">(${s.verb})</span>
                    ${s.suffix}
                    <div class="correct-answer-text" id="ans-${s.id}">Правильно: ${s.correct[0]}</div>
                </div>
                <button class="audio-btn" onclick="speak('${textToSpeak.replace(/'/g, "\\'")}')" title="Прослухати">🔊</button>
            `;
            list.appendChild(div);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const input = document.getElementById(`input-${s.id}`);
            const ansText = document.getElementById(`ans-${s.id}`);
            
            const userAns = input.value.trim().toLowerCase();
            row.classList.remove('correct', 'incorrect');
            ansText.style.display = 'none';

            if (s.correct.includes(userAns)) {
                row.classList.add('correct');
                correctCount++;
            } else {
                row.classList.add('incorrect');
                ansText.style.display = 'block';
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: ${correctCount} / ${sentences.length}`;
        scoreDisplay.style.color = correctCount === sentences.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const input = document.getElementById(`input-${s.id}`);
            const ansText = document.getElementById(`ans-${s.id}`);

            row.classList.remove('correct', 'incorrect');
            input.value = '';
            ansText.style.display = 'none';
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: - / ${sentences.length}`;
        scoreDisplay.style.color = 'var(--accent-blue)';
    }

    window.onload = renderSentences;
</script>

</body>
</html>
