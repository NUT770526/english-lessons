<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вправа 5. Вибери слово, яке підходить за змістом</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #f1f5f9;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid #2d2d2d;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      border-bottom: 2px solid #333333;
      padding-bottom: 15px;
    }

    .header-icon {
      font-size: 1.8rem;
    }

    h2 {
      color: #ffffff;
      margin: 0;
      font-size: 1.5rem;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .exercise-card {
      background: #262626;
      border: 1px solid #3b3b3b;
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s ease;
    }

    .sentence-box {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #ffffff;
      margin-bottom: 12px;
    }

    .item-num {
      font-weight: bold;
      color: #38bdf8;
      margin-right: 6px;
    }

    .blank-slot {
      display: inline-block;
      min-width: 140px;
      padding: 2px 10px;
      border-bottom: 2px solid #38bdf8;
      color: #38bdf8;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s ease;
    }

    .blank-slot.correct {
      color: #4ade80;
      border-bottom-color: #4ade80;
    }

    .blank-slot.incorrect {
      color: #f87171;
      border-bottom-color: #f87171;
    }

    /* Options Chips */
    .options-container {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .option-btn {
      background: #1e1e1e;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: #334155;
    }

    .option-btn.selected {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* Audio Button */
    .audio-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      margin-left: 8px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .audio-btn:hover {
      opacity: 1;
    }

    /* Controls */
    .controls {
      margin-top: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 2px solid #333333;
      padding-top: 20px;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-check {
      background-color: #0284c7;
      color: #ffffff;
    }

    .btn-check:hover {
      background-color: #0369a1;
    }

    .btn-reset {
      background-color: #334155;
      color: #f1f5f9;
    }

    .btn-reset:hover {
      background-color: #475569;
    }

    .score-display {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ffffff;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="header-icon">📝</span>
    <h2>Вправа 5. Вибери слово, яке підходить за змістом</h2>
  </div>

  <div class="exercise-list" id="exerciseContainer"></div>

  <div class="controls">
    <div>
      <button class="btn btn-check" onclick="checkAnswers()">Перевірити</button>
      <button class="btn btn-reset" onclick="resetExercise()">Скинути</button>
    </div>
    <div class="score-display" id="scoreDisplay"></div>
  </div>
</div>

<script>
  const exerciseData = [
    {
      id: 1,
      prefix: "You speak two languages. You are ",
      suffix: ".",
      options: ["bilingual", "reliable"],
      correct: "bilingual"
    },
    {
      id: 2,
      prefix: "You speak English very well. You have ",
      suffix: ".",
      options: ["fluency", "jargon"],
      correct: "fluency"
    },
    {
      id: 3,
      prefix: "Your friend always helps you. He is ",
      suffix: ".",
      options: ["reliable", "foreign"],
      correct: "reliable"
    },
    {
      id: 4,
      prefix: "Ukrainian is your first language. It is your ",
      suffix: ".",
      options: ["mother tongue", "foreign language"],
      correct: "mother tongue"
    },
    {
      id: 5,
      prefix: "A person from England speaks English from childhood. He is a ",
      suffix: ".",
      options: ["native speaker", "learning strategy"],
      correct: "native speaker"
    },
    {
      id: 6,
      prefix: "You use informal words with your friends. This is ",
      suffix: ".",
      options: ["slang", "accuracy"],
      correct: "slang"
    },
    {
      id: 7,
      prefix: "A doctor uses special medical words. This is ",
      suffix: ".",
      options: ["jargon", "fluency"],
      correct: "jargon"
    },
    {
      id: 8,
      prefix: "You make very few mistakes. You have good ",
      suffix: ".",
      options: ["accuracy", "slang"],
      correct: "accuracy"
    },
    {
      id: 9,
      prefix: "You have different ways to remember words. These are ",
      suffix: ".",
      options: ["learning strategies", "native speakers"],
      correct: "learning strategies"
    },
    {
      id: 10,
      prefix: "English is not your first language. It is a ",
      suffix: ".",
      options: ["foreign language", "mother tongue"],
      correct: "foreign language"
    }
  ];

  // Пользовательские выборы
  const userAnswers = {};

  function speak(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
  }

  function playFullSentence(id) {
    const item = exerciseData.find(ex => ex.id === id);
    const chosen = userAnswers[id] || "_______";
    speak(item.prefix + chosen + item.suffix);
  }

  function renderExercise() {
    const container = document.getElementById("exerciseContainer");
    container.innerHTML = "";

    exerciseData.forEach(item => {
      const card = document.createElement("div");
      card.className = "exercise-card";

      // Sentence Box
      const sentenceDiv = document.createElement("div");
      sentenceDiv.className = "sentence-box";

      const numSpan = document.createElement("span");
      numSpan.className = "item-num";
      numSpan.innerText = `${item.id}. `;

      const slotSpan = document.createElement("span");
      slotSpan.className = "blank-slot";
      slotSpan.id = `slot-${item.id}`;
      slotSpan.innerText = userAnswers[item.id] || "_______";

      const audioBtn = document.createElement("button");
      audioBtn.className = "audio-btn";
      audioBtn.innerHTML = "🔊";
      audioBtn.title = "Прослухати речення";
      audioBtn.onclick = () => playFullSentence(item.id);

      sentenceDiv.appendChild(numSpan);
      sentenceDiv.appendChild(document.createTextNode(item.prefix));
      sentenceDiv.appendChild(slotSpan);
      sentenceDiv.appendChild(document.createTextNode(item.suffix));
      sentenceDiv.appendChild(audioBtn);

      // Options
      const optionsDiv = document.createElement("div");
      optionsDiv.className = "options-container";

      item.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.id = `opt-${item.id}-${opt.replace(/\s+/g, '-')}`;
        btn.innerText = opt;

        if (userAnswers[item.id] === opt) {
          btn.classList.add("selected");
        }

        btn.onclick = () => {
          userAnswers[item.id] = opt;
          speak(opt);
          updateCardUI(item.id);
        };

        optionsDiv.appendChild(btn);
      });

      card.appendChild(sentenceDiv);
      card.appendChild(optionsDiv);
      container.appendChild(card);
    });
  }

  function updateCardUI(id) {
    const slot = document.getElementById(`slot-${id}`);
    slot.innerText = userAnswers[id] || "_______";
    slot.className = "blank-slot";

    const item = exerciseData.find(ex => ex.id === id);
    item.options.forEach(opt => {
      const btn = document.getElementById(`opt-${id}-${opt.replace(/\s+/g, '-')}`);
      if (userAnswers[id] === opt) {
        btn.classList.add("selected");
      } else {
        btn.classList.remove("selected");
      }
    });
  }

  function checkAnswers() {
    let score = 0;

    exerciseData.forEach(item => {
      const slot = document.getElementById(`slot-${item.id}`);
      const userVal = userAnswers[item.id];

      if (userVal === item.correct) {
        slot.className = "blank-slot correct";
        score++;
      } else {
        slot.className = "blank-slot incorrect";
        if (!userVal) {
          slot.innerText = item.correct;
        }
      }
    });

    document.getElementById("scoreDisplay").innerText = `Результат: ${score} / ${exerciseData.length}`;
  }

  function resetExercise() {
    for (let key in userAnswers) delete userAnswers[key];
    renderExercise();
    document.getElementById("scoreDisplay").innerText = "";
  }

  renderExercise();
</script>

</body>
</html>
