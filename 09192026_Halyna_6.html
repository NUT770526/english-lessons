<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Present Perfect Grammar Practice ⏳</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 1rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: #38bdf8;
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .quiz-row {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 18px 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .prompt-sentence {
    font-size: 1.05rem;
    font-weight: 600;
    color: #f1f5f9;
    line-height: 1.5;
  }

  .input-wrapper {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: 1rem;
    color: #f8fafc;
    background-color: #1e293b;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    outline: none;
    transition: all 0.2s ease;
    width: 100%;
    box-sizing: border-box;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"].correct-input {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  input[type="text"].wrong-input {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .feedback {
    font-size: 0.9rem;
    font-weight: 600;
    display: none;
  }

  .feedback.show {
    display: block;
  }

  .feedback.correct-text {
    color: #4ade80;
  }

  .feedback.wrong-text {
    color: #fca5a5;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Present Perfect Practice ⏳</h2>
      <div class="subtitle">Перекладіть речення англійською мовою, використовуючи Present Perfect.</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 9</div>
  </div>

  <!-- Vocabulary Section -->
  <div class="section-title">1. Key Words & Phrases (Лексика та вимова)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <!-- Exercise Questions -->
  <div class="section-title">2. Translate using Present Perfect</div>
  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordBank = [
    { word: "this week", phonetic: "[ðɪs wiːk]", ukr: "на цьому тижні" },
    { word: "this month", phonetic: "[ðɪs mʌnθ]", ukr: "у цьому місяці" },
    { word: "this year", phonetic: "[ðɪs jɪər]", ukr: "у цьому році" },
    { word: "exhibition", phonetic: "[ˌek.sɪˈbɪʃ.ən]", ukr: "виставка" },
    { word: "discussion", phonetic: "[dɪˈskʌʃ.ən]", ukr: "дискусія / обговорення" },
    { word: "vacation / holiday", phonetic: "[vəˈkeɪ.ʃən]", ukr: "відпустка" }
  ];

  const questions = [
    {
      id: 1,
      num: "1.",
      src: "У меня было много работы на этой неделе.",
      displayCorrect: "I have had a lot of work this week.",
      answers: [
        "i have had a lot of work this week",
        "i've had a lot of work this week",
        "i have had much work this week",
        "i've had much work this week",
        "i have had plenty of work this week",
        "i've had plenty of work this week",
        "i have had lots of work this week",
        "i've had lots of work this week"
      ]
    },
    {
      id: 2,
      num: "2.",
      src: "Он прочитал массу книг за этот месяц.",
      displayCorrect: "He has read a lot of books this month.",
      answers: [
        "he has read a lot of books this month",
        "he's read a lot of books this month",
        "he has read lots of books this month",
        "he's read lots of books this month",
        "he has read a great deal of books this month",
        "he has read many books this month",
        "he's read many books this month"
      ]
    },
    {
      id: 3,
      num: "3.",
      src: "Я был очень занят на этой неделе.",
      displayCorrect: "I have been very busy this week.",
      answers: [
        "i have been very busy this week",
        "i've been very busy this week"
      ]
    },
    {
      id: 4,
      num: "4.",
      src: "Вы были на каких-либо выставках в этом месяце?",
      displayCorrect: "Have you been to any exhibitions this month?",
      answers: [
        "have you been to any exhibitions this month",
        "have you been to any art shows this month",
        "have you visited any exhibitions this month"
      ]
    },
    {
      id: 5,
      num: "5.",
      src: "У нас было много интересных дискуссий в этом году.",
      displayCorrect: "We have had many interesting discussions this year.",
      answers: [
        "we have had many interesting discussions this year",
        "we've had many interesting discussions this year",
        "we have had a lot of interesting discussions this year",
        "we've had a lot of interesting discussions this year",
        "we have had lots of interesting discussions this year",
        "we've had lots of interesting discussions this year"
      ]
    },
    {
      id: 6,
      num: "6.",
      src: "— У вас был отпуск в этом году? — Нет еще.",
      displayCorrect: "— Have you had a vacation this year? — Not yet.",
      answers: [
        "have you had a vacation this year not yet",
        "have you had a holiday this year not yet",
        "have you had a vacation this year - not yet",
        "have you had a holiday this year - not yet",
        "have you had vacation this year not yet",
        "have you had a vacation this year? no, not yet",
        "have you had a holiday this year? no, not yet"
      ]
    },
    {
      id: 7,
      num: "7.",
      src: "Я не видел его сегодня.",
      displayCorrect: "I haven't seen him today.",
      answers: [
        "i haven't seen him today",
        "i have not seen him today"
      ]
    },
    {
      id: 8,
      num: "8.",
      src: "Мы не ходили в театр в этом месяце.",
      displayCorrect: "We haven't been to the theatre this month.",
      answers: [
        "we haven't been to the theatre this month",
        "we have not been to the theatre this month",
        "we haven't been to the theater this month",
        "we have not been to the theater this month",
        "we haven't gone to the theatre this month",
        "we have not gone to the theatre this month",
        "we haven't gone to the theater this month",
        "we have not gone to the theater this month"
      ]
    },
    {
      id: 9,
      num: "9.",
      src: "— У вас были какие-нибудь собрания на этой неделе? — Да, было два.",
      displayCorrect: "— Have you had any meetings this week? — Yes, we have had two.",
      answers: [
        "have you had any meetings this week yes we have had two",
        "have you had any meetings this week yes we had two",
        "have you had any meetings this week - yes, we have had two",
        "have you had any meetings this week - yes, there were two",
        "have you had any meetings this week - yes, two",
        "have you had any meetings this week yes two",
        "have you had any meetings this week yes, there were two"
      ]
    }
  ];

  function cleanText(str) {
    return str.toLowerCase()
      .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'’"–—]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = wordBank.map(item => `
      <div class="vocab-card">
        <div class="vocab-info">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach(q => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      row.innerHTML = `
        <div class="prompt-sentence">
          <b>${q.num}</b> ${q.src}
        </div>
        <div class="input-wrapper">
          <input type="text" id="input-${q.id}" placeholder="Type English translation here..." autocomplete="off" />
          <div class="feedback" id="feedback-${q.id}"></div>
        </div>
      `;

      container.appendChild(row);
    });
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const inputEl = document.getElementById(`input-${q.id}`);
      const feedbackEl = document.getElementById(`feedback-${q.id}`);
      const userVal = cleanText(inputEl.value);

      inputEl.classList.remove('correct-input', 'wrong-input');
      feedbackEl.classList.remove('show', 'correct-text', 'wrong-text');

      const isCorrect = q.answers.some(ans => cleanText(ans) === userVal);

      if (userVal !== "" && isCorrect) {
        score++;
        inputEl.classList.add('correct-input');
        feedbackEl.innerText = "✓ Perfect Present Perfect sentence!";
        feedbackEl.classList.add('show', 'correct-text');
      } else {
        inputEl.classList.add('wrong-input');
        feedbackEl.innerText = `💡 Key answer: "${q.displayCorrect}"`;
        feedbackEl.classList.add('show', 'wrong-text');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderVocab();
    renderQuiz();
  };
</script>

</body>
</html>
