<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: What tense is it?</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-yellow: #f59e0b;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .task-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .task-icon {
            font-size: 1.8rem;
        }

        .task-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .table-container {
            border: 1.5px solid var(--accent-yellow);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            background: var(--input-bg);
        }

        .table-row {
            display: grid;
            grid-template-columns: 45px 1fr 220px 45px;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .table-row:last-child {
            border-bottom: none;
        }

        .table-row.correct {
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .table-row.incorrect {
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .row-num {
            color: var(--accent-yellow);
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
        }

        .row-text {
            font-size: 1rem;
            color: var(--text-main);
            line-height: 1.4;
        }

        .select-wrap {
            width: 100%;
        }

        .table-select {
            width: 100%;
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .table-select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            border: none;
            color: var(--accent-blue);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }

        @media (max-width: 600px) {
            .table-row {
                grid-template-columns: 35px 1fr 40px;
                grid-template-rows: auto auto;
            }
            .row-text {
                grid-column: 2 / 3;
            }
            .audio-btn {
                grid-column: 3 / 4;
            }
            .select-wrap {
                grid-column: 1 / 4;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="task-header">
        <span class="task-icon">🧩</span>
        <div class="task-title">Step 1: what tense is it? Select the correct answers</div>
    </div>

    <div class="table-container" id="tableContainer"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Score: - / 5</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Check ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        </div>
    </div>
</div>

<script>
    const tableData = [
        {
            id: 1,
            text: "At the moment I am learning English here.",
            answer: "Present Continuous"
        },
        {
            id: 2,
            text: "What are you doing here?",
            answer: "Present Continuous"
        },
        {
            id: 3,
            text: "I'm in the sociology department.",
            answer: "Present Simple"
        },
        {
            id: 4,
            text: "It's about how people think differently.",
            answer: "Present Simple"
        },
        {
            id: 5,
            text: "I'm studying English now.",
            answer: "Present Continuous"
        }
    ];

    const options = [
        "Select tense...",
        "Present Simple",
        "Present Continuous"
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderTable() {
        const container = document.getElementById('tableContainer');
        container.innerHTML = '';

        tableData.forEach(item => {
            const row = document.createElement('div');
            row.className = 'table-row';
            row.id = `row-${item.id}`;

            const optionsHTML = options.map((opt, idx) => {
                const val = idx === 0 ? "" : opt;
                return `<option value="${val}">${opt}</option>`;
            }).join('');

            row.innerHTML = `
                <div class="row-num">${item.id}</div>
                <div class="row-text">${item.text}</div>
                <div class="select-wrap">
                    <select class="table-select" id="select-${item.id}">
                        ${optionsHTML}
                    </select>
                </div>
                <button class="audio-btn" onclick="speak('${item.text.replace(/'/g, "\\'")}')" title="Listen sentence">🔊</button>
            `;
            container.appendChild(row);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        tableData.forEach(item => {
            const row = document.getElementById(`row-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);
            const userVal = select.value;

            row.classList.remove('correct', 'incorrect');

            if (userVal === item.answer) {
                row.classList.add('correct');
                correctCount++;
            } else {
                row.classList.add('incorrect');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: ${correctCount} / ${tableData.length}`;
        scoreDisplay.style.color = correctCount === tableData.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        tableData.forEach(item => {
            const row = document.getElementById(`row-${item.id}`);
            const select = document.getElementById(`select-${item.id}`);

            row.classList.remove('correct', 'incorrect');
            if (select) select.selectedIndex = 0;
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: - / ${tableData.length}`;
        scoreDisplay.style.color = 'var(--accent-blue)';
    }

    window.onload = () => {
        renderTable();
    };
</script>

</body>
</html>
