<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find correct words to complete these advice</title>
<style>
  :root {
    --primary: #8b5cf6;
    --primary-hover: #7c3aed;
    --bg: #f5f3ff;
    --card: #ffffff;
    --text: #1e1b4b;
    --border: #ddd6fe;
    --correct: #10b981;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 820px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
  }

  .header {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 3px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 4px 0;
    font-size: 1.4rem;
    color: #4c1d95;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #6b21a8;
    font-style: italic;
  }

  .score-board {
    background: #f3e8ff;
    border: 1.5px solid var(--border);
    padding: 8px 16px;
    border-radius: 12px;
    font-weight: 700;
    color: #581c87;
    font-size: 1.05rem;
  }

  .word-bank-box {
    background-color: #faf5ff;
    border: 2px solid var(--border);
    padding: 16px;
    border-radius: 14px;
    margin-bottom: 24px;
  }

  .word-bank-title {
    font-size: 0.85rem;
    font-weight: 700;
    color: #6b21a8;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }

  .word-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .word-chip {
    background: #ffffff;
    border: 1.5px solid #c4b5fd;
    color: #581c87;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 2px 4px rgba(139, 92, 246, 0.08);
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .quiz-card {
    background: #ffffff;
    border: 1.5px solid #e9d5ff;
    border-radius: 14px;
    padding: 18px;
    transition: all 0.2s ease;
  }

  .quiz-card:hover {
    border-color: #c4b5fd;
  }

  .sentence-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .sentence-wrapper {
    font-size: 1.05rem;
    font-weight: 600;
    color: #1e1b4b;
    line-height: 1.8;
    flex: 1;
  }

  select {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    color: #4c1d95;
    background-color: #faf5ff;
    border: 2px solid #c4b5fd;
    border-radius: 8px;
    padding: 6px 12px;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
    margin: 0 4px;
  }

  select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
  }

  select.correct-select {
    border-color: var(--correct);
    background-color: #ecfdf5;
    color: #065f46;
  }

  select.wrong-select {
    border-color: var(--wrong);
    background-color: #fef2f2;
    color: #991b1b;
  }

  /* Tooltip styling */
  .tooltip {
    position: relative;
    border-bottom: 1.5px dashed #8b5cf6;
    cursor: help;
  }

  .tooltip .tooltiptext {
    visibility: hidden;
    width: auto;
    background-color: #4c1d95;
    color: #fff;
    text-align: center;
    border-radius: 6px;
    padding: 4px 8px;
    position: absolute;
    z-index: 10;
    bottom: 125%;
    left: 50%;
    transform: translateX(-50%);
    opacity: 0;
    transition: opacity 0.2s;
    font-size: 0.8rem;
    white-space: nowrap;
    font-weight: normal;
  }

  .tooltip:hover .tooltiptext {
    visibility: visible;
    opacity: 1;
  }

  .audio-btn {
    background: #f3e8ff;
    border: 1px solid #ddd6fe;
    cursor: pointer;
    font-size: 1.1rem;
    line-height: 1;
    padding: 8px 12px;
    border-radius: 8px;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .audio-btn:hover {
    background-color: #e9d5ff;
    transform: scale(1.05);
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 16px;
  }

  .action-btn {
    background-color: var(--primary);
    color: #ffffff;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(139, 92, 246, 0.4);
  }

  .action-btn.secondary {
    background-color: #6b7280;
    box-shadow: 0 4px 12px rgba(107, 114, 128, 0.3);
  }

  .action-btn.secondary:hover {
    background-color: #4b5563;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>🎬 Find correct words to complete these advice</h2>
      <div class="subtitle">Обери правильне слово або фразу для кожного речення.</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 5</div>
  </div>

  <div class="word-bank-box">
    <div class="word-bank-title">Word Bank / Доступні слова:</div>
    <div class="word-bank">
      <span class="word-chip">perfectly clear</span>
      <span class="word-chip">words and expressions</span>
      <span class="word-chip">misunderstanding</span>
      <span class="word-chip">questions</span>
      <span class="word-chip">short and simple</span>
    </div>
  </div>

  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordOptions = [
    "perfectly clear",
    "words and expressions",
    "misunderstanding",
    "questions",
    "short and simple"
  ];

  const questions = [
    {
      id: 1,
      part1: "1. Keep sentences and <span class='tooltip'>paragraphs<span class='tooltiptext'>абзаци</span></span>",
      part2: ".",
      correct: "short and simple",
      fullText: "Keep sentences and paragraphs short and simple."
    },
    {
      id: 2,
      part1: "2. Use <span class='tooltip'>straightforward<span class='tooltiptext'>просту / зрозумілу</span></span> <span class='tooltip'>vocabulary<span class='tooltiptext'>лексику</span></span> to avoid any",
      part2: ".",
      correct: "misunderstanding",
      fullText: "Use straightforward vocabulary to avoid any misunderstanding."
    },
    {
      id: 3,
      part1: "3. Ask direct",
      part2: ".",
      correct: "questions",
      fullText: "Ask direct questions."
    },
    {
      id: 4,
      part1: "4. <span class='tooltip'>Rewrite<span class='tooltiptext'>Перепиши</span></span> any sentence that does not seem",
      part2: ".",
      correct: "perfectly clear",
      fullText: "Rewrite any sentence that does not seem perfectly clear."
    },
    {
      id: 5,
      part1: "5. If the <span class='tooltip'>recipient<span class='tooltiptext'>отримувач</span></span> is not a <span class='tooltip'>native English-speaker<span class='tooltiptext'>носій англійської мови</span></span>, it is <span class='tooltip'>preferable<span class='tooltiptext'>бажано</span></span> to <span class='tooltip'>avoid<span class='tooltiptext'>уникати</span></span> idioms / complex",
      part2: ".",
      correct: "words and expressions",
      fullText: "If the recipient is not a native English-speaker, it is preferable to avoid words and expressions."
    }
  ];

  function shuffle(array) {
    return array.slice().sort(() => Math.random() - 0.5);
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'quiz-card';
      card.id = `card-${q.id}`;

      const shuffledOptions = shuffle(wordOptions);
      const optionsHTML = ['<option value="">-- select --</option>']
        .concat(shuffledOptions.map(opt => `<option value="${opt}">${opt}</option>`))
        .join('');

      card.innerHTML = `
        <div class="sentence-row">
          <div class="sentence-wrapper">
            ${q.part1}
            <select id="select-${q.id}">${optionsHTML}</select>
            ${q.part2}
          </div>
          <button class="audio-btn" onclick="speakText('${q.fullText}')" title="Listen full sentence">🔊</button>
        </div>
      `;

      container.appendChild(card);
    });
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const selectEl = document.getElementById(`select-${q.id}`);
      const val = selectEl.value;

      selectEl.classList.remove('correct-select', 'wrong-select');

      if (val === q.correct) {
        score++;
        selectEl.classList.add('correct-select');
      } else {
        selectEl.classList.add('wrong-select');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = renderQuiz;
</script>

</body>
</html>
