<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2. Вставте потрібне слово — Інтерактивна вправа</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            margin-bottom: 20px;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 12px;
        }

        .word-bank {
            background: var(--input-bg);
            border: 1px dashed var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .word-bank strong {
            color: var(--accent-blue);
        }

        .sentence-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .sentence-item {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.2s ease;
            font-size: 1rem;
            line-height: 1.5;
        }

        .sentence-item.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-item.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .num-badge {
            color: var(--accent-blue);
            font-weight: 700;
            margin-right: 4px;
        }

        .sentence-text {
            flex-grow: 1;
        }

        .word-select {
            background: var(--card-bg);
            color: var(--accent-blue);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .word-select:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.15);
            border: none;
            color: var(--accent-blue);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .correct-answer-text {
            display: none;
            font-size: 0.85rem;
            color: var(--accent-red);
            margin-top: 4px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">2. Вставте потрібне слово</div>
    </div>

    <div class="word-bank">
        <strong>Слова для вибору:</strong> boss · employee · classmate · partner · teammate · member · mentor · student · employ · do research · prefer to
    </div>

    <div class="sentence-list" id="sentenceList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Результат: - / 11</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Перевірити ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Скинути 🔄</button>
        </div>
    </div>
</div>

<script>
    const vocabularyOptions = [
        "boss", "employee", "classmate", "partner", "teammate", 
        "member", "mentor", "student", "employ", "do research", "prefer to"
    ];

    const sentences = [
        { id: 1, prefix: "A person who manages employees is a ", suffix: ".", correct: "boss" },
        { id: 2, prefix: "A person who works for a company is an ", suffix: ".", correct: "employee" },
        { id: 3, prefix: "A person who studies in the same class as you is a ", suffix: ".", correct: "classmate" },
        { id: 4, prefix: "A person who shares a business or project with you is a ", suffix: ".", correct: "partner" },
        { id: 5, prefix: "A person who works on the same team as you is a ", suffix: ".", correct: "teammate" },
        { id: 6, prefix: "A person who belongs to a group is a ", suffix: ".", correct: "member" },
        { id: 7, prefix: "A person who gives you advice and helps you develop is a ", suffix: ".", correct: "mentor" },
        { id: 8, prefix: "A person who studies at school, college or university is a ", suffix: ".", correct: "student" },
        { id: 9, prefix: "When a company gives someone a job, it decides to ", suffix: " that person.", correct: "employ" },
        { id: 10, prefix: "When we investigate a topic carefully, we ", suffix: ".", correct: "do research" },
        { id: 11, prefix: "When we like one option more than another, we ", suffix: " choose it.", correct: "prefer to" }
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderSentences() {
        const list = document.getElementById('sentenceList');
        list.innerHTML = '';

        sentences.forEach(s => {
            const div = document.createElement('div');
            div.className = 'sentence-item';
            div.id = `item-${s.id}`;

            let optionsHtml = `<option value="">...</option>`;
            vocabularyOptions.forEach(opt => {
                optionsHtml += `<option value="${opt}">${opt}</option>`;
            });

            const textToSpeak = `${s.prefix} ${s.correct} ${s.suffix}`;

            div.innerHTML = `
                <div class="sentence-text">
                    <span class="num-badge">${s.id}.</span>
                    ${s.prefix}
                    <select class="word-select" id="select-${s.id}">${optionsHtml}</select>
                    ${s.suffix}
                    <div class="correct-answer-text" id="ans-${s.id}">Правильно: ${s.correct}</div>
                </div>
                <button class="audio-btn" onclick="speak('${textToSpeak.replace(/'/g, "\\'")}')" title="Прослухати">🔊</button>
            `;
            list.appendChild(div);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const select = document.getElementById(`select-${s.id}`);
            const ansText = document.getElementById(`ans-${s.id}`);
            
            row.classList.remove('correct', 'incorrect');
            ansText.style.display = 'none';

            if (select.value === s.correct) {
                row.classList.add('correct');
                correctCount++;
            } else {
                row.classList.add('incorrect');
                ansText.style.display = 'block';
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: ${correctCount} / ${sentences.length}`;
        scoreDisplay.style.color = correctCount === sentences.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        sentences.forEach(s => {
            const row = document.getElementById(`item-${s.id}`);
            const select = document.getElementById(`select-${s.id}`);
            const ansText = document.getElementById(`ans-${s.id}`);

            row.classList.remove('correct', 'incorrect');
            select.value = '';
            ansText.style.display = 'none';
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: - / ${sentences.length}`;
        scoreDisplay.style.color = 'var(--accent-blue)';
    }

    window.onload = renderSentences;
</script>

</body>
</html>
