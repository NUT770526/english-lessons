<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business English Practice 💼</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 1rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: #38bdf8;
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-row {
    background: #1e293b;
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .interactive-sentence {
    font-size: 1.05rem;
    font-weight: 500;
    color: #f1f5f9;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    line-height: 1.6;
  }

  select {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    color: #38bdf8;
    background-color: #0f172a;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  select:focus {
    border-color: var(--accent);
  }

  select.correct-select {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  select.wrong-select {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Business English Practice 💼</h2>
      <div class="subtitle">Обери правильне слово/фразу для кожного речення. Послухай вимову (🔊)!</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <!-- Vocabulary Section -->
  <div class="section-title">1. Business Vocabulary & Audio (Лексика)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <!-- Exercise Questions -->
  <div class="section-title">2. Complete the Sentences</div>
  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordBank = [
    { word: "already", phonetic: "[ɔːlˈred.i]", ukr: "вже" },
    { word: "recently", phonetic: "[ˈriː.sənt.li]", ukr: "нещодавно" },
    { word: "currently", phonetic: "[ˈkʌr.ənt.li]", ukr: "наразі / зараз" },
    { word: "I'd love to", phonetic: "[aɪd lʌv tuː]", ukr: "я з радістю" },
    { word: "if you like", phonetic: "[ɪf juː laɪk]", ukr: "якщо бажаєте" },
    { word: "have a look at", phonetic: "[hæv ə lʊk æt]", ukr: "поглянути на" },
    { word: "answer", phonetic: "[ˈɑːn.sər]", ukr: "відповісти на" },
    { word: "thirsty", phonetic: "[ˈθɜː.sti]", ukr: "відчуває спрагу" },
    { word: "would like to", phonetic: "[wʊd laɪk tuː]", ukr: "хотів би" },
    { word: "as you prefer", phonetic: "[æz juː prɪˈfɜːr]", ukr: "як вам зручніше" }
  ];

  const allOptions = [
    "already", "recently", "currently", "I'd love to", "if you like",
    "have a look at", "answer", "thirsty", "would like to", "as you prefer"
  ];

  const questions = [
    { id: 1, num: "1.", prefix: "I have ", suffix: " sent the invoice to the client.", correct: "already" },
    { id: 2, num: "2.", prefix: "We have ", suffix: " updated the payment information.", correct: "recently" },
    { id: 3, num: "3.", prefix: "I am ", suffix: " preparing the monthly report.", correct: "currently" },
    { id: 4, num: "4.", prefix: '“Would you like to join our meeting?” — “', suffix: ' .”', correct: "I'd love to" },
    { id: 5, num: "5.", prefix: "We can discuss the contract now, ", suffix: ".", correct: "if you like" },
    { id: 6, num: "6.", prefix: "Could you ", suffix: " this document, please?", correct: "have a look at" },
    { id: 7, num: "7.", prefix: "Please ", suffix: " the client's question today.", correct: "answer" },
    { id: 8, num: "8.", prefix: "I am ", suffix: ". I would like some water.", correct: "thirsty" },
    { id: 9, num: "9.", prefix: "I ", suffix: " schedule a meeting with the manager.", correct: "would like to" },
    { id: 10, num: "10.", prefix: "We can meet online or in the office, ", suffix: ".", correct: "as you prefer" }
  ];

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = wordBank.map(item => `
      <div class="vocab-card">
        <div class="vocab-info">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach(q => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      const optionsHtml = ['<option value="">-- select option --</option>']
        .concat(allOptions.map(opt => `<option value="${opt}">${opt}</option>`))
        .join('');

      row.innerHTML = `
        <div class="interactive-sentence">
          <span><b>${q.num}</b> ${q.prefix}</span>
          <select id="select-${q.id}">
            ${optionsHtml}
          </select>
          <span>${q.suffix}</span>
        </div>
      `;

      container.appendChild(row);
    });
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const selectEl = document.getElementById(`select-${q.id}`);
      const val = selectEl.value;

      selectEl.classList.remove('correct-select', 'wrong-select');

      if (val === q.correct) {
        score++;
        selectEl.classList.add('correct-select');
      } else {
        selectEl.classList.add('wrong-select');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderVocab();
    renderQuiz();
  };
</script>

</body>
</html>
