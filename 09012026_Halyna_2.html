<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2. Choose the correct option</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #6c5ce7;
      --accent-hover: #5a4bcf;
      --text: #f1f2f6;
      --text-muted: #a4b0be;
      --correct: #2ed573;
      --incorrect: #ff4757;
      --border: #2f3542;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1.8rem;
      margin-top: 0;
      color: var(--text);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 25px;
    }

    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 25px;
    }

    .sentence-card {
      background: #252530;
      padding: 16px 20px;
      border-radius: 12px;
      border: 2px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      transition: border-color 0.2s, background 0.2s;
    }

    .sentence-text {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.6;
      flex-grow: 1;
    }

    select.dropdown {
      background-color: #1a1a24;
      color: var(--text);
      border: 2px solid var(--accent);
      padding: 6px 12px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0 4px;
    }

    select.dropdown:focus {
      border-color: #8c7ae6;
      box-shadow: 0 0 8px rgba(108, 92, 231, 0.4);
    }

    .audio-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.2rem;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:hover {
      background: rgba(108, 92, 231, 0.2);
    }

    .controls {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    button.action-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.action-btn:hover {
      background-color: var(--accent-hover);
    }

    button.reset-btn {
      background-color: transparent;
      border: 2px solid var(--border);
      color: var(--text-muted);
    }

    button.reset-btn:hover {
      background-color: var(--border);
      color: var(--text);
    }

    .result {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .correct-card {
      border-color: var(--correct) !important;
      background: rgba(46, 213, 115, 0.1) !important;
    }

    .incorrect-card {
      border-color: var(--incorrect) !important;
      background: rgba(255, 71, 87, 0.1) !important;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Exercise 2. Choose the correct option</h1>
  <p class="subtitle">Select the correct preposition or prepositional phrase for each sentence:</p>

  <div class="exercise-list" id="exercise-list"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers</button>
    <button class="action-btn reset-btn" onclick="resetExercise()">Reset</button>
    <div class="result" id="result-text"></div>
  </div>
</div>

<script>
  const sentencesData = [
    {
      num: 1,
      before: "Our bank is ",
      after: " of King Street.",
      options: ["on the corner", "in the corner", "round the square"],
      correct: "on the corner"
    },
    {
      num: 2,
      before: "The printer is ",
      after: " of the office.",
      options: ["at the corner", "in the corner", "on the corner"],
      correct: "in the corner"
    },
    {
      num: 3,
      before: "There is a good business café ",
      after: ".",
      options: ["round the corner", "in all sides", "at front"],
      correct: "round the corner"
    },
    {
      num: 4,
      before: "Write the date ",
      after: " the top right-hand corner.",
      options: ["on", "at", "in"],
      correct: "in"
    },
    {
      num: 5,
      before: "You can see our company logo ",
      after: " the left-hand corner of the document.",
      options: ["in", "on", "at"],
      correct: "in"
    },
    {
      num: 6,
      before: "The total amount is shown ",
      after: " the right-hand side of the invoice.",
      options: ["on", "in", "round"],
      correct: "on"
    },
    {
      num: 7,
      before: "The taxi stopped ",
      after: " the main entrance.",
      options: ["in front of", "at front", "on front of"],
      correct: "in front of"
    },
    {
      num: 8,
      before: "There are security cameras ",
      after: " of the building.",
      options: ["on all sides", "at all side", "in all sides"],
      correct: "on all sides"
    },
    {
      num: 9,
      before: "We met our business partners ",
      after: ".",
      options: ["in the square", "on the square", "at square"],
      correct: "in the square"
    },
    {
      num: 10,
      before: "When you ",
      after: ", you will see our office.",
      options: ["turn the corner", "turn in the corner", "turn at corner"],
      correct: "turn the corner"
    }
  ];

  function renderExercise() {
    const listEl = document.getElementById('exercise-list');
    listEl.innerHTML = '';
    document.getElementById('result-text').textContent = '';

    sentencesData.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'sentence-card';
      card.id = `card-${idx}`;

      const sentenceText = document.createElement('div');
      sentenceText.className = 'sentence-text';
      sentenceText.innerHTML = `
        ${item.num}. ${item.before}
        <select class="dropdown" id="select-${idx}">
          <option value="" disabled selected>---</option>
          ${item.options.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
        </select>
        ${item.after}
      `;

      const audioBtn = document.createElement('button');
      audioBtn.className = 'audio-btn';
      audioBtn.title = 'Listen sentence';
      audioBtn.textContent = '🔊';
      audioBtn.onclick = () => speakSentence(idx);

      card.appendChild(sentenceText);
      card.appendChild(audioBtn);
      listEl.appendChild(card);
    });
  }

  function checkAnswers() {
    let correctCount = 0;

    sentencesData.forEach((item, idx) => {
      const card = document.getElementById(`card-${idx}`);
      const select = document.getElementById(`select-${idx}`);
      const userValue = select.value;

      card.classList.remove('correct-card', 'incorrect-card');

      if (userValue === item.correct) {
        correctCount++;
        card.classList.add('correct-card');
      } else {
        card.classList.add('incorrect-card');
      }
    });

    const resultText = document.getElementById('result-text');
    resultText.textContent = `Score: ${correctCount} / ${sentencesData.length}`;
    resultText.style.color = correctCount === sentencesData.length ? 'var(--correct)' : 'var(--text)';
  }

  function resetExercise() {
    renderExercise();
  }

  function speakSentence(idx) {
    const item = sentencesData[idx];
    const select = document.getElementById(`select-${idx}`);
    const chosenOption = select.value || item.correct;
    const fullSentence = `${item.before}${chosenOption}${item.after}`;

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(fullSentence);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  window.onload = renderExercise;
</script>

</body>
</html>
