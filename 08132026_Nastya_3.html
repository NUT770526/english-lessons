<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True or False: Personality & Actions</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --neon-green: #22c55e;
            --neon-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sentence-card {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .sentence-num {
            font-weight: bold;
            color: var(--accent-purple);
            margin-right: 6px;
        }

        .sentence-text {
            font-size: 1.05rem;
            line-height: 1.4;
            flex: 1;
        }

        .options-group {
            display: flex;
            gap: 8px;
            shrink: 0;
        }

        .btn-tf {
            background: #1e293b;
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-tf:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-tf.selected-true {
            background: var(--neon-green);
            color: #0f172a;
            border-color: var(--neon-green);
        }

        .btn-tf.selected-false {
            background: var(--neon-red);
            color: #ffffff;
            border-color: var(--neon-red);
        }

        /* CHECKING STATES */
        .sentence-card.correct {
            border-color: var(--neon-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .sentence-card.wrong {
            border-color: var(--neon-red);
            background: rgba(239, 68, 68, 0.05);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
        }

        .btn-check:hover {
            transform: scale(1.03);
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .sentence-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .options-group {
                width: 100%;
            }
            .btn-tf {
                flex: 1;
            }
            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>5. True or False</h1>
        <p>Read the sentences and choose TRUE or FALSE (Present Simple)</p>
    </div>

    <div class="exercise-list" id="exerciseList"></div>

    <div class="controls">
        <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        <div class="score-display" id="scoreDisplay"></div>
        <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔️</button>
    </div>
</div>

<script>
    const exerciseData = [
        {
            id: 1,
            text: "A generous person likes to help people and share things.",
            correct: "TRUE"
        },
        {
            id: 2,
            text: "A stubborn person changes his opinion very easily.",
            correct: "FALSE"
        },
        {
            id: 3,
            text: "A cheerful person is usually happy and smiles a lot.",
            correct: "TRUE"
        },
        {
            id: 4,
            text: "An unreliable person always remembers everything and comes on time.",
            correct: "FALSE"
        },
        {
            id: 5,
            text: "When you take after your mother, you have similar traits or behavior.",
            correct: "TRUE"
        },
        {
            id: 6,
            text: "A miserable person enjoys life and laughs every day.",
            correct: "FALSE"
        },
        {
            id: 7,
            text: "An easy-going person gets angry very quickly.",
            correct: "FALSE"
        },
        {
            id: 8,
            text: "If you describe a person, you talk about their look or character.",
            correct: "TRUE"
        },
        {
            id: 9,
            text: "Children must behave well at school.",
            correct: "TRUE"
        },
        {
            id: 10,
            text: "People who look like each other have different hair and faces.",
            correct: "FALSE"
        }
    ];

    let userSelections = {};

    function renderExercise() {
        const list = document.getElementById('exerciseList');
        list.innerHTML = '';

        exerciseData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.id = `card-${item.id}`;

            const selected = userSelections[item.id];

            const btnTrueClass = selected === 'TRUE' ? 'btn-tf selected-true' : 'btn-tf';
            const btnFalseClass = selected === 'FALSE' ? 'btn-tf selected-false' : 'btn-tf';

            card.innerHTML = `
                <div class="sentence-text">
                    <span class="sentence-num">${item.id}.</span> ${item.text}
                </div>
                <div class="options-group">
                    <button class="${btnTrueClass}" onclick="selectOption(${item.id}, 'TRUE')">TRUE</button>
                    <button class="${btnFalseClass}" onclick="selectOption(${item.id}, 'FALSE')">FALSE</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function selectOption(id, value) {
        userSelections[id] = value;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('correct', 'wrong');
        renderExercise();
    }

    function checkAnswers() {
        let correctCount = 0;

        exerciseData.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const selected = userSelections[item.id];

            card.classList.remove('correct', 'wrong');

            if (selected === item.correct) {
                card.classList.add('correct');
                correctCount++;
            } else if (selected) {
                card.classList.add('wrong');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        if (correctCount === exerciseData.length) {
            scoreDisplay.style.color = 'var(--neon-green)';
            scoreDisplay.textContent = `🎉 Excellent! ${correctCount} / ${exerciseData.length}`;
        } else {
            scoreDisplay.style.color = 'var(--accent-blue)';
            scoreDisplay.textContent = `Score: ${correctCount} / ${exerciseData.length}`;
        }
    }

    function resetExercise() {
        userSelections = {};
        document.getElementById('scoreDisplay').textContent = '';
        renderExercise();
    }

    window.onload = () => {
        renderExercise();
    };
</script>

</body>
</html>
