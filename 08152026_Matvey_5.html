<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer the questions</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .header-icon {
            font-size: 1.8rem;
        }

        .questions-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-card {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .question-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .question-num {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            font-weight: 700;
            font-size: 1rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.5;
            color: var(--text-main);
            flex: 1;
            padding-top: 3px;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
            transform: scale(1.08);
        }

        .answer-textarea {
            width: 100%;
            background: #1e293b;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            min-height: 70px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
        }

        .answer-textarea:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        /* CONTROLS */
        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }

        @media (max-width: 500px) {
            .question-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">
        <span class="header-icon">📣</span> Answer the questions
    </div>

    <div class="questions-list" id="questionsList"></div>

    <div class="controls">
        <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
    </div>
</div>

<script>
    const questionsData = [
        {
            id: 1,
            text: "Have you ever argued with a friend? What did you argue about?"
        },
        {
            id: 2,
            text: "Do you think shouting helps solve problems? Why or why not?"
        },
        {
            id: 3,
            text: "What makes you get angry with someone?"
        },
        {
            id: 4,
            text: "Why is it important to be nice to others?"
        }
    ];

    function playAudio(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.85;
            window.speechSynthesis.speak(utterance);
        } else {
            alert("Ваш браузер не поддерживает озвучку.");
        }
    }

    function renderQuestions() {
        const list = document.getElementById('questionsList');
        list.innerHTML = '';

        questionsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'question-card';

            card.innerHTML = `
                <div class="question-header">
                    <div class="question-num">${item.id}</div>
                    <div class="question-text">${item.text}</div>
                    <button class="audio-btn" onclick="playAudio('${item.text.replace(/'/g, "\\'")}')" title="Listen">🔊</button>
                </div>
                <textarea class="answer-textarea" id="answer-${item.id}" placeholder="Type your answer here..."></textarea>
            `;
            list.appendChild(card);
        });
    }

    function resetExercise() {
        questionsData.forEach(item => {
            const area = document.getElementById(`answer-${item.id}`);
            if (area) area.value = '';
        });
    }

    window.onload = () => {
        renderQuestions();
    };
</script>

</body>
</html>
