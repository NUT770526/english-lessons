<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Booster: Personality & Actions</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --neon-green: #22c55e;
            --neon-amber: #f59e0b;
            --neon-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.7rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-purple);
            margin: 30px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* FLASHCARDS GRID */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .flashcard {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .flashcard:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .word-en {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-blue);
        }

        .word-ua {
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .audio-icon {
            font-size: 0.8rem;
            color: var(--accent-purple);
            margin-top: 4px;
        }

        /* MATCHING GRID */
        .match-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .match-card {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .match-word {
            font-weight: bold;
            color: var(--accent-blue);
        }

        .match-select {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
        }

        .match-card.correct {
            border-color: var(--neon-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .match-card.wrong {
            border-color: var(--neon-red);
            background: rgba(239, 68, 68, 0.05);
        }

        /* QUIZ LIST */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quiz-card {
            background: #111827;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sentence-text {
            font-size: 0.98rem;
            font-weight: 500;
        }

        .input-full {
            background: #1e293b;
            color: var(--accent-blue);
            border: 1.5px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            outline: none;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .input-full:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .quiz-card.correct {
            border-color: var(--neon-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .quiz-card.wrong {
            border-color: var(--neon-red);
            background: rgba(239, 68, 68, 0.05);
        }

        .hint-text {
            display: none;
            font-size: 0.88rem;
            color: var(--neon-amber);
        }

        .quiz-card.wrong .hint-text {
            display: block;
        }

        /* CONTROLS */
        .controls {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
        }

        .btn-check:hover {
            transform: scale(1.03);
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Vocabulary Master: Personality & Actions</h1>
        <p>Listen, Match, and Fill in the Blanks</p>
    </div>

    <!-- SECTION 1: AUDIO FLASHCARDS -->
    <div class="section-title">1. Listen & Learn 🔊</div>
    <div class="cards-grid" id="flashcardsGrid"></div>

    <!-- SECTION 2: MATCH OPPOSITES & SYNONYMS -->
    <div class="section-title">2. Match the Opposites & Synonyms 🧩</div>
    <div class="match-grid" id="matchGrid"></div>

    <!-- SECTION 3: CONTEXT QUIZ -->
    <div class="section-title">3. Fill in the Sentences ✍️</div>
    <div class="quiz-list" id="quizList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay"></div>
        <button class="btn btn-check" onclick="checkAllAnswers()">Check All Answers ✔️</button>
    </div>
</div>

<script>
    const vocabulary = [
        { en: "hear", ua: "чути" },
        { en: "describe", ua: "описувати" },
        { en: "about", ua: "про" },
        { en: "behave", ua: "поводитися" },
        { en: "take after", ua: "бути схожим на" },
        { en: "look like", ua: "бути схожим (зовні)" },
        { en: "stubborn", ua: "упертий" },
        { en: "generous", ua: "щедрий" },
        { en: "unreliable", ua: "ненадійний" },
        { en: "cheerful", ua: "життєрадісний" },
        { en: "easy-going", ua: "спокійний, легкий" },
        { en: "miserable", ua: "нещасний" }
    ];

    const matchData = [
        { word: "cheerful", correct: "miserable", options: ["miserable", "generous", "stubborn", "easy-going"] },
        { word: "generous", correct: "greedy / selfish", options: ["easy-going", "greedy / selfish", "cheerful", "unreliable"] },
        { word: "stubborn", correct: "flexible", options: ["miserable", "cheerful", "flexible", "generous"] },
        { word: "easy-going", correct: "relaxed", options: ["relaxed", "miserable", "stubborn", "unreliable"] },
        { word: "unreliable", correct: "trustworthy", options: ["cheerful", "easy-going", "trustworthy", "flexible"] },
        { word: "look like", correct: "appear / resemble (face)", options: ["behave", "hear", "appear / resemble (face)", "take after"] }
    ];

    const quizQuestions = [
        { id: 1, sentence: "She is very _______; she always smiles and makes everyone happy.", answer: "cheerful" },
        { id: 2, sentence: "I _______ my father; we both love football and have the same sense of humor.", answer: "take after" },
        { id: 3, sentence: "Don't be so _______! Listen to my advice and change your mind.", answer: "stubborn" },
        { id: 4, sentence: "Who does he _______? He has green eyes just like his mother.", answer: "look like" },
        { id: 5, sentence: "He is _______; he always buys nice presents for his friends.", answer: "generous" },
        { id: 6, sentence: "Never rely on him! He forgets everything and is totally _______.", answer: "unreliable" },
        { id: 7, sentence: "Can you _______ your best friend in three words?", answer: "describe" },
        { id: 8, sentence: "Please _______ well at school today!", answer: "behave" }
    ];

    let userAnswers = {};

    function speakWord(word) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(word);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderFlashcards() {
        const grid = document.getElementById('flashcardsGrid');
        grid.innerHTML = '';
        vocabulary.forEach(item => {
            const card = document.createElement('div');
            card.className = 'flashcard';
            card.onclick = () => speakWord(item.en);
            card.innerHTML = `
                <div class="word-en">${item.en}</div>
                <div class="word-ua">${item.ua}</div>
                <div class="audio-icon">🔊 Listen</div>
            `;
            grid.appendChild(card);
        });
    }

    function renderMatchTask() {
        const grid = document.getElementById('matchGrid');
        grid.innerHTML = '';
        matchData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'match-card';
            card.id = `match-card-${index}`;

            let optionsHTML = `<option value="">Select match...</option>`;
            item.options.forEach(opt => {
                optionsHTML += `<option value="${opt}">${opt}</option>`;
            });

            card.innerHTML = `
                <span class="match-word">${item.word} ➔</span>
                <select class="match-select" id="match-select-${index}">${optionsHTML}</select>
            `;
            grid.appendChild(card);
        });
    }

    function renderQuiz() {
        const list = document.getElementById('quizList');
        list.innerHTML = '';
        quizQuestions.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `card-${q.id}`;
            card.innerHTML = `
                <div class="sentence-text"><strong>${index + 1}.</strong> ${q.sentence.replace('_______', '<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>')}</div>
                <input type="text" class="input-full" id="input-${q.id}" placeholder="Type word..." oninput="registerAnswer(${q.id}, this.value)" />
                <div class="hint-text">💡 Answer: ${q.answer}</div>
            `;
            list.appendChild(card);
        });
    }

    function registerAnswer(id, val) {
        userAnswers[id] = val;
        document.getElementById(`card-${id}`).classList.remove('correct', 'wrong');
    }

    function checkAllAnswers() {
        let total = 0;
        let correct = 0;

        // Check Match Task
        matchData.forEach((item, index) => {
            total++;
            const card = document.getElementById(`match-card-${index}`);
            const select = document.getElementById(`match-select-${index}`);
            card.classList.remove('correct', 'wrong');

            if (select.value === item.correct) {
                card.classList.add('correct');
                correct++;
            } else if (select.value !== "") {
                card.classList.add('wrong');
            }
        });

        // Check Quiz Task
        quizQuestions.forEach(q => {
            total++;
            const card = document.getElementById(`card-${q.id}`);
            const val = (userAnswers[q.id] || '').trim().toLowerCase();
            card.classList.remove('correct', 'wrong');

            if (val === q.answer.toLowerCase()) {
                card.classList.add('correct');
                correct++;
            } else if (val !== '') {
                card.classList.add('wrong');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Result: ${correct} / ${total}`;
        scoreDisplay.style.color = correct === total ? 'var(--neon-green)' : 'var(--accent-blue)';
    }

    window.onload = () => {
        renderFlashcards();
        renderMatchTask();
        renderQuiz();
    };
</script>

</body>
</html>
