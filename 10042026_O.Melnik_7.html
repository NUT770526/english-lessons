<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Correct mistakes where necessary</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #0f172a;
    --accent-color: #0284c7;
    --border-color: #e2e8f0;
    --tooltip-bg: #0f172a;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 820px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 36px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .header-icon {
    font-size: 1.8rem;
  }

  .title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text-color);
  }

  .hint-banner {
    background-color: #f0f9ff;
    border: 1px solid #bae6fd;
    color: #0369a1;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    margin-bottom: 28px;
  }

  /* Task List */
  .task-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 32px;
  }

  .task-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 10px;
    font-size: 1.1rem;
    font-weight: 600;
    line-height: 2.2;
    background: #ffffff;
    padding: 16px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
  }

  .num-badge {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background-color: #ff6b4a;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
    margin-right: 4px;
  }

  /* Input Fields */
  .answer-input {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #0f172a;
    background-color: #f8fafc;
    border: 2px solid #cbd5e1;
    border-radius: 8px;
    padding: 8px 14px;
    outline: none;
    width: 100%;
    max-width: 580px;
    transition: all 0.2s ease;
  }

  .answer-input:focus {
    border-color: var(--accent-color);
    background-color: #ffffff;
    box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
  }

  .answer-input.correct {
    border-color: #22c55e !important;
    background-color: #f0fdf4 !important;
    color: #15803d;
  }

  .answer-input.incorrect {
    border-color: #ef4444 !important;
    background-color: #fef2f2 !important;
    color: #b91c1c;
  }

  /* Speaker Button */
  .speaker-btn {
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
    cursor: pointer;
    margin-left: auto;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background-color: #e2e8f0;
  }

  /* Controls & Feedback */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin-top: 10px;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-check {
    background: #0284c7;
    color: #ffffff;
  }

  .btn-check:hover {
    background: #0369a1;
  }

  .btn-reset {
    background: #64748b;
    color: #ffffff;
  }

  .btn-reset:hover {
    background: #475569;
  }

  .feedback-msg {
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    margin-top: 16px;
    min-height: 28px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="header-icon">✏️</span>
    <h2 class="title">Correct mistakes where necessary</h2>
  </div>

  <div class="hint-banner">
    💡 Исправьте ошибки в предложениях. Если предложение написано правильно, оставьте его без изменений или напишите "correct".
  </div>

  <div class="task-list">
    <!-- Question 1 -->
    <div class="task-row">
      <span class="num-badge">1</span>
      <input type="text" class="answer-input" id="input-1" placeholder="Tom is more brutaller than Jack" autocomplete="off">
      <button class="speaker-btn" title="Озвучить верный вариант" onclick="speakRow(1)">🔊</button>
    </div>

    <!-- Question 2 -->
    <div class="task-row">
      <span class="num-badge">2</span>
      <input type="text" class="answer-input" id="input-2" placeholder="Sonia is prettier better Olia" autocomplete="off">
      <button class="speaker-btn" title="Озвучить верный вариант" onclick="speakRow(2)">🔊</button>
    </div>

    <!-- Question 3 -->
    <div class="task-row">
      <span class="num-badge">3</span>
      <input type="text" class="answer-input" id="input-3" placeholder="Pistachio ice-cream is most delicious for me" autocomplete="off">
      <button class="speaker-btn" title="Озвучить верный вариант" onclick="speakRow(3)">🔊</button>
    </div>

    <!-- Question 4 -->
    <div class="task-row">
      <span class="num-badge">4</span>
      <input type="text" class="answer-input" id="input-4" placeholder="She is the tallest girl from all" autocomplete="off">
      <button class="speaker-btn" title="Озвучить верный вариант" onclick="speakRow(4)">🔊</button>
    </div>

    <!-- Question 5 -->
    <div class="task-row">
      <span class="num-badge">5</span>
      <input type="text" class="answer-input" id="input-5" placeholder="That was the best day in my life" autocomplete="off">
      <button class="speaker-btn" title="Озвучить верный вариант" onclick="speakRow(5)">🔊</button>
    </div>

    <!-- Question 6 -->
    <div class="task-row">
      <span class="num-badge">6</span>
      <input type="text" class="answer-input" id="input-6" placeholder="Gucci purses are expensivier in this shop" autocomplete="off">
      <button class="speaker-btn" title="Озвучить верный вариант" onclick="speakRow(6)">🔊</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-check" onclick="checkAnswers()">Проверить 🎯</button>
    <button class="btn btn-reset" onclick="resetExercise()">Сбросить 🔄</button>
  </div>

  <div class="feedback-msg" id="feedback"></div>
</div>

<script>
  const correctAnswers = {
    'input-1': ['tom is more brutal than jack', 'tom is more brutal than jack.', 'tom is brutaller than jack', 'tom is brutaller than jack.'],
    'input-2': ['sonia is prettier than olia', 'sonia is prettier than olia.', 'sonia is better than olia', 'sonia is better than olia.'],
    'input-3': ['pistachio ice-cream is the most delicious for me', 'pistachio ice-cream is the most delicious for me.', 'pistachio ice cream is the most delicious for me', 'pistachio ice cream is the most delicious for me.'],
    'input-4': ['she is the tallest girl of all', 'she is the tallest girl of all.', 'she is the tallest girl in all', 'she is the tallest girl of all.'],
    'input-5': ['that was the best day in my life', 'that was the best day in my life.', 'correct', 'ok', 'no mistake'],
    'input-6': ['gucci purses are the most expensive in this shop', 'gucci purses are the most expensive in this shop.', 'gucci purses are more expensive in this shop', 'gucci purses are more expensive in this shop.']
  };

  const fullSentences = {
    1: "Tom is more brutal than Jack.",
    2: "Sonia is prettier than Olia.",
    3: "Pistachio ice-cream is the most delicious for me.",
    4: "She is the tallest girl of all.",
    5: "That was the best day in my life.",
    6: "Gucci purses are the most expensive in this shop."
  };

  function speakText(text) {
    if (!text) return;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function speakRow(rowNum) {
    speakText(fullSentences[rowNum]);
  }

  function checkAnswers() {
    let allCorrect = true;
    let hasEmpty = false;

    Object.keys(correctAnswers).forEach(id => {
      const input = document.getElementById(id);
      const userVal = input.value.trim().toLowerCase().replace(/\s+/g, ' ');

      input.classList.remove('correct', 'incorrect');

      if (userVal === '') {
        hasEmpty = true;
        allCorrect = false;
      } else if (correctAnswers[id].includes(userVal)) {
        input.classList.add('correct');
      } else {
        input.classList.add('incorrect');
        allCorrect = false;
      }
    });

    const feedback = document.getElementById('feedback');
    if (hasEmpty) {
      feedback.style.color = '#f59e0b';
      feedback.textContent = 'Заполните все поля перед проверкой! ✏️';
    } else if (allCorrect) {
      feedback.style.color = '#22c55e';
      feedback.textContent = 'Отлично! Все ошибки исправлены верно! 🎉';
    } else {
      feedback.style.color = '#ef4444';
      feedback.textContent = 'Есть ошибки. Проверьте поля, выделенные красным цветом! ❌';
    }
  }

  function resetExercise() {
    Object.keys(correctAnswers).forEach(id => {
      const input = document.getElementById(id);
      if (input) {
        input.value = '';
        input.classList.remove('correct', 'incorrect');
      }
    });
    document.getElementById('feedback').textContent = '';
  }
</script>

</body>
</html>
