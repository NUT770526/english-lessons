<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose the Right Word (Present Simple)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --neon-green: #22c55e;
            --neon-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.6rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sentence-card {
            background: #111827;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .sentence-num {
            font-weight: bold;
            color: var(--accent-purple);
            margin-right: 6px;
        }

        .sentence-text {
            font-size: 1.05rem;
            line-height: 1.5;
        }

        .options-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-option {
            background: #1e293b;
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.98rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        .btn-option.selected {
            background: var(--accent-blue);
            color: #0f172a;
            border-color: var(--accent-blue);
        }

        /* CHECKING STATES */
        .sentence-card.correct {
            border-color: var(--neon-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .sentence-card.wrong {
            border-color: var(--neon-red);
            background: rgba(239, 68, 68, 0.05);
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
        }

        .btn-check:hover {
            transform: scale(1.03);
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: bold;
        }

        @media (max-width: 500px) {
            .controls {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>2. Choose the correct word</h1>
        <p>Выбери одно правильное слово из двух (Present Simple)</p>
    </div>

    <div class="exercise-list" id="exerciseList"></div>

    <div class="controls">
        <button class="btn btn-reset" onclick="resetExercise()">Сбросить 🔄</button>
        <div class="score-display" id="scoreDisplay"></div>
        <button class="btn btn-check" onclick="checkAnswers()">Проверить ✔️</button>
    </div>
</div>

<script>
    const exerciseData = [
        {
            id: 1,
            textBefore: "I can",
            textAfter: "music from the street.",
            options: ["hear", "describe"],
            correct: "hear"
        },
        {
            id: 2,
            textBefore: "She smiles a lot today. She is very",
            textAfter: ".",
            options: ["cheerful", "miserable"],
            correct: "cheerful"
        },
        {
            id: 3,
            textBefore: "He",
            textAfter: "his father because they both love sports.",
            options: ["takes after", "hears"],
            correct: "takes after"
        },
        {
            id: 4,
            textBefore: "Can you",
            textAfter: "your best friend to me?",
            options: ["describe", "behave"],
            correct: "describe"
        },
        {
            id: 5,
            textBefore: "Tom is very",
            textAfter: ". He always gives gifts to his friends.",
            options: ["generous", "stubborn"],
            correct: "generous"
        },
        {
            id: 6,
            textBefore: "She is",
            textAfter: ". She often forgets her homework.",
            options: ["unreliable", "easy-going"],
            correct: "unreliable"
        },
        {
            id: 7,
            textBefore: "Don't be so",
            textAfter: "! Listen to your teacher.",
            options: ["stubborn", "cheerful"],
            correct: "stubborn"
        },
        {
            id: 8,
            textBefore: "They",
            textAfter: "their mother. They have green eyes.",
            options: ["look like", "behave"],
            correct: "look like"
        },
        {
            id: 9,
            textBefore: "My brother never gets angry. He is very",
            textAfter: ".",
            options: ["easy-going", "miserable"],
            correct: "easy-going"
        },
        {
            id: 10,
            textBefore: "Good students always",
            textAfter: "well at school.",
            options: ["behave", "hear"],
            correct: "behave"
        }
    ];

    let userSelections = {};

    function renderExercise() {
        const list = document.getElementById('exerciseList');
        list.innerHTML = '';

        exerciseData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.id = `card-${item.id}`;

            const selected = userSelections[item.id];

            const btn1Class = selected === item.options[0] ? 'btn-option selected' : 'btn-option';
            const btn2Class = selected === item.options[1] ? 'btn-option selected' : 'btn-option';

            card.innerHTML = `
                <div class="sentence-text">
                    <span class="sentence-num">${item.id}.</span>
                    ${item.textBefore} <strong>[ ??? ]</strong> ${item.textAfter}
                </div>
                <div class="options-group">
                    <button class="${btn1Class}" onclick="selectOption(${item.id}, '${item.options[0]}')">${item.options[0]}</button>
                    <button class="${btn2Class}" onclick="selectOption(${item.id}, '${item.options[1]}')">${item.options[1]}</button>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function selectOption(id, value) {
        userSelections[id] = value;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('correct', 'wrong');
        renderExercise();
    }

    function checkAnswers() {
        let correctCount = 0;

        exerciseData.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const selected = userSelections[item.id];

            card.classList.remove('correct', 'wrong');

            if (selected === item.correct) {
                card.classList.add('correct');
                correctCount++;
            } else if (selected) {
                card.classList.add('wrong');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        if (correctCount === exerciseData.length) {
            scoreDisplay.style.color = 'var(--neon-green)';
            scoreDisplay.textContent = `🎉 Excellent! ${correctCount} / ${exerciseData.length}`;
        } else {
            scoreDisplay.style.color = 'var(--accent-blue)';
            scoreDisplay.textContent = `Score: ${correctCount} / ${exerciseData.length}`;
        }
    }

    function resetExercise() {
        userSelections = {};
        document.getElementById('scoreDisplay').textContent = '';
        renderExercise();
    }

    window.onload = () => {
        renderExercise();
    };
</script>

</body>
</html>
