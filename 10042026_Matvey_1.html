<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1. З’єднай фразу з її значенням</title>
<style>
  :root {
    --bg-color: #f8fafc;
    --card-bg: #ffffff;
    --text-color: #0f172a;
    --accent-color: #7c3aed;
    --border-color: #e2e8f0;
    --selected-bg: #ede9fe;
    --selected-border: #7c3aed;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
    line-height: 1.6;
  }

  .container {
    max-width: 880px;
    width: 100%;
    background: var(--card-bg);
    border-radius: 20px;
    padding: 36px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .header-icon {
    font-size: 2rem;
  }

  .title {
    font-size: 1.5rem;
    font-weight: 700;
    color: #6b21a8;
  }

  .instructions {
    background: #f1f5f9;
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    color: #475569;
    margin-bottom: 24px;
    border-left: 4px solid var(--accent-color);
  }

  .matching-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }

  @media (max-width: 640px) {
    .matching-grid {
      grid-template-columns: 1fr;
    }
  }

  .column {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .column-title {
    font-weight: 700;
    font-size: 1.1rem;
    color: #334155;
    margin-bottom: 8px;
    text-align: center;
  }

  .item-card {
    position: relative;
    background: #ffffff;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 1rem;
    font-weight: 600;
    color: #1e293b;
    cursor: pointer;
    transition: all 0.2s ease;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 60px;
  }

  .item-card:hover {
    border-color: var(--accent-color);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.1);
  }

  .item-card.selected {
    background-color: var(--selected-bg);
    border-color: var(--selected-border);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
  }

  .item-card.matched {
    background-color: #f1f5f9;
    border-color: #cbd5e1;
    color: #64748b;
    cursor: default;
    transform: none;
    box-shadow: none;
  }

  .item-card.correct {
    background-color: #f0fdf4 !important;
    border-color: #22c55e !important;
    color: #15803d !important;
  }

  .item-card.incorrect {
    background-color: #fef2f2 !important;
    border-color: #ef4444 !important;
    color: #b91c1c !important;
  }

  .badge {
    font-size: 0.85rem;
    background: #7c3aed;
    color: #ffffff;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 700;
  }

  /* Tooltip for Phonetics */
  .tooltip {
    visibility: hidden;
    opacity: 0;
    background-color: #0f172a;
    color: #ffffff;
    text-align: center;
    border-radius: 8px;
    padding: 6px 10px;
    position: absolute;
    z-index: 10;
    bottom: 110%;
    left: 50%;
    transform: translateX(-50%) translateY(4px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
    box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    font-weight: normal;
    font-size: 0.85rem;
    pointer-events: none;
    white-space: nowrap;
  }

  .tooltip::after {
    content: "";
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #0f172a transparent transparent transparent;
  }

  .item-card:hover .tooltip {
    visibility: visible;
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .tooltip-phonetic {
    color: #c084fc;
    font-family: Arial, sans-serif;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
    align-items: center;
    margin-top: 20px;
  }

  .btn {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 28px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-check {
    background: #7c3aed;
    color: #ffffff;
  }

  .btn-check:hover {
    background: #6d28d9;
  }

  .btn-reset {
    background: #64748b;
    color: #ffffff;
  }

  .btn-reset:hover {
    background: #475569;
  }

  .feedback-msg {
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    margin-top: 16px;
    min-height: 28px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="header-icon">🔗</span>
    <h2 class="title">1. З’єднай фразу з її значенням</h2>
  </div>

  <div class="instructions">
    💡 <b>Інструкція:</b> Натисніть на английскую фразу слева, а затем на соответствующий перевод справа. Наведите на английскую фразу, чтобы услышать её произношение и увидеть транскрипцию!
  </div>

  <div class="matching-grid">
    <div class="column" id="english-col">
      <div class="column-title">English Phrase</div>
    </div>
    <div class="column" id="ukrainian-col">
      <div class="column-title">Український переклад</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-check" onclick="checkAnswers()">Check 🎯</button>
    <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
  </div>

  <div class="feedback-msg" id="feedback"></div>
</div>

<script>
  const pairsData = [
    { id: 1, en: "I’d love to...", ipa: "/aɪd lʌv tuː/", uk: "Я дуже хотів би / хотіла б...", letter: "C" },
    { id: 2, en: "I can’t stand...", ipa: "/aɪ kɑːnt stænd/", uk: "Я терпіти не можу...", letter: "D" },
    { id: 3, en: "I quite like...", ipa: "/aɪ kwaɪt laɪk/", uk: "Мені доволі подобається...", letter: "E" },
    { id: 4, en: "I’d prefer not to...", ipa: "/aɪd prɪˈfɜː nɒt tuː/", uk: "Я волів би / воліла б не...", letter: "A" },
    { id: 5, en: "I enjoy...", ipa: "/aɪ ɪnˈdʒɔɪ/", uk: "Мені подобається..., я отримую від цього задоволення.", letter: "B" },
    { id: 6, en: "I’d like to...", ipa: "/aɪd laɪk tuː/", uk: "Я хотів би / хотіла б...", letter: "F" }
  ];

  let selectedEn = null;
  let selectedUk = null;
  let matches = {}; // { enId: ukId }

  function initExercise() {
    const enCol = document.getElementById('english-col');
    const ukCol = document.getElementById('ukrainian-col');

    // Shuffle Ukrainian options
    const shuffledUk = [...pairsData].sort(() => Math.random() - 0.5);

    pairsData.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.id = item.id;
      card.innerHTML = `
        <span><b>${index + 1}.</b> ${item.en}</span>
        <span class="tooltip"><span class="tooltip-phonetic">${item.ipa}</span></span>
      `;
      card.onmouseenter = () => speakText(item.en);
      card.onclick = () => selectEnItem(card, item.id);
      enCol.appendChild(card);
    });

    shuffledUk.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'item-card';
      card.dataset.id = item.id;
      card.innerHTML = `<span><b>${item.letter}.</b> ${item.uk}</span>`;
      card.onclick = () => selectUkItem(card, item.id);
      ukCol.appendChild(card);
    });
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text.replace('...', ''));
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function selectEnItem(card, id) {
    if (card.classList.contains('matched')) return;
    document.querySelectorAll('#english-col .item-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedEn = { card, id };
    tryPair();
  }

  function selectUkItem(card, id) {
    if (card.classList.contains('matched')) return;
    document.querySelectorAll('#ukrainian-col .item-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedUk = { card, id };
    tryPair();
  }

  function tryPair() {
    if (selectedEn && selectedUk) {
      matches[selectedEn.id] = selectedUk.id;

      selectedEn.card.classList.remove('selected');
      selectedUk.card.classList.remove('selected');

      selectedEn.card.classList.add('matched');
      selectedUk.card.classList.add('matched');

      // Visual badge pair indicator
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = `✓`;
      selectedEn.card.appendChild(badge);

      selectedEn = null;
      selectedUk = null;
    }
  }

  function checkAnswers() {
    const total = pairsData.length;
    const matchKeys = Object.keys(matches);

    if (matchKeys.length < total) {
      const feedback = document.getElementById('feedback');
      feedback.style.color = '#f59e0b';
      feedback.textContent = 'З’єднайте всі пари перед перевіркою! ✏️';
      return;
    }

    let correctCount = 0;

    pairsData.forEach(item => {
      const enCard = document.querySelector(`#english-col .item-card[data-id="${item.id}"]`);
      const userUkId = matches[item.id];
      const ukCard = document.querySelector(`#ukrainian-col .item-card[data-id="${userUkId}"]`);

      enCard.classList.remove('correct', 'incorrect');
      if (ukCard) ukCard.classList.remove('correct', 'incorrect');

      if (parseInt(userUkId) === item.id) {
        correctCount++;
        enCard.classList.add('correct');
        if (ukCard) ukCard.classList.add('correct');
      } else {
        enCard.classList.add('incorrect');
        if (ukCard) ukCard.classList.add('incorrect');
      }
    });

    const feedback = document.getElementById('feedback');
    if (correctCount === total) {
      feedback.style.color = '#22c55e';
      feedback.textContent = 'Чудово! Усі фразы з’єднано правильно! 🎉';
    } else {
      feedback.style.color = '#ef4444';
      feedback.textContent = `Правильно з'єднано ${correctCount} з ${total}. Перевірте виділені червним пари! ❌`;
    }
  }

  function resetExercise() {
    matches = {};
    selectedEn = null;
    selectedUk = null;

    document.getElementById('english-col').innerHTML = '<div class="column-title">English Phrase</div>';
    document.getElementById('ukrainian-col').innerHTML = '<div class="column-title">Український переклад</div>';
    document.getElementById('feedback').textContent = '';

    initExercise();
  }

  window.onload = initExercise;
</script>

</body>
</html>
