<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. Find and Correct the Mistake</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .sentences-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .sentence-card {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .sentence-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .sentence-card.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .prompt-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--accent-red);
        }

        .num-badge {
            background: rgba(248, 113, 113, 0.15);
            color: var(--accent-red);
            font-weight: 700;
            font-size: 0.95rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .question-input {
            flex: 1;
            background: #1e293b;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .question-input:focus {
            border-color: var(--accent-blue);
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--accent-green);
            display: none;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">6. Find and correct the mistake</div>
    <div class="header-subtitle">Знайди та виправ помилку. Перепиши речення правильно.</div>

    <div class="sentences-list" id="mistakesList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Score: - / 15</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Reset 🔄</button>
        </div>
    </div>
</div>

<script>
    const mistakesData = [
        { id: 1, wrong: "She believe in people.", correct: "She believes in people." },
        { id: 2, wrong: "A good friend is a good listener, but he don't always agree with you.", correct: "A good friend is a good listener, but he doesn't always agree with you." },
        { id: 3, wrong: "Does your brother works well in a team?", correct: "Does your brother work well in a team?" },
        { id: 4, wrong: "My sister have a passion for music.", correct: "My sister has a passion for music." },
        { id: 5, wrong: "He isn't like helping other people.", correct: "He doesn't like helping other people." },
        { id: 6, wrong: "Are your teacher encouraging?", correct: "Is your teacher encouraging?" },
        { id: 7, wrong: "Kate is work hard every day.", correct: "Kate works hard every day." },
        { id: 8, wrong: "Does Anna is a role model for you?", correct: "Is Anna a role model for you?" },
        { id: 9, wrong: "My best friend is cheerful, but she don't like loud places.", correct: "My best friend is cheerful, but she doesn't like loud places." },
        { id: 10, wrong: "They doesn't need useful skills for this task.", correct: "They don't need useful skills for this task." },
        { id: 11, wrong: "Do hard work brings success?", correct: "Does hard work bring success?" },
        { id: 12, wrong: "A good employee aren't organised.", correct: "A good employee isn't organised." },
        { id: 13, wrong: "She respect her colleagues and works well in a team.", correct: "She respects her colleagues and works well in a team." },
        { id: 14, wrong: "Do he have good communication skills?", correct: "Does he have good communication skills?" },
        { id: 15, wrong: "This English lesson don't very useful.", correct: "This English lesson isn't very useful." }
    ];

    function renderMistakes() {
        const list = document.getElementById('mistakesList');
        list.innerHTML = '';

        mistakesData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.id = `card-${item.id}`;

            card.innerHTML = `
                <div class="prompt-row">
                    <span class="num-badge">${item.id}</span>
                    <span>${item.wrong}</span>
                </div>
                <div class="input-row">
                    <input type="text" class="question-input" id="input-${item.id}" placeholder="Type correct sentence...">
                </div>
                <div class="hint-text" id="hint-${item.id}">Correct: ${item.correct}</div>
            `;
            list.appendChild(card);
        });
    }

    function cleanString(str) {
        return str.trim().toLowerCase().replace(/[?.,]/g, '').replace(/\s+/g, ' ');
    }

    function checkAnswers() {
        let correctCount = 0;

        mistakesData.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const input = document.getElementById(`input-${item.id}`);
            const hint = document.getElementById(`hint-${item.id}`);

            const userText = cleanString(input.value);
            const targetText = cleanString(item.correct);

            card.classList.remove('correct', 'incorrect');

            if (userText === targetText) {
                card.classList.add('correct');
                hint.style.display = 'none';
                correctCount++;
            } else {
                card.classList.add('incorrect');
                hint.style.display = 'block';
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Score: ${correctCount} / ${mistakesData.length}`;
        scoreDisplay.style.color = correctCount === mistakesData.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        mistakesData.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const input = document.getElementById(`input-${item.id}`);
            const hint = document.getElementById(`hint-${item.id}`);

            card.classList.remove('correct', 'incorrect');
            input.value = '';
            hint.style.display = 'none';
        });

        document.getElementById('scoreDisplay').textContent = `Score: - / ${mistakesData.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = renderMistakes;
</script>

</body>
</html>
