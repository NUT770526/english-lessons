<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise 2. Choose the Correct Word 🎯</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 820px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .quiz-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 16px 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .sentence-text {
    font-size: 1.05rem;
    font-weight: 600;
    color: #f1f5f9;
    line-height: 1.5;
  }

  .options-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .opt-btn {
    background: #1e293b;
    border: 2px solid var(--border);
    color: #f8fafc;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .opt-btn:hover {
    border-color: var(--accent);
    background: #334155;
  }

  .opt-btn.selected {
    border-color: var(--accent);
    background: #0284c7;
    color: #ffffff;
  }

  .opt-btn.correct-btn {
    border-color: var(--correct);
    background: #064e3b;
    color: #a7f3d0;
  }

  .opt-btn.wrong-btn {
    border-color: var(--wrong);
    background: #7f1d1d;
    color: #fecaca;
  }

  .speaker-icon {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #ffffff;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .speaker-icon:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Exercise 2. Choose the Correct Word 🎯</h2>
      <div class="subtitle">Обери правильне слово або словосполучення. Прослухай вимова слів 🔊</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 12</div>
  </div>

  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const questions = [
    {
      id: 1,
      num: 1,
      part1: "Please explain",
      part2: "why you want to join the club.",
      options: ["brief", "briefly"],
      correct: "briefly"
    },
    {
      id: 2,
      num: 2,
      part1: "He sent me a",
      part2: "message.",
      options: ["brief", "briefly"],
      correct: "brief"
    },
    {
      id: 3,
      num: 3,
      part1: "<i>Isn't</i> is a",
      part2: "of <i>is not</i>.",
      options: ["contraction", "custom"],
      correct: "contraction"
    },
    {
      id: 4,
      num: 4,
      part1: "Read and",
      part2: "your letter before sending it.",
      options: ["edit", "apply"],
      correct: "edit"
    },
    {
      id: 5,
      num: 5,
      part1: "This is only the first",
      part2: "of my email.",
      options: ["draft", "introduction"],
      correct: "draft"
    },
    {
      id: 6,
      num: 6,
      part1: "People light candles to",
      part2: "their ancestors.",
      options: ["commemorate", "celebrate"],
      correct: "commemorate"
    },
    {
      id: 7,
      num: 7,
      part1: "These traditions and",
      part2: "are hundreds of years old.",
      options: ["customs", "contractions"],
      correct: "customs"
    },
    {
      id: 8,
      num: 8,
      part1: "The colourful",
      part2: "lit up the street.",
      options: ["lanterns", "literature"],
      correct: "lanterns"
    },
    {
      id: 9,
      num: 9,
      part1: "A small mistake caused a serious",
      part2: ".",
      options: ["misunderstanding", "greeting"],
      correct: "misunderstanding"
    },
    {
      id: 10,
      num: 10,
      part1: "You need to",
      part2: "for the summer programme online.",
      options: ["apply", "edit"],
      correct: "apply"
    },
    {
      id: 11,
      num: 11,
      part1: "The teacher wrote a",
      part2: "for the student.",
      options: ["reference letter", "final message"],
      correct: "reference letter"
    },
    {
      id: 12,
      num: 12,
      part1: "The festival is",
      part2: "in October.",
      options: ["to be celebrated", "to apply"],
      correct: "to be celebrated"
    }
  ];

  let selectedAnswers = {};

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach(q => {
      const card = document.createElement('div');
      card.className = 'quiz-card';

      const optionsHtml = q.options.map(opt => `
        <button class="opt-btn" id="opt-${q.id}-${opt.replace(/\s+/g, '-')}" onclick="selectOption(${q.id}, '${opt}')">
          <span>${opt}</span>
          <span class="speaker-icon" onclick="event.stopPropagation(); speakWord('${opt}')" title="Listen">🔊</span>
        </button>
      `).join('');

      card.innerHTML = `
        <div class="sentence-text">
          <b>${q.num}.</b> ${q.part1} <u>_______</u> ${q.part2}
        </div>
        <div class="options-group">
          ${optionsHtml}
        </div>
      `;

      container.appendChild(card);
    });
  }

  function selectOption(qId, option) {
    selectedAnswers[qId] = option;
    const q = questions.find(item => item.id === qId);

    q.options.forEach(opt => {
      const btn = document.getElementById(`opt-${qId}-${opt.replace(/\s+/g, '-')}`);
      if (btn) {
        btn.classList.remove('selected', 'correct-btn', 'wrong-btn');
        if (opt === option) {
          btn.classList.add('selected');
        }
      }
    });
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const userChoice = selectedAnswers[q.id];

      q.options.forEach(opt => {
        const btn = document.getElementById(`opt-${q.id}-${opt.replace(/\s+/g, '-')}`);
        if (!btn) return;

        btn.classList.remove('selected', 'correct-btn', 'wrong-btn');

        if (opt === q.correct) {
          btn.classList.add('correct-btn');
        }

        if (userChoice === opt && userChoice !== q.correct) {
          btn.classList.add('wrong-btn');
        }
      });

      if (userChoice === q.correct) {
        score++;
      }
    });

    document.getElementById('score').innerText = score;
  }

  function speakWord(word) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function resetGame() {
    selectedAnswers = {};
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = renderQuiz;
</script>

</body>
</html>
