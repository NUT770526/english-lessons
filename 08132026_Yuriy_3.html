<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business English: Choose the Correct Option</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --neon-green: #22c55e;
            --neon-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 820px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* STATEMENTS LIST */
        .quiz-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .quiz-card {
            background: #111827;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            transition: all 0.2s ease;
        }

        .quiz-card:hover {
            border-color: var(--accent-blue);
        }

        .sentence-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-main);
            flex: 1;
        }

        .option-select {
            background: #1e293b;
            color: var(--accent-blue);
            border: 2px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        .option-select:focus {
            border-color: var(--accent-blue);
        }

        .quiz-card.correct {
            border-color: var(--neon-green);
            background: rgba(34, 197, 94, 0.05);
        }

        .quiz-card.wrong {
            border-color: var(--neon-red);
            background: rgba(239, 68, 68, 0.05);
        }

        /* CONTROLS */
        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 26px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-check {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #ffffff;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.3);
        }

        .btn-check:hover {
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }

        .score-display {
            font-size: 1.15rem;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .quiz-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .option-select {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>💼 Business Routine Trainer</h1>
        <p>Exercise: Choose between Action Verbs and "To Be"</p>
    </div>

    <div class="quiz-list" id="quizList"></div>

    <div class="controls">
        <button class="btn btn-reset" onclick="resetGame()">Reset 🔄</button>
        <div class="score-display" id="scoreDisplay"></div>
        <button class="btn btn-check" onclick="checkAnswers()">Check Answers ✔️</button>
    </div>
</div>

<script>
    const questions = [
        { id: 1, prefix: "She ", options: ["is", "checks"], suffix: " emails every morning.", correct: "checks" },
        { id: 2, prefix: "They ", options: ["are", "answers"], suffix: " emails quickly when clients write.", correct: "answers" },
        { id: 3, prefix: "I ", options: ["am", "make"], suffix: " a phone call to our partner right now.", correct: "make" },
        { id: 4, prefix: "The manager ", options: ["is", "calls"], suffix: " the client to discuss details.", correct: "calls" },
        { id: 5, prefix: "We ", options: ["are", "meet"], suffix: " a client at the cafe every Tuesday.", correct: "meet" },
        { id: 6, prefix: "He ", options: ["is", "prepares"], suffix: " a report for the weekly meeting.", correct: "prepares" },
        { id: 7, prefix: "She ", options: ["is", "writes"], suffix: " a report every Friday afternoon.", correct: "writes" },
        { id: 8, prefix: "They ", options: ["are", "sends"], suffix: " send invoices at the end of the month.", correct: "sends" }, // Note: rendered cleanly below
        { id: 9, prefix: "The accountant ", options: ["is", "checks"], suffix: " invoices carefully.", correct: "checks" },
        { id: 10, prefix: "We ", options: ["are", "attend"], suffix: " a meeting every Monday morning.", correct: "attend" },
        { id: 11, prefix: "He ", options: ["is", "joins"], suffix: " an online meeting at 10:00.", correct: "joins" },
        { id: 12, prefix: "I ", options: ["am", "update"], suffix: " a spreadsheet every Friday.", correct: "update" },
        { id: 13, prefix: "They ", options: ["are", "talk"], suffix: " to customers with a smile.", correct: "talk" },
        { id: 14, prefix: "Our team ", options: ["is", "solves"], suffix: " a problem very quickly.", correct: "solves" },
        { id: 15, prefix: "They ", options: ["are", "finish"], suffix: " work at 5:00 PM.", correct: "finish" }
    ];

    // Cleaned up dataset for exact grammar:
    const dataset = [
        { id: 1, textPre: "She ", options: ["is", "checks"], textPost: " emails every morning.", correct: "checks" },
        { id: 2, textPre: "They ", options: ["are", "answer"], textPost: " emails quickly.", correct: "answer" },
        { id: 3, textPre: "I ", options: ["am", "make"], textPost: " a phone call to our partner.", correct: "make" },
        { id: 4, textPre: "The manager ", options: ["is", "calls"], textPost: " the client.", correct: "calls" },
        { id: 5, textPre: "We ", options: ["are", "meet"], textPost: " a client every Tuesday.", correct: "meet" },
        { id: 6, textPre: "He ", options: ["is", "prepares"], textPost: " a report for the boss.", correct: "prepares" },
        { id: 7, textPre: "She ", options: ["is", "writes"], textPost: " a report every Friday.", correct: "writes" },
        { id: 8, textPre: "They ", options: ["are", "send"], textPost: " an invoice every month.", correct: "send" },
        { id: 9, textPre: "The accountant ", options: ["is", "checks"], textPost: " invoices carefully.", correct: "checks" },
        { id: 10, textPre: "We ", options: ["are", "attend"], textPost: " a meeting every Monday.", correct: "attend" },
        { id: 11, textPre: "He ", options: ["is", "joins"], textPost: " an online meeting at 10:00.", correct: "joins" },
        { id: 12, textPre: "I ", options: ["am", "update"], textPost: " a spreadsheet every Friday.", correct: "update" },
        { id: 13, textPre: "They ", options: ["are", "talk"], textPost: " to customers every day.", correct: "talk" },
        { id: 14, textPre: "Our team ", options: ["is", "solves"], textPost: " a difficult problem.", correct: "solves" },
        { id: 15, textPre: "They ", options: ["are", "finish"], textPost: " work at 5:00 PM.", correct: "finish" }
    ];

    let userSelections = {};

    function renderQuiz() {
        const container = document.getElementById('quizList');
        container.innerHTML = '';

        dataset.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'quiz-card';
            card.id = `card-${item.id}`;

            const currentVal = userSelections[item.id] || '';

            card.innerHTML = `
                <div class="sentence-text">
                    <strong>${index + 1}.</strong> ${item.textPre}
                    <select class="option-select" id="select-${item.id}" onchange="selectOption(${item.id}, this.value)">
                        <option value="" ${currentVal === '' ? 'selected' : ''}>-- choose --</option>
                        <option value="${item.options[0]}" ${currentVal === item.options[0] ? 'selected' : ''}>${item.options[0]}</option>
                        <option value="${item.options[1]}" ${currentVal === item.options[1] ? 'selected' : ''}>${item.options[1]}</option>
                    </select>
                    ${item.textPost}
                </div>
            `;

            container.appendChild(card);
        });
    }

    function selectOption(id, val) {
        userSelections[id] = val;
        const card = document.getElementById(`card-${id}`);
        card.classList.remove('correct', 'wrong');
    }

    function checkAnswers() {
        let correctCount = 0;

        dataset.forEach(item => {
            const card = document.getElementById(`card-${item.id}`);
            const selected = userSelections[item.id];

            card.classList.remove('correct', 'wrong');

            if (selected === item.correct) {
                card.classList.add('correct');
                correctCount++;
            } else if (selected) {
                card.classList.add('wrong');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        if (correctCount === dataset.length) {
            scoreDisplay.style.color = 'var(--neon-green)';
            scoreDisplay.textContent = `🎉 PERFECT! ${correctCount} / ${dataset.length}`;
        } else {
            scoreDisplay.style.color = 'var(--accent-blue)';
            scoreDisplay.textContent = `Score: ${correctCount} / ${dataset.length}`;
        }
    }

    function resetGame() {
        userSelections = {};
        document.getElementById('scoreDisplay').textContent = '';
        renderQuiz();
    }

    window.onload = renderQuiz;
</script>

</body>
</html>
