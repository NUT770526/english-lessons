<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Make the Sentences Negative Practice 🚫</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --accent: #38bdf8;
    --border: #334155;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    margin: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    max-width: 850px;
    width: 100%;
    background: var(--card);
    padding: 32px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    border: 1px solid var(--border);
  }

  .header {
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  h2 {
    margin: 0 0 6px 0;
    font-size: 1.5rem;
    color: #38bdf8;
    font-weight: 800;
  }

  .subtitle {
    font-size: 0.95rem;
    color: #94a3b8;
  }

  .section-title {
    font-size: 1rem;
    color: #38bdf8;
    font-weight: 700;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .vocab-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .vocab-card {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 12px 14px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .vocab-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .vocab-word {
    font-weight: 700;
    font-size: 0.95rem;
    color: #f1f5f9;
  }

  .vocab-phonetic {
    font-size: 0.85rem;
    color: #38bdf8;
  }

  .vocab-translation {
    font-size: 0.85rem;
    color: #94a3b8;
  }

  .quiz-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .quiz-row {
    background: #0f172a;
    border: 1px solid var(--border);
    padding: 18px 20px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .prompt-sentence {
    font-size: 1.05rem;
    font-weight: 600;
    color: #f1f5f9;
    line-height: 1.5;
  }

  .input-wrapper {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  input[type="text"] {
    font-family: inherit;
    font-size: 1rem;
    color: #f8fafc;
    background-color: #1e293b;
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    outline: none;
    transition: all 0.2s ease;
    width: 100%;
    box-sizing: border-box;
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }

  input[type="text"].correct-input {
    border-color: var(--correct);
    background-color: #064e3b;
    color: #a7f3d0;
  }

  input[type="text"].wrong-input {
    border-color: var(--wrong);
    background-color: #7f1d1d;
    color: #fecaca;
  }

  .feedback {
    font-size: 0.9rem;
    font-weight: 600;
    display: none;
  }

  .feedback.show {
    display: block;
  }

  .feedback.correct-text {
    color: #4ade80;
  }

  .feedback.wrong-text {
    color: #fca5a5;
  }

  .speaker-btn {
    background: #334155;
    border: none;
    color: #f8fafc;
    cursor: pointer;
    font-size: 0.85rem;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.2s ease;
  }

  .speaker-btn:hover {
    background: var(--accent);
    color: #0f172a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    justify-content: center;
    gap: 12px;
  }

  .action-btn {
    background-color: var(--accent);
    color: #0f172a;
    font-size: 1rem;
    font-weight: 800;
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .action-btn:hover {
    background-color: #7dd3fc;
    transform: translateY(-2px);
  }

  .action-btn.secondary {
    background-color: #475569;
    color: #ffffff;
  }

  .action-btn.secondary:hover {
    background-color: #64748b;
  }

  .score-board {
    font-size: 1.1rem;
    font-weight: 700;
    color: #38bdf8;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h2>Exercise 3. Make the sentences negative 🚫</h2>
      <div class="subtitle">Зробіть речення заперечними.</div>
    </div>
    <div class="score-board">Score: <span id="score">0</span> / 10</div>
  </div>

  <!-- Vocabulary Section -->
  <div class="section-title">1. Key Grammar & Vocabulary (Лексика та вимова)</div>
  <div class="vocab-grid" id="vocab-container"></div>

  <!-- Exercise Questions -->
  <div class="section-title">2. Transform to Negative</div>
  <div class="quiz-list" id="quiz-container"></div>

  <div class="controls">
    <button class="action-btn" onclick="checkAnswers()">Check Answers ✨</button>
    <button class="action-btn secondary" onclick="resetGame()">Reset 🔄</button>
  </div>
</div>

<script>
  const wordBank = [
    { word: "is not / isn't", phonetic: "[ɪz nɒt] / [ˈɪz.ənt]", ukr: "не є" },
    { word: "am not", phonetic: "[æm nɒt]", ukr: "не є (для I)" },
    { word: "a manager", phonetic: "[ə ˈmæn.ɪ.dʒər]", ukr: "менеджер" },
    { word: "an assistant", phonetic: "[ən əˈsɪs.tənt]", ukr: "асистент" },
    { word: "on time", phonetic: "[ɒn taɪm]", ukr: "вчасно" },
    { word: "a weekday", phonetic: "[ə ˈwiːk.deɪ]", ukr: "будній день" }
  ];

  const questions = [
    {
      id: 1,
      num: "1.",
      src: "She is a manager.",
      displayCorrect: "She is not a manager. / She isn't a manager.",
      answers: [
        "she is not a manager",
        "she isn't a manager",
        "she's not a manager"
      ]
    },
    {
      id: 2,
      num: "2.",
      src: "He is an assistant.",
      displayCorrect: "He is not an assistant. / He isn't an assistant.",
      answers: [
        "he is not an assistant",
        "he isn't an assistant",
        "he's not an assistant"
      ]
    },
    {
      id: 3,
      num: "3.",
      src: "The meeting is on Monday.",
      displayCorrect: "The meeting is not on Monday. / The meeting isn't on Monday.",
      answers: [
        "the meeting is not on monday",
        "the meeting isn't on monday"
      ]
    },
    {
      id: 4,
      num: "4.",
      src: "The office is empty.",
      displayCorrect: "The office is not empty. / The office isn't empty.",
      answers: [
        "the office is not empty",
        "the office isn't empty"
      ]
    },
    {
      id: 5,
      num: "5.",
      src: "I am busy today.",
      displayCorrect: "I am not busy today. / I'm not busy today.",
      answers: [
        "i am not busy today",
        "i'm not busy today"
      ]
    },
    {
      id: 6,
      num: "6.",
      src: "She is at work.",
      displayCorrect: "She is not at work. / She isn't at work.",
      answers: [
        "she is not at work",
        "she isn't at work",
        "she's not at work"
      ]
    },
    {
      id: 7,
      num: "7.",
      src: "He is at home on Sunday.",
      displayCorrect: "He is not at home on Sunday. / He isn't at home on Sunday.",
      answers: [
        "he is not at home on sunday",
        "he isn't at home on sunday",
        "he's not at home on sunday"
      ]
    },
    {
      id: 8,
      num: "8.",
      src: "The report is ready.",
      displayCorrect: "The report is not ready. / The report isn't ready.",
      answers: [
        "the report is not ready",
        "the report isn't ready"
      ]
    },
    {
      id: 9,
      num: "9.",
      src: "The manager is on time.",
      displayCorrect: "The manager is not on time. / The manager isn't on time.",
      answers: [
        "the manager is not on time",
        "the manager isn't on time"
      ]
    },
    {
      id: 10,
      num: "10.",
      src: "Sunday is a weekday.",
      displayCorrect: "Sunday is not a weekday. / Sunday isn't a weekday.",
      answers: [
        "sunday is not a weekday",
        "sunday isn't a weekday"
      ]
    }
  ];

  function cleanText(str) {
    return str.toLowerCase()
      .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'’"–—]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function renderVocab() {
    const vocabEl = document.getElementById('vocab-container');
    vocabEl.innerHTML = wordBank.map(item => `
      <div class="vocab-card">
        <div class="vocab-info">
          <span class="vocab-word">${item.word}</span>
          <span class="vocab-phonetic">${item.phonetic}</span>
          <span class="vocab-translation">${item.ukr}</span>
        </div>
        <button class="speaker-btn" onclick="speakWord('${item.word}')" title="Listen">🔊</button>
      </div>
    `).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';

    questions.forEach(q => {
      const row = document.createElement('div');
      row.className = 'quiz-row';

      row.innerHTML = `
        <div class="prompt-sentence">
          <b>${q.num}</b> ${q.src}
        </div>
        <div class="input-wrapper">
          <input type="text" id="input-${q.id}" placeholder="Type negative sentence here..." autocomplete="off" />
          <div class="feedback" id="feedback-${q.id}"></div>
        </div>
      `;

      container.appendChild(row);
    });
  }

  function speakWord(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }
  }

  function checkAnswers() {
    let score = 0;

    questions.forEach(q => {
      const inputEl = document.getElementById(`input-${q.id}`);
      const feedbackEl = document.getElementById(`feedback-${q.id}`);
      const userVal = cleanText(inputEl.value);

      inputEl.classList.remove('correct-input', 'wrong-input');
      feedbackEl.classList.remove('show', 'correct-text', 'wrong-text');

      const isCorrect = q.answers.some(ans => cleanText(ans) === userVal);

      if (userVal !== "" && isCorrect) {
        score++;
        inputEl.classList.add('correct-input');
        feedbackEl.innerText = "✓ Perfect negative sentence!";
        feedbackEl.classList.add('show', 'correct-text');
      } else {
        inputEl.classList.add('wrong-input');
        feedbackEl.innerText = `💡 Key answer: "${q.displayCorrect}"`;
        feedbackEl.classList.add('show', 'wrong-text');
      }
    });

    document.getElementById('score').innerText = score;
  }

  function resetGame() {
    document.getElementById('score').innerText = 0;
    renderQuiz();
  }

  window.onload = () => {
    renderVocab();
    renderQuiz();
  };
</script>

</body>
</html>
