<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business English - Let's Discuss</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#FFF1F2',
                            pinkBorder: '#FECDD3',
                            pinkText: '#E11D48',
                            yellow: '#FEFCE8',
                            yellowBorder: '#FEF08A',
                            yellowText: '#CA8A04',
                            green: '#F0FDF4',
                            greenBorder: '#BBF7D0',
                            greenText: '#16A34A',
                            blue: '#EFF6FF',
                            blueBorder: '#BFDBFE',
                            blueText: '#2563EB',
                            purple: '#FAF5FF',
                            purpleBorder: '#E9D5FF',
                            purpleText: '#9333EA',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #F8FAFC 0%, #EFF6FF 50%, #FAF5FF 100%);
            min-height: 100vh;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
        }
        .glass-header {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="font-sans text-slate-800 p-4 sm:p-6 md:p-10">

    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Header Banner -->
        <header class="glass-header rounded-3xl p-6 md:p-8 border border-slate-200/80 card-shadow flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-400 to-orange-500 flex items-center justify-center text-white text-3xl shadow-lg shadow-orange-500/20 flex-shrink-0">
                    <i class="fa-solid fa-bullhorn animate-bounce"></i>
                </div>
                <div>
                    <span class="text-xs font-bold uppercase tracking-widest text-orange-600 bg-orange-100 px-3 py-1 rounded-full">Speaking Practice</span>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mt-1">
                        Let's Discuss
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500 font-medium">Business English Communication Module</p>
                </div>
            </div>

            <!-- Global Action Bar -->
            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto justify-stretch md:justify-end">
                <button id="toggle-hints-btn" onclick="toggleGlobalHints()" class="flex-1 md:flex-none px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-semibold rounded-xl transition-all flex items-center justify-center gap-2">
                    <i id="hints-btn-icon" class="fa-regular fa-eye-slash"></i>
                    <span id="hints-btn-text">Hide Hints</span>
                </button>
                <button onclick="exportNotes()" class="flex-1 md:flex-none px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-semibold rounded-xl transition-all shadow-md shadow-slate-900/10 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Export Notes</span>
                </button>
            </div>
        </header>

        <!-- Progress Bar & Stats -->
        <section class="bg-white rounded-2xl p-5 border border-slate-200/70 card-shadow space-y-3">
            <div class="flex justify-between items-center text-xs sm:text-sm font-bold">
                <span class="text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-blue-600"></i> Completion Progress
                </span>
                <span id="progress-text" class="text-blue-600 font-extrabold">0 / 5 Completed</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden p-0.5 border border-slate-200/50">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
        </section>

        <!-- Main Questions Container -->
        <main id="questions-list" class="space-y-6">
            <!-- Rendered by JS -->
        </main>

    </div>

    <script>
        const questions = [
            {
                id: 1,
                num: "01",
                question: "What does successful communication mean to you?",
                translation: "Що для вас означає успішна комунікація?",
                cardBg: "bg-pastel-pink",
                borderColor: "border-pastel-pinkBorder",
                badgeBg: "bg-rose-100 text-rose-700",
                accentColor: "text-rose-600",
                starters: [
                    "For me, successful communication means...",
                    "In my opinion, it is achieved when...",
                    "From a professional standpoint, key communication is...",
                    "It's not just about sharing information, but also..."
                ],
                vocab: [
                    { word: "Mutual understanding", ua: "Взаєморозуміння" },
                    { word: "Active listening", ua: "Активне слухання" },
                    { word: "Convey a message", ua: "Передавати/доносити думку" },
                    { word: "Clarity & conciseness", ua: "Чіткість та стислість" }
                ]
            },
            {
                id: 2,
                num: "02",
                question: "Would you say that good communication is central to business?",
                translation: "Чи вважаєте ви, що якісна комунікація є основою бізнесу?",
                cardBg: "bg-pastel-yellow",
                borderColor: "border-pastel-yellowBorder",
                badgeBg: "bg-amber-100 text-amber-800",
                accentColor: "text-amber-600",
                starters: [
                    "Absolutely, because without effective communication...",
                    "I completely agree that communication is the backbone of...",
                    "I'd go as far as to say that miscommunication costs...",
                    "While technical skills matter, communication is central because..."
                ],
                vocab: [
                    { word: "Backbone of business", ua: "Основа / опора бізнесу" },
                    { word: "Streamline operations", ua: "Оптимізувати операції" },
                    { word: "Avoid miscommunication", ua: "Уникати непорозумінь" },
                    { word: "Drive business results", ua: "Сприяти бізнес-результатам" }
                ]
            },
            {
                id: 3,
                num: "03",
                question: "What is the secret to successful communication?",
                translation: "У чому секрет успішного спілкування?",
                cardBg: "bg-pastel-green",
                borderColor: "border-pastel-greenBorder",
                badgeBg: "bg-emerald-100 text-emerald-800",
                accentColor: "text-emerald-600",
                starters: [
                    "I believe the secret lies in...",
                    "One of the most important elements is empathy...",
                    "It all comes down to understanding your audience...",
                    "The key factor is being able to listen carefully rather than..."
                ],
                vocab: [
                    { word: "Tailor the message", ua: "Адаптувати повідомлення" },
                    { word: "Empathy", ua: "Емпатія / розуміння співрозмовника" },
                    { word: "Constructive feedback", ua: "Конструктивний зворотний зв'язок" },
                    { word: "Non-verbal cues", ua: "Невербальні сигнали" }
                ]
            },
            {
                id: 4,
                num: "04",
                question: "Is it important to make a good first impression? Why?",
                translation: "Чи важливо справити гарне перше враження? Чому?",
                cardBg: "bg-pastel-blue",
                borderColor: "border-pastel-blueBorder",
                badgeBg: "bg-blue-100 text-blue-800",
                accentColor: "text-blue-600",
                starters: [
                    "Yes, because you never get a second chance to...",
                    "Making a good first impression helps to build trust...",
                    "It sets the tone for future cooperation because...",
                    "While first impressions are important, long-term competence..."
                ],
                vocab: [
                    { word: "Set the tone", ua: "Задати тон / настрій" },
                    { word: "Build credibility", ua: "Будувати довіру та авторитет" },
                    { word: "Professional decorum", ua: "Професійне етикетне поводження" },
                    { word: "Lasting impression", ua: "Незабутнє/тривале враження" }
                ]
            },
            {
                id: 5,
                num: "05",
                question: "How important is small talk in a business situation?",
                translation: "Наскільки важливий small talk (неформальна бесіда) у бізнес-ситуації?",
                cardBg: "bg-pastel-purple",
                borderColor: "border-pastel-purpleBorder",
                badgeBg: "bg-purple-100 text-purple-800",
                accentColor: "text-purple-600",
                starters: [
                    "Small talk is essential because it breaks the ice...",
                    "It allows professionals to establish rapport before...",
                    "In many business cultures, small talk is crucial for...",
                    "While some consider it filler, I find it useful for..."
                ],
                vocab: [
                    { word: "Break the ice", ua: "Розтопити лід / розпочати розмову" },
                    { word: "Establish rapport", ua: "Встановити контакт/взаєморозуміння" },
                    { word: "Cultural nuances", ua: "Культурні нюанси" },
                    { word: "Ease into business", ua: "Плавно перейти до справи" }
                ]
            }
        ];

        let hintsVisible = true;
        let activeTimers = {};

        document.addEventListener('DOMContentLoaded', () => {
            renderQuestions();
            updateProgress();
        });

        function renderQuestions() {
            const container = document.getElementById('questions-list');
            container.innerHTML = '';

            questions.forEach(q => {
                const noteValue = localStorage.getItem(`be_note_${q.id}`) || '';

                const card = document.createElement('article');
                card.className = `${q.cardBg} rounded-3xl border ${q.borderColor} card-shadow p-6 sm:p-7 space-y-5 transition-all`;

                card.innerHTML = `
                    <!-- Question Top Header -->
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex items-start gap-3.5">
                            <span class="${q.badgeBg} font-extrabold text-xs px-3 py-1.5 rounded-xl tracking-wider uppercase mt-0.5">
                                ${q.num}
                            </span>
                            <div>
                                <h2 class="text-lg sm:text-xl font-bold text-slate-900 leading-snug">
                                    ${q.question}
                                </h2>
                                <p class="translation-text text-xs sm:text-sm text-slate-500 font-medium italic mt-1 flex items-center gap-1.5">
                                    <i class="fa-solid fa-language text-slate-400"></i> ${q.translation}
                                </p>
                            </div>
                        </div>

                        <!-- Action Audio & Timer Buttons -->
                        <div class="flex items-center gap-2 flex-shrink-0">
                            <!-- Speech Button -->
                            <button onclick="speakQuestion('${q.question.replace(/'/g, "\\'")}', this)" 
                                    title="Listen to pronunciation" 
                                    class="p-3 bg-white hover:bg-slate-50 text-slate-700 rounded-2xl border border-slate-200/80 shadow-sm transition-all flex items-center justify-center">
                                <i class="fa-solid fa-volume-high text-slate-600"></i>
                            </button>
                            <!-- 60s Pitch Timer Button -->
                            <button onclick="toggleTimer(${q.id})" 
                                    title="1-Minute Speaking Pitch Timer" 
                                    class="p-3 bg-white hover:bg-slate-50 text-slate-700 rounded-2xl border border-slate-200/80 shadow-sm transition-all flex items-center justify-center gap-1.5 min-w-[44px]">
                                <i class="fa-regular fa-clock text-slate-600"></i>
                                <span id="timer-display-${q.id}" class="text-xs font-bold text-slate-600 hidden">60s</span>
                            </button>
                        </div>
                    </div>

                    <!-- Expandable Hints & Helpers Container -->
                    <div id="hints-section-${q.id}" class="hints-box bg-white/80 backdrop-blur-sm rounded-2xl p-4 sm:p-5 border border-slate-200/60 space-y-4">
                        <!-- Sentence Starters -->
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-2">
                                <i class="fa-solid fa-comments ${q.accentColor} mr-1"></i> Sentence Starters (Click to insert):
                            </span>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${q.starters.map(starter => `
                                    <button onclick="appendStarter(${q.id}, '${starter.replace(/'/g, "\\'")}')" 
                                            class="text-left text-xs text-slate-700 bg-slate-50/80 hover:bg-white hover:border-slate-300 border border-slate-200/60 p-2.5 rounded-xl transition-all flex items-center justify-between group">
                                        <span>"${starter}"</span>
                                        <i class="fa-solid fa-plus opacity-0 group-hover:opacity-100 ${q.accentColor} text-xs transition-opacity"></i>
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Vocabulary -->
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block mb-2">
                                <i class="fa-solid fa-book-open ${q.accentColor} mr-1"></i> Helpful Vocabulary & Idioms:
                            </span>
                            <div class="flex flex-wrap gap-2">
                                ${q.vocab.map(v => `
                                    <span class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 border border-slate-200/60 rounded-xl text-xs font-semibold text-slate-700">
                                        <span class="${q.accentColor}">${v.word}</span>
                                        <span class="text-slate-400 font-normal">(${v.ua})</span>
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Notes Input Field -->
                    <div class="space-y-2">
                        <div class="flex justify-between items-center px-1">
                            <label for="note-${q.id}" class="text-xs font-bold text-slate-600 flex items-center gap-1.5">
                                <i class="fa-regular fa-pen-to-square"></i> Student Speaking Notes & Response:
                            </label>
                            <span id="save-status-${q.id}" class="text-[11px] font-medium text-emerald-600 transition-opacity opacity-0 flex items-center gap-1">
                                <i class="fa-solid fa-check"></i> Saved
                            </span>
                        </div>
                        <textarea id="note-${q.id}" 
                                  oninput="handleNoteInput(${q.id})"
                                  placeholder="Type your notes or response here..." 
                                  rows="3" 
                                  class="w-full text-xs sm:text-sm p-4 rounded-2xl border border-slate-200 focus:border-indigo-400 focus:ring-4 focus:ring-indigo-100 outline-none resize-y transition-all text-slate-800 bg-white placeholder-slate-300 shadow-inner">${noteValue}</textarea>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Text-to-speech
        function speakQuestion(text, btn) {
            if (!('speechSynthesis' in window)) {
                alert('Speech synthesis is not supported in your browser.');
                return;
            }

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;

            const icon = btn.querySelector('i');
            icon.className = 'fa-solid fa-spinner fa-spin text-indigo-600';

            utterance.onend = () => { icon.className = 'fa-solid fa-volume-high text-slate-600'; };
            utterance.onerror = () => { icon.className = 'fa-solid fa-volume-high text-slate-600'; };

            window.speechSynthesis.speak(utterance);
        }

        // Insert Sentence Starter
        function appendStarter(id, text) {
            const textarea = document.getElementById(`note-${id}`);
            if (!textarea) return;

            if (!textarea.value.trim()) {
                textarea.value = text + " ";
            } else {
                textarea.value += "\n" + text + " ";
            }
            textarea.focus();
            handleNoteInput(id);
        }

        // Handle Note Auto-Save & Progress Update
        function handleNoteInput(id) {
            const textarea = document.getElementById(`note-${id}`);
            const status = document.getElementById(`save-status-${id}`);

            localStorage.setItem(`be_note_${id}`, textarea.value);

            // Show indicator
            status.style.opacity = '1';
            setTimeout(() => { status.style.opacity = '0'; }, 1200);

            updateProgress();
        }

        // Progress Counter
        function updateProgress() {
            let completed = 0;
            questions.forEach(q => {
                const note = localStorage.getItem(`be_note_${q.id}`) || '';
                if (note.trim().length > 0) completed++;
            });

            const percent = (completed / questions.length) * 100;
            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('progress-text').textContent = `${completed} / ${questions.length} Completed`;
        }

        // Toggle 1-Minute Speaking Pitch Timer
        function toggleTimer(id) {
            const display = document.getElementById(`timer-display-${id}`);

            if (activeTimers[id]) {
                clearInterval(activeTimers[id].interval);
                delete activeTimers[id];
                display.classList.add('hidden');
                display.textContent = '60s';
                return;
            }

            let timeLeft = 60;
            display.classList.remove('hidden');
            display.textContent = `${timeLeft}s`;

            const interval = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    delete activeTimers[id];
                    display.textContent = 'Done!';
                    display.classList.add('text-emerald-600');
                    setTimeout(() => {
                        display.classList.add('hidden');
                        display.classList.remove('text-emerald-600');
                        display.textContent = '60s';
                    }, 3000);
                } else {
                    display.textContent = `${timeLeft}s`;
                }
            }, 1000);

            activeTimers[id] = { interval };
        }

        // Global Toggle Hints/Translations
        function toggleGlobalHints() {
            hintsVisible = !hintsVisible;
            const hintBoxes = document.querySelectorAll('.hints-box');
            const translationTexts = document.querySelectorAll('.translation-text');
            const btnText = document.getElementById('hints-btn-text');
            const btnIcon = document.getElementById('hints-btn-icon');

            hintBoxes.forEach(box => {
                box.style.display = hintsVisible ? 'block' : 'none';
            });

            translationTexts.forEach(txt => {
                txt.style.display = hintsVisible ? 'flex' : 'none';
            });

            btnText.textContent = hintsVisible ? 'Hide Hints' : 'Show Hints';
            btnIcon.className = hintsVisible ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        }

        // Export Notes
        function exportNotes() {
            let fileContent = "==================================================\n";
            fileContent += " BUSINESS ENGLISH: LET'S DISCUSS - STUDENT NOTES\n";
            fileContent += "==================================================\n\n";

            let hasContent = false;

            questions.forEach(q => {
                const note = localStorage.getItem(`be_note_${q.id}`) || '(No notes entered)';
                if (note.trim() && note !== '(No notes entered)') hasContent = true;

                fileContent += `Question ${q.num}: ${q.question}\n`;
                fileContent += `Notes:\n${note}\n`;
                fileContent += "--------------------------------------------------\n\n";
            });

            const blob = new Blob([fileContent], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'Business_English_Discussion_Notes.txt';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
