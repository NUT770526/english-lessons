<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Упражнение 4 — Выберите правильный вариант</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #4ade80;
            --accent-red: #f87171;
            --border-color: #334155;
            --input-bg: #111827;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Vocab Table */
        .vocab-table-container {
            margin-bottom: 30px;
            overflow-x: auto;
        }

        .vocab-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--input-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .vocab-table th, .vocab-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .vocab-table th {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            font-weight: 700;
        }

        .audio-btn {
            background: rgba(56, 189, 248, 0.2);
            border: none;
            color: var(--accent-blue);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-blue);
            color: #0f172a;
        }

        /* MCQ Styles */
        .question-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .question-card {
            background: var(--input-bg);
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            transition: all 0.2s ease;
        }

        .question-card.correct {
            border-color: var(--accent-green) !important;
            background: rgba(74, 222, 128, 0.08) !important;
        }

        .question-card.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(248, 113, 113, 0.08) !important;
        }

        .question-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            border-color: var(--accent-blue);
        }

        .option-label input[type="radio"] {
            accent-color: var(--accent-blue);
            cursor: pointer;
        }

        .controls {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .score-display {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.92rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-check {
            background: var(--accent-blue);
            color: #0f172a;
        }

        .btn-check:hover {
            background: #0284c7;
            color: #fff;
        }

        .btn-reset {
            background: #1f293d;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-reset:hover {
            background: #2d3d5c;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- VOCABULARY SECTION -->
    <div class="section-title">📖 Словарь (с озвучкой)</div>
    <div class="vocab-table-container">
        <table class="vocab-table">
            <thead>
                <tr>
                    <th>Слово</th>
                    <th>Перевод</th>
                    <th style="text-align: center;">Озвучка</th>
                </tr>
            </thead>
            <tbody id="vocabBody"></tbody>
        </table>
    </div>

    <!-- EXERCISE SECTION -->
    <div class="section-title">✏️ 4. Выберите правильный вариант</div>
    <div class="question-list" id="questionList"></div>

    <div class="controls">
        <div class="score-display" id="scoreDisplay">Результат: - / 15</div>
        <div class="btn-group">
            <button class="btn btn-check" onclick="checkAnswers()">Проверить ✔️</button>
            <button class="btn btn-reset" onclick="resetExercise()">Сбросить 🔄</button>
        </div>
    </div>
</div>

<script>
    const dictionary = [
        { word: "honest", translation: "честный" },
        { word: "helpful", translation: "готовый помочь / полезный" },
        { word: "ambitious", translation: "амбициозный / целеустремлённый" },
        { word: "reliable", translation: "надёжный" },
        { word: "possible", translation: "возможный" },
        { word: "selfish", translation: "эгоистичный" },
        { word: "friendly", translation: "дружелюбный" },
        { word: "mature", translation: "зрелый / взрослый" },
        { word: "attractive", translation: "привлекательный" },
        { word: "intelligent", translation: "умный / разумный" },
        { word: "organized", translation: "организованный" },
        { word: "polite", translation: "вежливый" },
        { word: "patient", translation: "терпеливый" },
        { word: "hard-working", translation: "трудолюбивый" },
        { word: "creative", translation: "творческий" }
    ];

    const questions = [
        { id: 1, text: "A person who always tells the truth is:", options: ["selfish", "honest", "attractive"], correct: "honest" },
        { id: 2, text: "A person who is ready to help is:", options: ["helpful", "ambitious", "employed"], correct: "helpful" },
        { id: 3, text: "A person who has clear goals and wants to be successful is:", options: ["friendly", "mature", "ambitious"], correct: "ambitious" },
        { id: 4, text: "A person you can trust is:", options: ["reliable", "selfish", "possible"], correct: "reliable" },
        { id: 5, text: "If something can happen, it is:", options: ["intelligent", "possible", "organized"], correct: "possible" },
        { id: 6, text: "A person who thinks only about himself is:", options: ["polite", "selfish", "patient"], correct: "selfish" },
        { id: 7, text: "A person who is kind and pleasant to other people is:", options: ["friendly", "possible", "mature"], correct: "friendly" },
        { id: 8, text: "A person who behaves like an adult and makes good decisions is:", options: ["attractive", "mature", "hard-working"], correct: "mature" },
        { id: 9, text: "A person who is good-looking and nice to watch is:", options: ["attractive", "reliable", "polite"], correct: "attractive" },
        { id: 10, text: "A person who is clever and understands things quickly is:", options: ["selfish", "intelligent", "possible"], correct: "intelligent" },
        { id: 11, text: "A person who plans everything well is:", options: ["organized", "helpful", "friendly"], correct: "organized" },
        { id: 12, text: "A person who has good manners and says \"thank you\" is:", options: ["polite", "ambitious", "selfish"], correct: "polite" },
        { id: 13, text: "A person who can wait for a long time without getting angry is:", options: ["patient", "attractive", "reliable"], correct: "patient" },
        { id: 14, text: "A person who works a lot and stays focused is:", options: ["hard-working", "possible", "mature"], correct: "hard-working" },
        { id: 15, text: "A person who creates new and original ideas is:", options: ["creative", "polite", "honest"], correct: "creative" }
    ];

    function speak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
        }
    }

    function renderVocab() {
        const tbody = document.getElementById('vocabBody');
        tbody.innerHTML = '';
        dictionary.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.word}</strong></td>
                <td style="color: var(--text-muted);">${item.translation}</td>
                <td style="text-align: center;">
                    <button class="audio-btn" onclick="speak('${item.word}')" title="Прослушать">🔊</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function renderQuestions() {
        const list = document.getElementById('questionList');
        list.innerHTML = '';

        questions.forEach(q => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-${q.id}`;

            const labels = ['a', 'b', 'c'];
            let optionsHtml = '';
            
            q.options.forEach((opt, idx) => {
                optionsHtml += `
                    <label class="option-label">
                        <input type="radio" name="q${q.id}" value="${opt}">
                        <span><strong>${labels[idx]})</strong> ${opt}</span>
                        <button class="audio-btn" onclick="event.preventDefault(); speak('${opt}')" style="margin-left: auto;">🔊</button>
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="question-header">
                    <span>${q.id}. ${q.text}</span>
                    <button class="audio-btn" onclick="speak('${q.text.replace(/'/g, "\\'")}')" title="Прослушать вопрос">🔊</button>
                </div>
                <div class="options-group">${optionsHtml}</div>
            `;
            list.appendChild(card);
        });
    }

    function checkAnswers() {
        let correctCount = 0;

        questions.forEach(q => {
            const card = document.getElementById(`q-${q.id}`);
            const selected = document.querySelector(`input[name="q${q.id}"]:checked`);

            card.classList.remove('correct', 'incorrect');

            if (selected && selected.value === q.correct) {
                card.classList.add('correct');
                correctCount++;
            } else {
                card.classList.add('incorrect');
            }
        });

        const scoreDisplay = document.getElementById('scoreDisplay');
        scoreDisplay.textContent = `Результат: ${correctCount} / ${questions.length}`;
        scoreDisplay.style.color = correctCount === questions.length ? 'var(--accent-green)' : 'var(--accent-blue)';
    }

    function resetExercise() {
        questions.forEach(q => {
            const card = document.getElementById(`q-${q.id}`);
            card.classList.remove('correct', 'incorrect');
            const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (checked) checked.checked = false;
        });

        document.getElementById('scoreDisplay').textContent = `Результат: - / ${questions.length}`;
        document.getElementById('scoreDisplay').style.color = 'var(--accent-blue)';
    }

    window.onload = () => {
        renderVocab();
        renderQuestions();
    };
</script>

</body>
</html>
